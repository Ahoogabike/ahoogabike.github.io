@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap');
:root{
  --paper:#f7f4ec;--paper-2:#efe9dc;--card:#fff;--line:#e4ddcd;--line-soft:#eee8da;
  --ink:#1d1c16;--ink-dim:#6b6557;--ink-faint:#9a9384;--gold:#c9991f;--pink:#ea1d5e;

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Archivo',system-ui,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}

header{display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:64px;background:rgba(255,255,255,.8);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.logo{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:-.5px;font-size:18px}
.logo .b{color:var(--pink)}

a.r-so:hover{text-decoration:underline}
.r-meta{font-size:12px;color:var(--ink-dim)}
.badge{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:3px 9px;border-radius:20px;white-space:nowrap}

.box{flex:1;min-width:240px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}
.box.full{flex-basis:100%}
.box h4{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-faint);margin-bottom:8px}
.minif{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.minif .fld{min-width:90px}

table.pkg select{width:72px}

<body>
<header>
  <div class="logo">DSV <span class="b">Ship</span> <span class="tag">Odoo → DSV</span> <span class="tag" style="background:#0a7d32;color:#fff">build 2026‑07‑02c (+ StoreRocket hours + myDSV tracking link)</span></div>
  <div class="pills">
    <span id="dsv-pill" class="pill">DSV: ?</span>
    <span id="conn-pill" class="pill">Not connected</span>
  </div>
</header>

<div class="wrap">
  <div class="connect">
    <div class="fld"><label>Odoo Email</label><input id="cfg-user" placeholder="yourname@ahooga.bike"/></div>
    <div class="fld"><label>Odoo Password / API key</label><input id="cfg-key" type="password" placeholder="your odoo password"/></div>
    <button class="btn" onclick="connectAndLoad()">Connect &amp; load transfers →</button>
    <button class="btn ghost" onclick="loadDeliveries()">Refresh</button>
  </div>

  <div id="alert"></div>

  <div class="tabs">
    <button class="tab active" id="nav-deliveries" onclick="showTab('deliveries')">Transfers</button>
    <button class="tab" id="nav-track" onclick="showTab('track')">Track</button>
    <button class="tab" id="nav-settings" onclick="showTab('settings')">Settings</button>
  </div>

  <div class="view active" id="view-deliveries">
    <div class="toolbar">
      <div class="fld"><label>Type</label>
        <select id="ptype" onchange="loadDeliveries()">
          <option value="both">Outgoing + Internal</option>
          <option value="outgoing">Outgoing only</option>
          <option value="internal">Internal only</option>
        </select>
      </div>
      <div class="fld"><label>Show</label>
        <select id="pstate" onchange="loadDeliveries()">
          <option value="open">Ready + Waiting</option>
          <option value="all">All (incl. done)</option>
        </select>
      </div>
      <div class="fld"><label>How many</label>
        <select id="plimit" onchange="loadDeliveries()">
          <option value="80">80</option>
          <option value="200">200</option>
          <option value="500">500</option>
        </select>
      </div>
      <div class="fld" style="flex:1"><label>Filter</label><input type="text" id="pfilter" placeholder="name, customer or SO…" oninput="onFilterInput()"/></div>
      <label class="muted" style="font-size:12.5px;padding-bottom:10px"><input type="checkbox" id="hide-booked" onchange="renderDeliveries()"/> hide booked</label>
    </div>
    <div class="muted" style="font-size:12.5px;margin-bottom:8px" id="del-count"></div>
    <div id="del-list"><div class="empty">Enter your Odoo email + password, then “Connect &amp; load transfers”.</div></div>
  </div>

  <div class="view" id="view-track">
    <div class="toolbar">
      <div class="fld" style="max-width:340px"><label>DSV Booking ID</label><input id="trk-id" placeholder="e.g. 40288888880001206469"/></div>
      <button class="btn blue sm" onclick="doTrack()">Track →</button>
    </div>
    <div id="trk-body"><div class="empty">Enter a DSV booking ID to fetch its latest status &amp; events.</div></div>
  </div>

  <div class="view" id="view-settings"><div id="settings-body"></div></div>
</div>
<script>
/* DSV Ship — hosted front-end. Odoo via planner-proxy; DSV via ahooga-dsv-proxy worker. */
const CF_WORKER   = 'https://ahooga-odoo-proxy.ahoogahouse-1050-be.workers.dev';
const ODOO_URL    = 'https://ahooga.odoo.com';
const ODOO_DB     = 'logicasoft-aho-18-0-21599177';
const DSV_WORKER_DEFAULT = 'https://ahooga-dsv-proxy.ahoogahouse-1050-be.workers.dev';
let   DSV_WORKER = (function(){ try{ return localStorage.getItem('dsv_worker')||DSV_WORKER_DEFAULT; }catch(e){ return DSV_WORKER_DEFAULT; } })();

let odooUid=null, DELIVERIES=[], _ccache={}, _hasSaleId=true, PKGROWS={};
const DSV_PKG_TYPES=['CTN','EUR','PLL','CLL','BAG','CAS','DRM','PKG','PLT'];
const GROSS_FIELD='x_gross_weight';   // Odoo product field holding the GROSS weight (change here if the technical name differs)

const $ = (id)=>document.getElementById(id);
const cssId = (s)=>(s||'').replace(/[^a-z0-9]/gi,'');
const esc = (s)=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const num = (x)=> (x==null||x===''?0:Number(x));
const soOf = (d)=> (Array.isArray(d.sale_id)? d.sale_id[1] : '') || d.origin || '';

function setPill(state){ const p=$('conn-pill'); if(state==='ok'){p.textContent='✓ Connected';p.className='pill ok';} else if(state==='err'){p.textContent='Connection error';p.className='pill err';} else if(state==='loading'){p.innerHTML='<span class="spin"></span> Loading…';p.className='pill';} else {p.textContent='Not connected';p.className='pill';} }
function alert_(msg,type){ $('alert').innerHTML=`<div class="alert ${type}">${msg}</div>`; if(type==='ok') setTimeout(()=>{$('alert').innerHTML='';},6000); window.scrollTo({top:0,behavior:'smooth'}); }
function creds(){ return { user:$('cfg-user').value.trim(), key:$('cfg-key').value.trim() }; }

/* ── Odoo client ── */
function proxyUrl(path){ return `${CF_WORKER}/odoo/${encodeURIComponent(ODOO_URL+path)}`; }
function v(x){
  if(x===null||x===undefined) return '<value><boolean>0</boolean></value>';
  if(typeof x==='boolean') return `<value><boolean>${x?1:0}</boolean></value>`;
  if(typeof x==='number'&&Number.isInteger(x)) return `<value><int>${x}</int></value>`;
  if(typeof x==='number') return `<value><double>${x}</double></value>`;
  if(Array.isArray(x)) return `<value><array><data>${x.map(v).join('')}</data></array></value>`;
  if(typeof x==='object'){ const m=Object.entries(x).map(([k,vv])=>`<member><name>${k}</name>${v(vv)}</member>`).join(''); return `<value><struct>${m}</struct></value>`; }
  return `<value><string>${String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</string></value>`;
}
function parseXml(xml){
  const doc=new DOMParser().parseFromString(xml,'text/xml');
  if(doc.querySelector('fault')) throw new Error('Odoo: '+(doc.querySelector('faultString')?.textContent?.substring(0,200)||'fault'));
  function pv(n){ if(!n)return null; const c=n.firstElementChild; if(!c)return n.textContent;
    switch(c.tagName){
      case'int':case'i4':case'i8':return parseInt(c.textContent);
      case'double':return parseFloat(c.textContent);
      case'boolean':return c.textContent==='1';
      case'string':return c.textContent;
      case'nil':return null;
      case'array':return Array.from(c.querySelector('data')?.children||[]).map(pv);
      case'struct':{const o={};c.querySelectorAll(':scope>member').forEach(m=>{o[m.querySelector('name').textContent]=pv(m.querySelector('value'))});return o;}
      default:return c.textContent;
    } }
  return pv(doc.querySelector('methodResponse>params>param>value'));
}
async function odoo(model,method,args,kwargs={}){
  const {user,key}=creds();
  if(!odooUid){
    const b=`<?xml version="1.0"?><methodCall><methodName>authenticate</methodName><params>${[v(ODOO_DB),v(user),v(key),v({})].map(x=>`<param>${x}</param>`).join('')}</params></methodCall>`;
    const r=await fetch(proxyUrl('/xmlrpc/2/common'),{method:'POST',headers:{'Content-Type':'application/xml'},body:b});
    odooUid=parseXml(await r.text());
    if(!odooUid||typeof odooUid!=='number') throw new Error('Odoo authentication failed — check your email and password/API key.');
  }
  const params=[v(ODOO_DB),v(odooUid),v(key),v(model),v(method),v(args),v(kwargs)];
  const b=`<?xml version="1.0"?><methodCall><methodName>execute_kw</methodName><params>${params.map(x=>`<param>${x}</param>`).join('')}</params></methodCall>`;
  const r=await fetch(proxyUrl('/xmlrpc/2/object'),{method:'POST',headers:{'Content-Type':'application/xml'},body:b});
  return parseXml(await r.text());
}

/* ── DSV worker client ── */
async function dsv(path,body){
  const r=await fetch(`${DSV_WORKER}${path}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});
  const t=await r.text();
  let j; try{ j=JSON.parse(t); }catch(e){ j={ok:false,error:'DSV worker returned non-JSON: '+t.slice(0,200)}; }
  if(!r.ok && j && j.error==null) j.error='HTTP '+r.status;
  return j;
}
async function dsvPing(){
  const p=$('dsv-pill');
  try{ const r=await fetch(`${DSV_WORKER}/health`); const j=await r.json().catch(()=>({}));
    if(r.ok&&(j.ok||j.status==='ok')){ p.textContent='DSV: '+(j.env||'ready'); p.className='pill ok'; }
    else { p.textContent='DSV: not ready'; p.className='pill err'; }
  }catch(e){ p.textContent='DSV: unreachable'; p.className='pill err'; }
}

(function prefill(){ try{ const c=localStorage.getItem('mxp_cfg'); if(c){ const cfg=JSON.parse(c); if(cfg.user)$('cfg-user').value=cfg.user; if(cfg.key)$('cfg-key').value=cfg.key; } }catch(e){} })();

async function connectAndLoad(){
  const {user,key}=creds(); if(!user||!key){ alert_('Enter your Odoo email and password.','warn'); return; }
  odooUid=null; setPill('loading');
  try{
    try{ const c=localStorage.getItem('mxp_cfg'); const cfg=c?JSON.parse(c):{}; cfg.user=user; cfg.key=key; localStorage.setItem('mxp_cfg',JSON.stringify(cfg)); }catch(e){}
    await odoo('res.users','search_read',[[['id','=',1]]],{fields:['name'],limit:1});
    await loadDeliveries();
  }catch(e){ alert_('Could not connect: '+esc(e.message),'err'); setPill('err'); }
}

function typeDomain(){
  const t=$('ptype').value;
  if(t==='outgoing') return ['picking_type_code','=','outgoing'];
  if(t==='internal') return ['picking_type_code','=','internal'];
  return ['picking_type_code','in',['outgoing','internal']];
}

async function loadDeliveries(){
  const {user,key}=creds(); if(!user||!key){ alert_('Enter your Odoo email and password.','warn'); return; }
  setPill('loading');
  const states = $('pstate').value==='all' ? ['assigned','confirmed','done'] : ['assigned','confirmed'];
  const limit = parseInt($('plimit').value)||80;
  const baseFields=['name','state','origin','scheduled_date','date_done','partner_id','carrier_id','carrier_tracking_ref','weight','picking_type_code'];
  const domain=[typeDomain(),['state','in',states]];
  try{
    let pickings;
    try{ pickings=await odoo('stock.picking','search_read',[domain],{fields:baseFields.concat(_hasSaleId?['sale_id']:[]),limit,order:'scheduled_date desc'}); }
    catch(e){ if(_hasSaleId){ _hasSaleId=false; pickings=await odoo('stock.picking','search_read',[domain],{fields:baseFields,limit,order:'scheduled_date desc'}); } else throw e; }
    DELIVERIES=pickings||[];
    await attachPartners(DELIVERIES);
    setPill('ok'); renderDeliveries(); ensureStoreRocket();
    if(!DELIVERIES.length) alert_('No transfers found for this filter.','warn');
  }catch(e){ alert_('Could not load transfers: '+esc(e.message),'err'); setPill('err'); }
}

let _searchTimer=null;
async function attachPartners(records){
  const pids=[...new Set(records.map(d=>Array.isArray(d.partner_id)?d.partner_id[0]:null).filter(Boolean))];
  if(!pids.length) return;
  const partners={};
  const recs=await odoo('res.partner','read',[pids,['name','street','street2','zip','city','country_id','phone','email','lang','comment']]);
  (recs||[]).forEach(r=>{ partners[r.id]=r; });
  const cids=[...new Set((recs||[]).map(r=>Array.isArray(r.country_id)?r.country_id[0]:null).filter(Boolean))];
  if(cids.length){ const cs=await odoo('res.country','read',[cids,['code']]); (cs||[]).forEach(c=>{ _ccache[c.id]=c.code; }); }
  records.forEach(d=>{ const pid=Array.isArray(d.partner_id)?d.partner_id[0]:null; if(pid&&partners[pid]) d.partner=partners[pid]; });
}
/* Filter box also searches Odoo directly (debounced), so any SO / transfer is found regardless of the loaded window. */
function onFilterInput(){
  renderDeliveries();
  clearTimeout(_searchTimer);
  const q=($('pfilter').value||'').trim();
  if(q.length<2) return;
  _searchTimer=setTimeout(()=>serverSearch(q),400);
}
async function serverSearch(q){
  const {user,key}=creds(); if(!user||!key) return;
  const states = $('pstate').value==='all' ? ['assigned','confirmed','done'] : ['assigned','confirmed'];
  const baseFields=['name','state','origin','scheduled_date','date_done','partner_id','carrier_id','carrier_tracking_ref','weight','picking_type_code'];
  const or=[['name','ilike',q],['origin','ilike',q],['partner_id.name','ilike',q]];
  if(_hasSaleId) or.push(['sale_id.name','ilike',q]);
  const orPrefix=[]; for(let i=0;i<or.length-1;i++) orPrefix.push('|');
  const domain=['&','&',typeDomain(),['state','in',states]].concat(orPrefix).concat(or);
  const cnt=$('del-count'); const q0=q;
  try{
    if(cnt) cnt.textContent='Searching Odoo…';
    let found;
    try{ found=await odoo('stock.picking','search_read',[domain],{fields:baseFields.concat(_hasSaleId?['sale_id']:[]),limit:200,order:'scheduled_date desc'}); }
    catch(e){ if(_hasSaleId){ _hasSaleId=false; return serverSearch(q0); } throw e; }
    const have=new Set(DELIVERIES.map(d=>d.id));
    const fresh=(found||[]).filter(d=>!have.has(d.id));
    if(fresh.length){ await attachPartners(fresh); DELIVERIES=DELIVERIES.concat(fresh); }
    renderDeliveries();
  }catch(e){ renderDeliveries(); }
}
function soUrl(d){ return (Array.isArray(d.sale_id)&&d.sale_id[0]) ? (ODOO_URL+'/web#id='+d.sale_id[0]+'&model=sale.order&view_type=form') : ''; }
function soCell(d){ const so=soOf(d); const u=soUrl(d); return u ? `<a class="r-so" href="${u}" target="_blank" rel="noopener" title="Open sales order in Odoo" onclick="event.stopPropagation()">${esc(so)}</a>` : `<span class="r-so" title="Sales order / source">${esc(so)}</span>`; }

async function toggle(id,forceOpen){
  const el=$('d-'+id); if(!el)return;
  if(el.classList.contains('open')&&!forceOpen){ el.classList.remove('open'); el.innerHTML=''; return; }
  const d=DELIVERIES.find(x=>cssId(x.name)===id); if(!d)return;
  el.classList.add('open');
  if(!d._loaded){
    el.innerHTML='<div class="info"><span class="spin"></span> Loading transfer contents…</div>';
    try{ await loadPickingDetail(d); d._loaded=true; }
    catch(e){ d._lines=[]; d._loadErr=e.message; d._loaded=true; }
  }
  if(!PKGROWS[id]) PKGROWS[id]=buildRows(d);

async function loadPickingDetail(d){
  // validated move lines: product, done quantity, serial/lot, package
  const mls=await odoo('stock.move.line','search_read',[[['picking_id','=',d.id]]],
    {fields:['product_id','quantity','lot_id','lot_name','product_uom_id','result_package_id']});
  d._lines=mls||[];
  const pids=[...new Set(d._lines.map(m=>Array.isArray(m.product_id)?m.product_id[0]:null).filter(Boolean))];
  d._wt={};
  if(pids.length){
    let ps;
    try{ ps=await odoo('product.product','read',[pids,['weight','default_code',GROSS_FIELD]]); }
    catch(e){ ps=await odoo('product.product','read',[pids,['weight','default_code']]); }   // field missing → fall back
    (ps||[]).forEach(p=>{ const g=Number(p[GROSS_FIELD]); d._wt[p.id]={ weight:(g>0?g:(p.weight||0)), code:p.default_code, usedGross:(g>0) }; });
  }
  // packages used on the transfer → pull their type + dimensions (size mapping)
  d._odooPkgs=[];
  try{
    const pkgIds=[...new Set(d._lines.map(m=>Array.isArray(m.result_package_id)?m.result_package_id[0]:null).filter(Boolean))];
    if(pkgIds.length){
      const pks=await odoo('stock.quant.package','read',[pkgIds,['name','package_type_id','shipping_weight']]);
      const tids=[...new Set((pks||[]).map(x=>Array.isArray(x.package_type_id)?x.package_type_id[0]:null).filter(Boolean))];
      let types={};
      if(tids.length){ const ts=await odoo('stock.package.type','read',[tids,['name','packaging_length','width','height']]); (ts||[]).forEach(t=>{types[t.id]=t;}); }
      d._odooPkgs=(pks||[]).map(pk=>{ const t=Array.isArray(pk.package_type_id)?types[pk.package_type_id[0]]:null;
        const serials=(d._lines||[]).filter(m=>Array.isArray(m.result_package_id)&&m.result_package_id[0]===pk.id&&isBike(m,d)).map(serialOf).filter(Boolean);
        return { name:pk.name, typeName:Array.isArray(pk.package_type_id)?pk.package_type_id[1]:'',
          l:t?t.packaging_length:0, w:t?t.width:0, h:t?t.height:0, weight:pk.shipping_weight||0, serials }; });
    }
  }catch(e){ d._odooPkgs=[]; }
  // serials of bike lines (for the goods description when there are no packed packages)
  d._bikeSerials=(d._lines||[]).filter(m=>isBike(m,d)).map(serialOf).filter(Boolean);
}

/* ── package rows (multi-package) ── */
function guessDsvType(name,def){ const n=(name||'').toLowerCase(); if(n.includes('euro')) return 'EUR'; if(n.includes('pallet')||n.includes('palet')) return 'PLL'; if(n.includes('carton')||n.includes('box')||n.includes('doos')||n.includes('karton')) return 'CTN'; if(n.includes('colli')) return 'CLL'; return def||'CTN'; }
/* a move line counts as a "bike" if its product code starts with a bike prefix or the name says bike */
const BIKE_PREFIXES=['AHF','AHM','MARA'];
function serialOf(m){ return (Array.isArray(m.lot_id)?m.lot_id[1]:'')||m.lot_name||''; }
function isBike(m,d){
  const pid=Array.isArray(m.product_id)?m.product_id[0]:null;
  const code=((pid&&d._wt&&d._wt[pid]?d._wt[pid].code:'')||'').toUpperCase();
  const name=(Array.isArray(m.product_id)?m.product_id[1]:'').toLowerCase();
  return BIKE_PREFIXES.some(pfx=>code.startsWith(pfx)) || name.includes('bike');
}
/* ── bike packing rule ──
   < PALLET_THRESHOLD bikes → one carton per bike (BIKE_CARTON size, serial in description)
   >= PALLET_THRESHOLD bikes → consolidate onto pallet(s) (BIKES_PER_PALLET each, BIKE_PALLET size).
   Tweak the numbers below if your packing changes. Rows stay editable before booking. */
const BIKE_CARTON   = { l:72, w:42, h:74 };
const BIKE_PALLET   = { type:'EUR', l:120, w:80, h:150 };
const ACC_CARTON    = { l:40, w:20, h:30 };   // one carton for non-bike accessories
const PALLET_THRESHOLD = 5;   // 5 or more bikes → pallet(s)
const BIKES_PER_PALLET = 6;
/* non-bike goods on the transfer → one accessories carton (or null if none) */
function accessoryRowOf(d){
  const lines=(d._lines||[]).filter(m=>!isBike(m,d) && Array.isArray(m.product_id) && (m.quantity||0)>0);
  if(!lines.length) return null;
  const wt=lines.reduce((s,m)=>{ const pid=m.product_id[0]; const w=(d._wt&&d._wt[pid]?d._wt[pid].weight:0)||0; return s+w*(m.quantity||0); },0);
  return { type:'CTN', qty:1, weight:Math.round(wt*10)/10, l:ACC_CARTON.l, w:ACC_CARTON.w, h:ACC_CARTON.h, desc:'Accessories' };
}
function bikeUnitsOf(d){
  const out=[];
  (d._lines||[]).filter(m=>isBike(m,d)).forEach(m=>{
    const pid=Array.isArray(m.product_id)?m.product_id[0]:null;
    const w=(pid&&d._wt&&d._wt[pid]?d._wt[pid].weight:0)||0;
    const serial=serialOf(m);
    const q=Math.max(1, Math.round(m.quantity||1));
    for(let i=0;i<q;i++) out.push({ serial, weight:w });
  });
  return out;
}
function buildRows(d){
  const defs=getDefaults();
  // 1) if the transfer is packed into Odoo packages, use those (real packing wins)
  if(d._odooPkgs&&d._odooPkgs.length){
    return d._odooPkgs.map(pk=>({ type:guessDsvType(pk.typeName,defs.packageType), qty:1, weight: pk.weight||0, l: pk.l||defs.length, w: pk.w||defs.width, h: pk.h||defs.height,
      desc: (pk.serials&&pk.serials.length?('S/N '+pk.serials.join(',')):'').slice(0,30) }));
  }
  // 2) bike rule: one carton per bike, or pallet(s) at/above the threshold; + accessories carton
  const bikes=bikeUnitsOf(d);
  const accRow=accessoryRowOf(d);
  if(bikes.length){
    let rows;
    if(bikes.length>=PALLET_THRESHOLD){
      const pallets=Math.max(1, Math.ceil(bikes.length/BIKES_PER_PALLET));
      const totWt=bikes.reduce((s,b)=>s+(b.weight||0),0);
      const perWt=totWt?Math.round((totWt/pallets)*10)/10:0;
      rows=[];
      for(let i=0;i<pallets;i++) rows.push({ type:BIKE_PALLET.type, qty:1, weight:perWt, l:BIKE_PALLET.l, w:BIKE_PALLET.w, h:BIKE_PALLET.h, desc:('Bikes x'+bikes.length).slice(0,30) });
    } else {
      rows=bikes.map(b=>({ type:'CTN', qty:1, weight:(b.weight||0), l:BIKE_CARTON.l, w:BIKE_CARTON.w, h:BIKE_CARTON.h, desc:(b.serial?('S/N '+b.serial):'Bike').slice(0,30) }));
    }
    if(accRow) rows.push(accRow);
    return rows;
  }
  // 3) no bikes but there are accessories → just the accessories carton
  if(accRow) return [accRow];
  // 4) fallback: a single line from the transfer weight + Settings defaults
  const wt=d.weight&&Number(d.weight)>0?Number(d.weight):0;
  const desc=(d._bikeSerials&&d._bikeSerials.length?('S/N '+d._bikeSerials.join(',')):'').slice(0,30);
  return [{ type:defs.packageType, qty:1, weight:wt, l:defs.length, w:defs.width, h:defs.height, desc }];
}
function pkgRowsHtml(id){

function pkgRead(id){

function pkgAdd(id){ pkgRead(id); const defs=getDefaults(); PKGROWS[id].push({type:defs.packageType,qty:1,weight:0,l:defs.length,w:defs.width,h:defs.height,desc:''}); pkgRerender(id); }
function pkgDel(id,i){ pkgRead(id); PKGROWS[id].splice(i,1); if(!PKGROWS[id].length){const defs=getDefaults();PKGROWS[id]=[{type:defs.packageType,qty:1,weight:0,l:defs.length,w:defs.width,h:defs.height,desc:''}];} pkgRerender(id); }

function contentsTable(d){
  if(d._loadErr) return '<div class="info" style="color:var(--red)">Could not load contents: '+esc(d._loadErr)+'</div>';

  if(!lines.length) return '<div class="muted" style="font-size:12.5px">No move lines on this transfer.</div>';

    const lineWt=wi&&wi.weight?(wi.weight*qty):null;
    const serial=(Array.isArray(m.lot_id)?m.lot_id[1]:'')||m.lot_name||'';

      <td class="num">${lineWt!=null?lineWt.toFixed(2)+' kg':'<span class="muted">—</span>'}</td>
      <td>${esc(pkg)||'<span class="muted">—</span>'}</td></tr>`;
  }).join('');
  return `<table class="tbl"><thead><tr><th>Product</th><th class="num">Qty</th><th>Serial / Lot</th><th class="num">Weight</th><th>Package</th></tr></thead><tbody>${rows}</tbody></table>`;
}

/* ── StoreRocket opening-hours lookup ───────────────────────────────────────
   Auto-fills the DSV "receiver instructions" with the destination shop's opening
   hours, taken from Ahooga's public StoreRocket store locator (same public ID used
   on be.ahooga.bike). Match order: exact e-mail, then postcode + name (+ country).
   Silent fallback to the Odoo internal note if unreachable or no shop matches. */
const SR_ACCOUNT='Y287q7A4AP';
let SR_LOCATIONS=null;                 // null = not fetched, [] = fetched (maybe empty/failed)
async function ensureStoreRocket(){
  if(SR_LOCATIONS!==null) return;
  SR_LOCATIONS=[];                     // mark attempted so we don't refetch on every open
  try{
    const url='https://storerocket.io/api/user/'+SR_ACCOUNT+'/locations?lat=50.5&lng=4.5&radius=100000&units=kilometers';
    const r=await fetch(url); const d=await r.json();
    SR_LOCATIONS=(d&&d.results&&d.results.locations)||d.locations||[];
  }catch(e){ SR_LOCATIONS=[]; }
}
function srNorm(s){ return (s||'').toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim(); }
function srMatchLocation(p, custName){
  if(!SR_LOCATIONS||!SR_LOCATIONS.length) return null;
  const email=((p&&p.email)||'').toString().trim().toLowerCase();
  if(email){ const byMail=SR_LOCATIONS.find(l=>((l.email||'').toString().trim().toLowerCase())===email); if(byMail) return byMail; }
  const zip=((p&&p.zip)||'').toString().trim();
  if(!zip) return null;
  const cc=(p&&Array.isArray(p.country_id))?((_ccache[p.country_id[0]]||'')).toString().toUpperCase():'';
  const nameN=srNorm(custName||(p&&p.name)||'');
  const tokens=nameN.split(' ').filter(t=>t.length>2);
  const sameZip=SR_LOCATIONS.filter(l=>{
    if(((l.postcode||'').toString().trim())!==zip) return false;
    if(cc && l.country && String(l.country).toUpperCase()!==cc) return false;
    return true;
  });
  if(!sameZip.length) return null;
  let best=null,bestScore=0;
  for(const l of sameZip){
    const ln=srNorm(l.name); let score=0;
    tokens.forEach(t=>{ if(ln.indexOf(t)>=0) score++; });
    if(nameN && (ln.indexOf(nameN)>=0 || nameN.indexOf(ln)>=0)) score+=2;
    if(score>bestScore){ bestScore=score; best=l; }
  }
  if(best && bestScore>0) return best;
  if(sameZip.length===1) return sameZip[0];   // single shop at that postcode -> accept
  return null;
}
const SR_DAYS=[['mon','Mon'],['tue','Tue'],['wed','Wed'],['thu','Thu'],['fri','Fri'],['sat','Sat'],['sun','Sun']];
function srFormatHours(hours){
  if(!hours||typeof hours!=='object') return '';
  const days=SR_DAYS.map(function(kv){ return {lab:kv[1], val:(hours[kv[0]]==null?'':String(hours[kv[0]]).trim())}; });
  if(days.every(function(d){return !d.val;})) return '';
  const segs=[]; let i=0;
  while(i<days.length){
    if(!days[i].val){ i++; continue; }
    let j=i; while(j+1<days.length && days[j+1].val===days[i].val) j++;
    const label=(i===j)?days[i].lab:(days[i].lab+'-'+days[j].lab);
    segs.push(label+' '+days[i].val); i=j+1;
  }
  return segs.join('; ').slice(0,175);
}

    : `<div class="box full"><h4>Book this transfer with DSV</h4>

        <div id="pkgs-${id}">${pkgRowsHtml(id)}</div>
        <div style="margin-top:6px"><button class="btn ghost sm" onclick="pkgAdd('${id}')">+ Add package</button></div>
        <div class="minif" style="margin-top:10px"><div class="fld" style="flex:2"><label>Reference</label><input id="rf-${id}" value="${esc(d.name)}"/></div>
          <div class="fld" style="flex:3"><label>Receiver instructions → DSV (e.g. opening hours)</label><input id="ri-${id}" maxlength="175" value="${esc(riPrefill)}" placeholder="e.g. Mon-Fri 8:00-16:00"/>${riNote?'<div class="cap" style="margin-top:4px">'+riNote+'</div>':''}</div></div>
        <label class="chk"><input type="checkbox" id="ab-${id}"/> Submit as <b>final booking</b> (unchecked = draft in myDSV)</label>
        <label class="chk"><input type="checkbox" id="nc-${id}"/> ✉ Notify customer — post tracking to the <b>sales order</b> followers (sends a real Odoo message)</label>
        <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn blue sm bk-${id}" onclick="bookDelivery('${id}')">Book with DSV →</button></div>
        <div class="cap">Sizes in cm. Package type/size pre-filled from Odoo package types; falls back to your Settings defaults when Odoo has none.</div>
        <div id="bk-out-${id}" style="margin-top:10px"></div></div>`;

  return `<div class="grid2">${contents}</div><div class="grid2">${ship}${dsvPreview}</div><div class="grid2">${actions}</div>`;
}

/* Sends an HTML message to the customer via the sales-order chatter + follower notification.
   WHY THIS IS NEEDED: Odoo's message_post HTML-escapes any body sent over the external API
   (it treats the string as plain text), so <br>/<b> used to reach the customer as literal code
   in both the chatter and the notification e-mail. Fix in three steps:
     1) post with e-mail sending held back (mail_notify_force_send:false) so nothing goes out yet;
     2) rewrite the stored message body with the real HTML -> chatter & customer portal render correctly;
     3) un-escape (&lt;->< , &gt;->>) the queued notification e-mail(s) and send them.
   For step 3 to stay safe the message must contain no '&' and no quotes, so the templates below use
   unquoted attributes and the word 'and' instead of '&'. Keep it that way when editing the wording. */
async function sendCustomerMessage(soId, cBody){
  const msgId=await odoo('sale.order','message_post',[[soId]],
    {body:cBody,message_type:'comment',subtype_xmlid:'mail.mt_comment',context:{mail_notify_force_send:false}});
  if(!msgId) return;
  // chatter / customer portal: store the real HTML (Html fields keep tags on write)
  try{ await odoo('mail.message','write',[[msgId],{body:cBody}]); }catch(e){}
  // notification e-mail(s): fix the escaped body then send
  try{
    const mails=await odoo('mail.mail','search_read',[[['mail_message_id','=',msgId]]],{fields:['body_html']});
    const ids=[];
    for(const m of (mails||[])){
      const fixed=(m.body_html||'').replace(/&lt;/g,'<').replace(/&gt;/g,'>');
      try{ await odoo('mail.mail','write',[[m.id],{body_html:fixed}]); ids.push(m.id); }catch(e){}
    }
    if(ids.length){ try{ await odoo('mail.mail','send',[ids]); }catch(e){} }  // if this fails, Odoo's mail cron sends the already-fixed body
  }catch(e){}
}

/* ── customer-facing shipment message (posted to the sales order followers) ──
   EDIT WORDING / ADD LANGUAGES HERE. Picks the language from the customer's
   Odoo contact language (falls back to English). ref = order, num = tracking number. */
const DSV_TRACK_PAGE='https://mydsv.com/new/tracking/track-shipment';
function customerTrackingMsg(lang, ref, num){
  const r=esc(ref), n=esc(num);
  const link='<a href='+DSV_TRACK_PAGE+'?query='+n+'>Track and Trace</a>';
  const t={
    en:'Dear Customer,<br><br>Great news — your Ahooga order <b>'+r+'</b> has left our warehouse and is on its way to you with DSV. 🚲<br><br>Your DSV tracking number:<br><b>'+n+'</b><br><br>Follow your parcel here: '+link+'<br><br>If you have any questions, just reply to this message — we are always happy to help.<br><br>Warm regards,<br><b>The Ahooga Team</b><br><span style=color:#9a9384>With love from Brussels 🇧🇪</span>',
    fr:'Cher client, chère cliente,<br><br>Bonne nouvelle — votre commande Ahooga <b>'+r+'</b> a quitté notre entrepôt et est en route vers vous avec DSV. 🚲<br><br>Votre numéro de suivi DSV :<br><b>'+n+'</b><br><br>Suivez votre colis ici : '+link+'<br><br>Pour toute question, il vous suffit de répondre à ce message — nous sommes toujours ravis de vous aider.<br><br>Bien à vous,<br><b>L\'équipe Ahooga</b><br><span style=color:#9a9384>Avec amour depuis Bruxelles 🇧🇪</span>',
    nl:'Beste klant,<br><br>Goed nieuws — uw Ahooga-bestelling <b>'+r+'</b> heeft ons magazijn verlaten en is met DSV naar u onderweg. 🚲<br><br>Uw DSV-trackingnummer:<br><b>'+n+'</b><br><br>Volg uw pakket hier: '+link+'<br><br>Hebt u vragen? Beantwoord gerust dit bericht — we helpen u graag verder.<br><br>Met vriendelijke groet,<br><b>Het Ahooga-team</b><br><span style=color:#9a9384>Met liefde uit Brussel 🇧🇪</span>',
    de:'Sehr geehrte Kundin, sehr geehrter Kunde,<br><br>Gute Nachrichten — Ihre Ahooga-Bestellung <b>'+r+'</b> hat unser Lager verlassen und ist mit DSV zu Ihnen unterwegs. 🚲<br><br>Ihre DSV-Sendungsnummer:<br><b>'+n+'</b><br><br>Verfolgen Sie Ihr Paket hier: '+link+'<br><br>Bei Fragen antworten Sie einfach auf diese Nachricht — wir helfen Ihnen jederzeit gerne.<br><br>Herzliche Grüße,<br><b>Ihr Ahooga-Team</b><br><span style=color:#9a9384>Mit Liebe aus Brüssel 🇧🇪</span>'
  };
  return t[lang]||t.en;
}

async function bookDelivery(id){
  const d=DELIVERIES.find(x=>cssId(x.name)===id); if(!d)return;
  const p=d.partner||{};
  const out=$('bk-out-'+id);
  const btns=Array.prototype.slice.call(document.querySelectorAll('.bk-'+id));
  btns.forEach(b=>{ b.disabled=true; b.innerHTML='<span class="spin"></span> Booking…'; });
  out.innerHTML='';
  try{
    const cc=Array.isArray(p.country_id)?(_ccache[p.country_id[0]]||''):'';
    const defs=getDefaults(); const pickup=getPickup();
    const rows=pkgRead(id);
    const packagesList=rows.map(r=>({ packageType:r.type, quantity:Math.max(1,r.qty||1), totalWeight:Number(r.weight)||0, length:Number(r.l)||defs.length, width:Number(r.w)||defs.width, height:Number(r.h)||defs.height, description:((r.desc||soOf(d)||'Goods')).slice(0,30) }));
    const totalWeight=packagesList.reduce((s,r)=>s+(Number(r.totalWeight)||0),0);
    const payload={
      reference: ($('rf-'+id)?.value||d.name).trim(),
      autobook: !!$('ab-'+id)?.checked,
      receiverInstructions: ($('ri-'+id)?.value||'').trim(),
      cargoDesc: (soOf(d)||'Goods'),
      productCode: defs.productCode, packageType: defs.packageType,
      pickup: pickup||undefined,
      packagesList, totalWeight,
      consignee: { name: Array.isArray(d.partner_id)?d.partner_id[1]:'', street: p.street||'', street2: p.street2||'',
        zip: p.zip||'', city: p.city||'', countryCode: cc, phone: p.phone||'', email: p.email||'' }
    };
    const res=await dsv('/book',payload);
    if(!res.ok) throw new Error(res.error||'DSV booking failed.');
    const bookingId=res.bookingId; const trackingUrl=res.trackingUrl||'';
    if(!bookingId) throw new Error('DSV did not return a booking ID. Raw: '+JSON.stringify(res).slice(0,200));
    await odoo('stock.picking','write',[[d.id],{carrier_tracking_ref:String(bookingId)}]);
    let labelMsg='';
    if(res.labelBase64){ try{ await odoo('ir.attachment','create',[{name:'DSV-'+bookingId+'.pdf',type:'binary',mimetype:'application/pdf',datas:res.labelBase64,res_model:'stock.picking',res_id:d.id}]); labelMsg=' Label attached.'; }catch(e){ labelMsg=' (label attach failed: '+e.message+')'; } }
    const body='DSV shipment '+(res.draft?'draft created':'booked')+'. Booking ID: '+String(bookingId)+(trackingUrl?'. Tracking: '+trackingUrl:'');
    try{ await odoo('stock.picking','message_post',[[d.id]],{body,message_type:'comment',subtype_xmlid:'mail.mt_note'}); }catch(e){}
    // optional: notify the customer by posting the tracking to the SALES ORDER followers
    // (mail.mt_comment = a real message that notifies followers; mail.mt_note = silent internal log)
    let custMsg='';
    if($('nc-'+id)?.checked){
      const soId=Array.isArray(d.sale_id)?d.sale_id[0]:null;
      if(soId){
        const ref=soOf(d)||d.name;
        const lang=(p.lang||'en').slice(0,2).toLowerCase();   // customer's Odoo language → message language
        const cBody=customerTrackingMsg(lang, ref, String(bookingId));
        try{ await sendCustomerMessage(soId, cBody); custMsg=' Customer notified.'; }
        catch(e){ custMsg=' (customer notify failed: '+esc(e.message)+')'; }
      } else { custMsg=' (no linked sales order — customer not notified)'; }
    }
    d.carrier_tracking_ref=String(bookingId);
    out.innerHTML='<div class="alert ok">✓ '+(res.draft?'Draft created':'Booked')+'. DSV ID <b>'+esc(String(bookingId))+'</b>.'+esc(labelMsg)+esc(custMsg)+'</div>'
      +(trackingUrl?'<div class="kvline"><span>Tracking link</span><a class="link" href="'+esc(trackingUrl)+'" target="_blank">'+esc(trackingUrl)+'</a></div>':'')
      +'<div class="kvline"><span>Send to client</span><span class="mono">'+esc(String(bookingId))+'</span></div>';
    renderDeliveries();
    alert_('✓ '+d.name+' → DSV '+(res.draft?'draft':'booking')+' '+bookingId+'.','ok');
  }catch(e){ out.innerHTML='<div class="alert err">Booking failed: '+esc(e.message)+'</div>'; btns.forEach(b=>{ b.disabled=false; b.textContent='Book with DSV →'; }); }
}

/* ── defaults + pickup (editable in Settings, stored on this device) ── */
function getDefaults(){ try{ return Object.assign({productCode:'CMG',packageType:'CTN',length:40,width:30,height:30}, JSON.parse(localStorage.getItem('dsv_defaults')||'{}')); }catch(e){ return {productCode:'CMG',packageType:'CTN',length:40,width:30,height:30}; } }
function getPickup(){ try{ const v=JSON.parse(localStorage.getItem('dsv_pickup')||'null'); return (v&&typeof v==='object')?v:null; }catch(e){ return null; } }

/* ── open a base64 PDF in a new tab (for printing) ── */
function openPdf(b64,name){
  try{
    const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    const url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));
    const w=window.open(url,'_blank');
    if(!w){ const a=document.createElement('a'); a.href=url; a.download=(name||'label')+'.pdf'; document.body.appendChild(a); a.click(); a.remove(); }
  }catch(e){ alert_('Could not open the PDF: '+esc(e.message),'err'); }
}

async function printLabel(id){
  const d=DELIVERIES.find(x=>cssId(x.name)===id); if(!d||!d.carrier_tracking_ref) return;
  const out=$('bk-out-'+id); if(out) out.innerHTML='<div class="info"><span class="spin"></span> Fetching label…</div>';
  try{
    const res=await dsv('/label',{bookingId:d.carrier_tracking_ref});
    if(!res.ok||!res.labelBase64) throw new Error(res.error||'No label available yet — try again shortly.');
    openPdf(res.labelBase64,'DSV-'+d.carrier_tracking_ref);
    if(out) out.innerHTML='<div class="alert ok">Label opened in a new tab — print it from there.</div>';
  }catch(e){ if(out) out.innerHTML='<div class="alert err">'+esc(e.message)+'</div>'; }
}

async function unbookDelivery(id){
  const d=DELIVERIES.find(x=>cssId(x.name)===id); if(!d)return;
  if(!confirm('Mark '+d.name+' as unbooked?\n\nThis clears the DSV reference in Odoo so it can be re-booked.\nIt does NOT cancel the shipment at DSV — cancel that in myDSV.')) return;
  const prev=d.carrier_tracking_ref;
  try{
    await odoo('stock.picking','write',[[d.id],{carrier_tracking_ref:false}]);
    try{ await odoo('stock.picking','message_post',[[d.id]],{body:'DSV booking unlinked in app (was '+prev+'). Cancel the shipment in myDSV if needed.',message_type:'comment',subtype_xmlid:'mail.mt_note'}); }catch(e){}
    d.carrier_tracking_ref=false; renderDeliveries(); alert_('✓ '+d.name+' marked unbooked.','ok');
  }catch(e){ alert_('Could not unbook: '+esc(e.message),'err'); }
}

async function returnLabel(id){
  const d=DELIVERIES.find(x=>cssId(x.name)===id); if(!d)return;
  if(!confirm('Create a RETURN shipment (customer → Ahooga) and open its label for '+d.name+'?')) return;
  const p=d.partner||{}; const cc=Array.isArray(p.country_id)?(_ccache[p.country_id[0]]||''):''; const defs=getDefaults();
  const out=$('bk-out-'+id); if(out) out.innerHTML='<div class="info"><span class="spin"></span> Creating return shipment…</div>';
  try{
    const payload={ reference:'RET-'+d.name, isReturn:true, autobook:true, packages:1,
      totalWeight: num(d.weight||0)||1, cargoDesc:('Return '+(soOf(d)||'')).slice(0,30),
      productCode:defs.productCode, packageType:defs.packageType, length:defs.length, width:defs.width, height:defs.height,
      consignee:{ name:Array.isArray(d.partner_id)?d.partner_id[1]:'', street:p.street||'', zip:p.zip||'', city:p.city||'', countryCode:cc, phone:p.phone||'', email:p.email||'' } };
    const res=await dsv('/book',payload);
    if(!res.ok) throw new Error(res.error||'Return booking failed.');
    if(res.labelBase64) openPdf(res.labelBase64,'DSV-return-'+res.bookingId);
    try{ await odoo('stock.picking','message_post',[[d.id]],{body:'DSV RETURN label created. Return booking ID: '+res.bookingId,message_type:'comment',subtype_xmlid:'mail.mt_note'}); }catch(e){}
    if(out) out.innerHTML='<div class="alert ok">✓ Return shipment <b>'+esc(String(res.bookingId))+'</b> created'+(res.labelBase64?' — label opened in a new tab.':' (label not ready yet — use Print label shortly).')+'</div>';
  }catch(e){ if(out) out.innerHTML='<div class="alert err">Return label: '+esc(e.message)+'</div>'; }
}

async function doTrack(){
  const id=$('trk-id').value.trim(); const body=$('trk-body');
  if(!id){ body.innerHTML='<div class="empty">Enter a DSV booking ID.</div>'; return; }
  body.innerHTML='<div class="empty"><span class="spin"></span> Fetching shipment status…</div>';
  try{
    const res=await dsv('/track',{bookingId:id});
    if(!res.ok) throw new Error(res.error||'Tracking failed.');
    const status=res.status||'(unknown)'; const events=res.events||[];
    let html='<div class="row" style="padding:14px 16px"><div class="info"><b>Status:</b> '+esc(status)+'</div>';
    if(res.shipmentId) html+='<div class="info muted">Shipment: '+esc(res.shipmentId)+'</div>';
    if(events.length){ html+='<table class="tbl"><thead><tr><th>When</th><th>Event</th><th>Location</th></tr></thead><tbody>'
      +events.map(e=>`<tr><td class="mono">${esc((e.date||'').replace('T',' ').slice(0,16))}</td><td>${esc(e.description||'')}</td><td>${esc(e.location||'')}</td></tr>`).join('')+'</tbody></table>'; }
    html+='</div>'; body.innerHTML=html;
  }catch(e){ body.innerHTML='<div class="alert err">'+esc(e.message)+'</div>'; }
}

        <div class="fld"><label>Width cm</label><input id="def-w" value="${esc(f.width)}" inputmode="numeric"/></div>
        <div class="fld"><label>Height cm</label><input id="def-h" value="${esc(f.height)}" inputmode="numeric"/></div>
        <button class="btn blue sm" onclick="saveDefaults()">Save defaults</button>
      </div>
      <div class="cap">Product code (e.g. CMG = Road groupage), package type (e.g. CTN carton, EUR pallet, CLL colli) and the default box size used when Odoo has no dimensions.</div></div>`;})()}
    ${(function(){const k=getPickup()||{};return `
    <div class="box" style="max-width:760px;margin-top:12px"><h4>Pickup point (where DSV collects)</h4>
      <div class="minif">
        <div class="fld" style="flex:2"><label>Name</label><input id="pu-name" value="${esc(k.name||'')}"/></div>

        <div class="fld"><label>Zip</label><input id="pu-zip" value="${esc(k.zip||'')}"/></div>

      <div class="cap">Leave empty to use the pickup address registered on your DSV account. Set it here to override (e.g. if the warehouse changes).</div></div>`;})()}
    <div class="box" style="max-width:760px;margin-top:12px"><h4>How it works</h4>

      <div class="info">2. Click a transfer to see its validated contents and exactly what gets sent to DSV.</div>
      <div class="info">3. <b>Book with DSV</b> → writes <span class="mono">carrier_tracking_ref</span>, attaches the label PDF, posts a chatter note. Then Print label, Create return label, or Mark unbooked.</div>
      <div class="cap">Leave “final booking” unchecked while testing — bookings land as drafts in myDSV.</div></div>`;
}
async function saveWorker(){
  const u=$('set-worker').value.trim().replace(/\/+$/,''); if(!u){ alert_('Enter a worker URL.','warn'); return; }
  DSV_WORKER=u; try{ localStorage.setItem('dsv_worker',u); }catch(e){}
  await dsvPing(); alert_('Saved DSV worker URL.','ok');
}
function saveDefaults(){
  const def={ productCode:($('def-pc').value||'CMG').trim(), packageType:($('def-pt').value||'CTN').trim(),
    length:num($('def-l').value)||40, width:num($('def-w').value)||30, height:num($('def-h').value)||30 };
  try{ localStorage.setItem('dsv_defaults',JSON.stringify(def)); }catch(e){}
  alert_('Saved booking defaults.','ok');
}
function savePickup(){
  const k={ name:($('pu-name').value||'').trim(), street:($('pu-street').value||'').trim(), zip:($('pu-zip').value||'').trim(),
    city:($('pu-city').value||'').trim(), countryCode:($('pu-cc').value||'').trim().toUpperCase() };
  try{ localStorage.setItem('dsv_pickup',JSON.stringify(k)); }catch(e){}
  alert_('Saved pickup point.','ok');
}
function clearPickup(){ try{ localStorage.removeItem('dsv_pickup'); }catch(e){} renderSettings(); alert_('Pickup reset to DSV account default.','ok'); }

function showTab(t){
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  $('view-'+t).classList.add('active'); $('nav-'+t).classList.add('active');
  if(t==='settings') renderSettings();
}

dsvPing();

    if(c.user&&c.key){ connectAndLoad().then(()=>{ setF(); try{ renderDeliveries(); }catch(e){} }).catch(()=>{}); }
  }catch(e){}
})();
