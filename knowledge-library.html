<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Ahooga Knowledge Library</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
:root{--bg:#f5f5f3;--surface:#fff;--surface2:#f0efe9;--border:rgba(0,0,0,0.09);--border2:rgba(0,0,0,0.16);--text:#1a1a18;--text2:#6b6b66;--text3:#9a9a94;--accent:#1a4fa0;--accent-bg:#e6f0fb;--radius:10px;--radius-sm:6px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
header{background:#0a0a0a;padding:0 32px;height:60px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100}
.logo{color:#fff;font-size:16px;font-weight:700}.logo span{color:rgba(255,255,255,0.4)}
.header-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.search-wrap{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);border-radius:8px;padding:6px 12px}
.search-wrap input{background:none;border:none;outline:none;color:#fff;font-size:13px;font-family:inherit;width:220px}
.search-wrap input::placeholder{color:rgba(255,255,255,0.4)}
.back-btn{color:rgba(255,255,255,0.6);font-size:13px;text-decoration:none}.back-btn:hover{color:#fff}
main{max-width:1200px;margin:0 auto;padding:28px 24px}
.hero{margin-bottom:24px}
.hero h1{font-size:26px;font-weight:800;letter-spacing:-0.8px;margin-bottom:4px}
.hero p{color:var(--text3);font-size:13px}
.dept-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.dept-tab{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--border2);background:var(--surface);color:var(--text2);transition:all 0.15s;user-select:none}
.dept-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.dept-tab:hover:not(.active){border-color:var(--accent);color:var(--accent)}
.dept-count{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;border-radius:9px;font-size:10px;font-weight:700;background:rgba(0,0,0,0.08);margin-left:5px;padding:0 4px}
.dept-tab.active .dept-count{background:rgba(255,255,255,0.2)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:20px;cursor:pointer;transition:all 0.2s;position:relative}
.card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,0.08)}
.card-dept{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;padding:3px 8px;border-radius:20px;margin-bottom:10px}
.card-title{font-size:14px;font-weight:700;line-height:1.3;margin-bottom:6px}
.card-desc{font-size:12px;color:var(--text3);line-height:1.55;margin-bottom:10px}
.card-meta{font-size:11px;color:var(--text3)}
.card-arrow{position:absolute;bottom:16px;right:16px;font-size:16px;color:var(--border2);transition:all 0.2s}
.card:hover .card-arrow{color:var(--accent);transform:translateX(3px)}
.no-results{grid-column:1/-1;text-align:center;padding:48px;color:var(--text3)}
.intro-text{font-size:12px;color:var(--text3);line-height:1.6;padding:3px 0 6px;font-style:italic}
.img-placeholder{background:var(--surface2);border:1px dashed var(--border2);border-radius:10px;padding:14px 18px;margin:12px 0;font-size:11px;color:var(--text3);display:flex;align-items:center;gap:8px}
.tbl-wrap{overflow-x:auto;margin:14px 0}
.howto-tbl{width:100%;border-collapse:collapse;font-size:12px}
.howto-tbl th{background:var(--accent);color:#fff;padding:7px 10px;text-align:left;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:0.04em}
.howto-tbl td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:top}
.howto-tbl tr:last-child td{border-bottom:none}
.howto-tbl tr:hover td{background:var(--surface2)}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:200;display:none;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border-radius:14px;max-width:820px;width:100%;box-shadow:0 24px 64px rgba(0,0,0,0.25);margin:auto}
.modal-header{padding:20px 24px 16px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:12px;position:sticky;top:0;background:var(--surface);border-radius:14px 14px 0 0;z-index:1}
.modal-dept{display:inline-flex;align-items:center;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;padding:3px 8px;border-radius:20px;margin-bottom:6px}
.modal-title{font-size:18px;font-weight:800;letter-spacing:-0.4px;line-height:1.2}
.modal-close{width:32px;height:32px;border-radius:8px;border:1px solid var(--border2);background:var(--surface);cursor:pointer;font-size:16px;color:var(--text2);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:var(--surface2)}
.modal-body{padding:24px}
.modal-loading{text-align:center;padding:40px;color:var(--text3)}
/* Content items */
.content-item{margin-bottom:12px}
.content-text{font-size:13px;line-height:1.7;color:var(--text);padding:6px 0}
.step-wrap{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}
.step-n{min-width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;margin-top:2px}
.step-text{font-size:13px;line-height:1.7;color:var(--text);padding-top:2px}
.fig-wrap{margin:16px 0;text-align:center}
.fig-wrap img{max-width:100%;border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,0.12);border:1px solid var(--border)}
.fig-caption{font-size:11px;color:var(--text3);margin-top:6px;font-style:italic}
/* Dept colors */
.supply{background:#e6f0fb;color:#1a4fa0}
.sales{background:#eaf4ea;color:#1a5c1a}
.marketing{background:#fff3e0;color:#e65100}
.tech{background:#f3e5f5;color:#6a1b9a}
.ops{background:#fce4ec;color:#880e4f}
.shop{background:#e8eaf6;color:#283593}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}
@media(max-width:600px){
  .grid{grid-template-columns:1fr}
  header{flex-wrap:wrap;height:auto;padding:12px 16px;gap:10px}
  .header-right{width:100%;margin-left:0;gap:8px}
  .search-wrap{flex:1}
  .search-wrap input{width:100%;font-size:16px}
  .back-btn{white-space:nowrap;font-size:14px}
}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
a,button,input{-webkit-tap-highlight-color:rgba(26,79,160,.15)}
body{overflow-x:hidden}
</style>

</style>

const DEPT_LABELS = {supply:'📦 Supply',sales:'💼 Sales',marketing:'📣 Marketing',tech:'🔧 Technical',ops:'⚙️ Operations',shop:'🏬 Shop & Odoo'};
const DEPTS = ['all','shop','supply','sales','marketing','tech','ops'];
let currentDept = 'all';
let figCounters = {};

function initTabs(){
  document.getElementById('dept-tabs').innerHTML = DEPTS.map(d=>{
    const count = d==='all'?GUIDES.length:GUIDES.filter(g=>g.dept===d).length;
    const label = d==='all'?'All':DEPT_LABELS[d];
    return `<div class="dept-tab${d==='all'?' active':''}" onclick="filterDept('${d}',this)">${label} <span class="dept-count">${count}</span></div>`;
  }).join('');
}

function filterDept(dept,el){
  currentDept=dept;
  document.querySelectorAll('.dept-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  renderCards();
}

function filterCards(){ renderCards(); }

function renderCards(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const items=GUIDES.filter(g=>{
    const md=currentDept==='all'||g.dept===currentDept;
    const mq=!q||g.title.toLowerCase().includes(q)||g.desc.toLowerCase().includes(q)||g.tags.some(t=>t.includes(q));
    return md&&mq;
  });
  const grid=document.getElementById('cards-grid');
  if(!items.length){grid.innerHTML='<div class="no-results">No procedures found.</div>';return;}
  grid.innerHTML=items.map(g=>`
    <div class="card" onclick="window.location='guide_${g.id}.html'">
      <div class="card-dept ${g.dept}">${DEPT_LABELS[g.dept]}</div>
      <div class="card-title">${g.title}</div>
      <div class="card-desc">${g.desc}</div>
      <div class="card-meta">${g.steps} paragraphs${g.hasImages?' · includes screenshots':''}</div>
      <div class="card-arrow">→</div>
    </div>`).join('');
}

function isActionStep(t){
  if(!t||t.length<4)return false;
  if(t.length<15&&!t.includes(' '))return false;
  if(t.endsWith('?')&&t.length<100)return false;
  return true;
}

function renderTable(rows){
  if(!rows||!rows.length)return'';
  let html='<div class="tbl-wrap"><table class="howto-tbl">';
  rows.forEach((row,ri)=>{
    html+='<tr>';
    row.forEach(cell=>{
      const tag=(ri===0)?'th':'td';
      html+=`<${tag}>${cell||''}</${tag}>`;
    });
    html+='</tr>';
  });
  html+='</table></div>';
  return html;
}

function renderContent(items){
  let figNum=0,stepNum=0,html='';
  for(const item of items){
    if(item.type==='image'){
      figNum++;
      html+=`<div class="fig-wrap"><img src="${item.value}" alt="Fig. ${figNum}" loading="lazy"/><div class="fig-caption">Fig. ${figNum}</div></div>`;
    }else if(item.type==='image_placeholder'){
      figNum++;
      html+=`<div class="img-placeholder">📸 Fig. ${figNum} — screenshot (see original Word document)</div>`;
    }else if(item.type==='table'){
      html+=renderTable(item.value);
    }else if(item.type==='text'){
      if(isActionStep(item.value)){
        stepNum++;
        html+=`<div class="step-wrap"><div class="step-n">${stepNum}</div><div class="step-text">${item.value}</div></div>`;
      }else{
        html+=`<div class="intro-text">${item.value}</div>`;
      }
    }
  }
  return html;
}

 activity: Confirm Shipment date. Schedule this activity at half way between order and shipment. This will allow you to check with supplier that everything is on time."}, {"type": "text", "value": "After confirmation of ETA (if it is kept the same \u2013 otherwise change the ETA also in the Receipt delivery) schedule a new Activity on the date of the ETA as \u201cValidate transfer\u201d This will allow you to have an alert when theoretically the shipment should be performed."}, {"type": "text", "value": "On the date of the shipment from the Vendor, validate the transfer from \u201cvendor\u201d location to \u201cAND / In Transit\u201d."}, {"type": "text", "value": "Set the scheduled date of the transfer from AND/In Transit to the final location."}, {"type": "text", "value": "Print the inbound picking operation and put it in the inbound area."}], "5": [{"type": "text", "value": "As soon as you realize that a pick up of an online sales order is at the dealer you should follow this procedure."}, {"type": "text", "value": "Open another TAB now in your browser and access odoo."}, {"type": "text", "value": "Go in the Sales App"}, {"type": "text", "value": "Click \u201cNEW\u201d Please be careful tClick \u201cNEW\u201d"}, {"type": "text", "value": "Please be careful to input the info in the correct order because it will influence the fiscal position, the taxes declaration and the product prices."}, {"type": "text", "value": "First Input the customer name. Since the customer is probably not existing after writing the name you will have to click \u201cCreate & Edit\u201d"}, {"type": "image_placeholder", "value": "Screenshot 1"}, {"type": "image_placeholder", "value": "Screenshot 2"}, {"type": "text", "value": "After filling the information in Odoo you can click \u201cSAVE & CLOSE\u201d"}, {"type": "text", "value": "NOTE: Imagine that Sarah Delgado was a company, in that case you need to click on \u201ccompany\u201d and add a \u201cVAT number\u201d."}, {"type": "image_placeholder", "value": "Screenshot 3"}, {"type": "image_placeholder", "value": "Screenshot 4"}, {"type": "image_placeholder", "value": "Screenshot 5"}, {"type": "image_placeholder", "value": "Screenshot 6"}, {"type": "text", "value": "Sales Team: make sure is set on \u201cOnline\u201d"}, {"type": "text", "value": "Customer reference: Make sure to write the Shopify Sales order number. In this case is #XXXX."}, {"type": "text", "value": "Fiscal position: remove for the time being any fiscal position. Let it blank like this the pricelist \u2013 that should be set on \u201cpublic pricelist\u201d will set the correct prices in the order."}, {"type": "text", "value": "Tags: Select \u201cShopify\u201d"}, {"type": "text", "value": "Tags: Select as well the tag of the type of bike : \u201cA-MAX\u201d, \u201cE-MAX\u201d, \u201cPower+\u201d, \u201cMOD Low\u201d, \u201cMOD Uni\u201d. Note: you can add as many tag as you want in the tag section."}, {"type": "text", "value": "Warehouse \u2013 be carefull wrong warehouse will trigger problems in Supply Team: Select Ahooga Anderlecht because it is a shipment to a retailer. Just as a reminder this is the Matrix to follow:"}, {"type": "table", "value": [["Shipping details", "Warehouse in Odoo"], ["\ud83c\udfe0Pick up in store at Brussels Ahooga Store", "Louise"], ["\ud83c\udfe0Pick up in store at \"dealer name\"", "Ahooga Anderlecht"], ["\ud83d\ude9a Standard", "Ahooga Anderlecht"]]}, {"type": "text", "value": "You can now add the products in \u201corder lines\u201d:"}, {"type": "image_placeholder", "value": "Screenshot 7"}, {"type": "text", "value": "Click on Add product and add all the product there are in the shopify orders"}, {"type": "image_placeholder", "value": "Screenshot 8"}, {"type": "text", "value": "Click \u201cAdd a note\u201d and write \u201cPaid via Shopify on DD/MM\u201d where DD means day and MM means month. This will allow Supply team to know that the order is already been paid. You can see if it is paid or not in Shopify. If Shopify shows still in \u201cPayment pending\u201d do not confirm the sales order."}, {"type": "text", "value": "NOTE: IMPORTANT!!!"}, {"type": "text", "value": "In Shopify commercial discounts are integrated immediately in the products, in Odoo they are NOT. You need to add a line call \u201ccommercial discount\u201d and add in the unit price a negative amount to have a reduction of the price."}, {"type": "text", "value": "Add Shipping if in shopify there was a shipping included. Please double check that the price is the same between Odoo and Shopify. If NOT, modify the shipping price MANUALLY."}, {"type": "text", "value": "Go Back to \u201cOther info\u201d and put in Fiscal position the correct Fiscal Position either:"}, {"type": "text", "value": "EU prive / Regime National if it is a Sales Order in Belgium"}, {"type": "text", "value": "OSS B2C Germany \u2013 if it is a sales order for a german client"}, {"type": "text", "value": "OSS B2C France \u2013 if it is a sales order for a client in France"}, {"type": "text", "value": "OSS B2C Netherland - if it is a sales order for a client in Netherlands..."}, {"type": "text", "value": "Etc etc"}, {"type": "text", "value": "Then Click \u201cUpdate Taxes\u201d - this will set the correct VAT in the sales order."}, {"type": "text", "value": "Now go back to \u201cOrder Lines\u201d"}, {"type": "text", "value": "At the end of the order please compare the total price of the sales order in odoo and the total price of the order in Shopify. Odoo order must match Shopify order because client paid what Shopify told the client to pay. If total is not matching please re-check the prices in Odoo and modify them manually. Re-check the total again if it is matching with Shopify. NEVER CONFIRM AN ODOO ORDER IF NOT MATCHING WITH SHOPIFY."}, {"type": "text", "value": "Change now \u201cDelivery Address\u201d to the dealer location that the customer chose as pick up point. AS below:"}, {"type": "image_placeholder", "value": "Screenshot 9"}, {"type": "text", "value": "Now you can confirm the order!!"}, {"type": "text", "value": "Go now in Accounting App (or request Finance Resp to go in Accounting App)"}, {"type": "image_placeholder", "value": "Screenshot 10"}, {"type": "text", "value": "Click \u201cNEW\u201d"}, {"type": "text", "value": "Add the client name"}, {"type": "text", "value": "Add in the line \u201cDiscount Voucher\u201d and put in the Unit price write the 26% of the total purchased priced in Shopify. Be careful that the 26% of the purchase price needs to consider VAT if the dealer is from Belgium, if NOT in Belgium only 26% of the non-taxed amount."}, {"type": "text", "value": "Total Purchased price 1699 Euro VAT incl ="}, {"type": "text", "value": "In Belgium 1699 * 0,26 = 441,74"}, {"type": "text", "value": "Outside Belgium (1699 / (1+VAT Value of the country)*0,26"}, {"type": "text", "value": "Example Germany ( 1699 / 1,19 ) * 0, 26 = 371, 21 Euro"}, {"type": "text", "value": "Example France (1699 / 1,20 ) * 0,26 = 368,11 Euro"}, {"type": "text", "value": "You can also calculate it by going to Shopify checking the total purchased price and remove the total amount of taxes as in the example below:"}, {"type": "image_placeholder", "value": "Screenshot 11"}, {"type": "image_placeholder", "value": "Screenshot 12"}, {"type": "text", "value": "You click then \u201cPRINT\u201d to download the credit note document PDF."}, {"type": "image_placeholder", "value": "Screenshot 13"}, {"type": "text", "value": "You need now to communicate to the dealer that a sales order for a B2C client will be picked up in its store, you need to send in attachment:"}, {"type": "text", "value": "A screen shot of the shopify order with the final B2C client information"}, {"type": "text", "value": "The PDF of the credit note / voucher equivalent for 26% margin."}, {"type": "text", "value": "In appendix you have the templates e-mail for 4 languages: ENG, FR, NL, DE."}, {"type": "text", "value": "Put a log note in the sales order to inform the retailer when the bikes are shipped, and tell the retailer to contact the client."}, {"type": "text", "value": "APPENDIX"}, {"type": "text", "value": "ENG"}, {"type": "text", "value": "Dear {{Partner Name}},"}, {"type": "text", "value": "We are pleased to inform you that an online sale has been completed with {{Store Name}} selected as the pickup location."}, {"type": "text", "value": "For each online order with pickup at your store, you are entitled to receive a voucher (credit note) equivalent to 26% of the purchase value. You will find the detailed compensation breakdown as well as the order details attached. This voucher can be used on your next purchase with us, allowing you to deduct its value from the total amount due."}, {"type": "text", "value": "By accepting this voucher, the customer who placed the order through our online store becomes your customer for all practical purposes. The sale should therefore be treated as if it had been made directly through your physical store:"}, {"type": "text", "value": "Delivery of the bike is at your charge."}, {"type": "text", "value": "From that point onward, the customer is handled by your shop for after-sales service, including repairs, warranty, and ongoing support."}, {"type": "text", "value": "Please do not hesitate to contact us if you have any questions or need further clarification."}, {"type": "text", "value": "Best regards,"}, {"type": "text", "value": "The Ahooga Team"}, {"type": "text", "value": "FR"}, {"type": "text", "value": "Cher / Ch\u00e8re {{Nom du partenaire}},"}, {"type": "text", "value": "Nous avons le plaisir de vous informer qu\u2019une vente en ligne a \u00e9t\u00e9 r\u00e9alis\u00e9e avec {{Nom du magasin}} s\u00e9lectionn\u00e9 comme point de retrait."}, {"type": "text", "value": "Pour chaque commande en ligne avec retrait dans votre magasin, vous b\u00e9n\u00e9ficiez d\u2019un bon d\u2019achat (note de cr\u00e9dit) \u00e9quivalent \u00e0 26% de la valeur de la commande, hors TVA. Vous trouverez en pi\u00e8ce jointe le d\u00e9tail de votre compensation ainsi que les informations relatives \u00e0 la commande. Ce bon pourra \u00eatre utilis\u00e9 lors de votre prochaine commande chez nous, en d\u00e9duction du montant total."}, {"type": "text", "value": "En acceptant ce bon, le client ayant command\u00e9 via notre boutique en ligne devient votre client \u00e0 tous \u00e9gards. La vente doit donc \u00eatre consid\u00e9r\u00e9e comme r\u00e9alis\u00e9e directement dans votre magasin :"}, {"type": "text", "value": "La livraison du v\u00e9lo est \u00e0 votre charge."}, {"type": "text", "value": "Le client est ensuite pris en charge par votre magasin pour le service apr\u00e8s-vente, y compris les r\u00e9parations, la garantie et l\u2019assistance."}, {"type": "text", "value": "N\u2019h\u00e9sitez pas \u00e0 nous contacter si vous avez des questions ou besoin de pr\u00e9cisions suppl\u00e9mentaires."}, {"type": "text", "value": "Bien cordialement,"}, {"type": "text", "value": "L\u2019\u00e9quipe Ahooga"}, {"type": "text", "value": "NL"}, {"type": "text", "value": "Beste {{Naam partner}},"}, {"type": "text", "value": "Wij informeren u graag dat er een online verkoop is afgerond waarbij {{Winkelnaam}} werd gekozen als afhaalpunt."}, {"type": "text", "value": "Voor elke online bestelling met afhaling in uw winkel ontvangt u een voucher (creditnota) ter waarde van 26% van het aankoopbedrag, exclusief btw. In de bijlage vindt u zowel de details van de compensatie als de bestelgegevens. Deze voucher kan worden gebruikt bij uw volgende bestelling bij ons, waarbij het bedrag in mindering wordt gebracht van het totaal."}, {"type": "text", "value": "Door de aanvaarding van deze voucher wordt de klant die via onze online shop heeft besteld volledig uw klant. De verkoop dient dan ook te worden beschouwd alsof deze rechtstreeks in uw fysieke winkel heeft plaatsgevonden:"}, {"type": "text", "value": "De levering van de fiets gebeurt op uw kosten."}, {"type": "text", "value": "Vanaf dat moment staat uw winkel in voor de verdere opvolging van de klant, inclusief herstellingen, garantie en ondersteuning."}, {"type": "text", "value": "Aarzel niet om ons te contacteren indien u vragen heeft of verdere toelichting wenst."}, {"type": "text", "value": "Met vriendelijke groeten,"}, {"type": "text", "value": "Het Ahooga-team"}, {"type": "text", "value": "DE"}, {"type": "text", "value": "Lieber / Liebe {{Name des Partners}},"}, {"type": "text", "value": "Wir freuen uns, Ihnen mitteilen zu k\u00f6nnen, dass ein Online-Verkauf abgeschlossen wurde, bei dem {{Name des Gesch\u00e4fts}} als Abholort ausgew\u00e4hlt wurde."}, {"type": "text", "value": "F\u00fcr jede Online-Bestellung mit Abholung in Ihrem Gesch\u00e4ft erhalten Sie einen Gutschein (Gutschrift) in H\u00f6he von 26% des Kaufwerts, exklusive Mehrwertsteuer. Die detaillierten Informationen zu Ihrer Verg\u00fctung sowie die Bestelldetails finden Sie im Anhang. Dieser Gutschein kann bei Ihrer n\u00e4chsten Bestellung bei uns eingel\u00f6st werden, indem der entsprechende Betrag vom Gesamtbetrag abgezogen wird."}, {"type": "text", "value": "Mit der Annahme dieses Gutscheins wird der Kunde, der \u00fcber unseren Online-Shop bestellt hat, in jeder Hinsicht zu Ihrem Kunden. Der Verkauf ist daher so zu behandeln, als w\u00e4re er direkt in Ihrem Ladengesch\u00e4ft erfolgt:"}, {"type": "text", "value": "Die Auslieferung des Fahrrads erfolgt auf Ihre Kosten."}, {"type": "text", "value": "Die weitere Betreuung des Kunden liegt bei Ihrem Gesch\u00e4ft, einschlie\u00dflich Reparaturen, Garantieabwicklung und Support."}, {"type": "text", "value": "Bitte z\u00f6gern Sie nicht, uns bei Fragen oder f\u00fcr weitere Informationen zu kontaktieren."}, {"type": "text", "value": "Mit freundlichen Gr\u00fc\u00dfen"}, {"type": "text", "value": "Das Ahooga-Team"}], "6": [{"type": "text", "value": "Login to google account of ahoogahouse.1050.be@gmail.com - by now you should have already access to the gmail account on google chrome"}, {"type": "text", "value": "Click the following link from the google chrome with Ahooga House as user access: https://accounts.shopify.com/select?rid=210d88ec-dc52-475e-aed5-2fbba480b774"}, {"type": "text", "value": "Access the account with Username: ahoogahouse.1050.be@gmail.com"}, {"type": "image_placeholder", "value": "Screenshot 1"}, {"type": "text", "value": "You will have now all the list of orders of shopify, each with a number of 4 digits, the date of the order, customer name, etc (see below)"}, {"type": "image_placeholder", "value": "Screenshot 2"}, {"type": "text", "value": "Open another TAB now in your browser and access odoo."}, {"type": "text", "value": "Go in the Sales App"}, {"type": "text", "value": "Go in the navigation bar where you put the filters"}, {"type": "text", "value": "Click on Favorites > All Sales."}, {"type": "image_placeholder", "value": "Screenshot 3"}, {"type": "image_placeholder", "value": "Screenshot 4"}, {"type": "text", "value": "You will now see the list of all sales order in the Sales Team Online. Sales Team online means that are orders that arrived from Online (it can be from the chat in the website through our Customer service, from a ticket in our aftersales service, or from our webshop \u2013 Shopify )."}, {"type": "image_placeholder", "value": "Screenshot 5"}, {"type": "text", "value": "In the example above the last order from Shopify is S21981 of Sarah Delgado Sedano."}, {"type": "text", "value": "You now know that the last order input in odoo from Shopify is the one of Sarah Delgado."}, {"type": "text", "value": "Go back now to the shopify order page. If there are new orders in shopify you have to input them in odoo. In the example below of course Sarah Delgado is the last one since we have not received any new orders in the meantime while I am writing this procedure."}, {"type": "image_placeholder", "value": "Screenshot 6"}, {"type": "text", "value": "Let\u2019s imagine that the last order in Odoo was the one of Marion Gnutzmann and you want now to input in odoo the one of Sarah Delgado Sedano."}, {"type": "text", "value": "Click on the order number associated to that order #8392. A new page will open. That is the order page as below."}, {"type": "image_placeholder", "value": "Screenshot 7"}, {"type": "text", "value": "In the order you can find all the information you need to input in Odoo."}, {"type": "text", "value": "Check at first if pick up location is at dealer: if it is at dealer please move to this procedure: How to Handle Online Sales orders with Pick-up at a dealer.docx"}, {"type": "text", "value": "Go back to Odoo Sales App > Click \u201cNEW\u201d"}, {"type": "text", "value": "Please be careful to input the info in the correct order because it will influence the fiscal position, the taxes declaration and the product prices."}, {"type": "image_placeholder", "value": "Screenshot 8"}, {"type": "text", "value": "In the new window fill in all the customer info that you can find in the Shopify Sales order like in the picture below in the blue area:"}, {"type": "image_placeholder", "value": "Screenshot 9"}, {"type": "text", "value": "After filling the information in Odoo you can click \u201cSAVE & CLOSE\u201d"}, {"type": "image_placeholder", "value": "Screenshot 10"}, {"type": "text", "value": "NOTE: Imagine that Sarah Delgado was a company, in that case you need to click on \u201ccompany\u201d and add a \u201cVAT number\u201d."}, {"type": "image_placeholder", "value": "Screenshot 11"}, {"type": "text", "value": "Make sure the pricelist is set on the order on \u201cPublic Pricelist\u201d. Based on the pricelist prices of the products might change in Odoo and needs to be verified at the last step of the sales order."}, {"type": "text", "value": "Also, inputting a company and VAT number will influence the price of the products and the taxes so be careful."}, {"type": "text", "value": "Let\u2019s go back now after clicking \u201cSAVE & CLOSE\u201d this page will appear:"}, {"type": "image_placeholder", "value": "Screenshot 12"}, {"type": "text", "value": "Go now to \u201cOther Info\u201d. You will have now to modify or fill in those 5 items (also fiscal position that is not rounded in the picture)."}, {"type": "image_placeholder", "value": "Screenshot 13"}, {"type": "text", "value": "Sales Team: make sure is set on \u201cOnline\u201d"}, {"type": "text", "value": "Customer reference: Make sure to write the Shopify Sales order number. In this case is #8392."}, {"type": "text", "value": "Fiscal position: remove for the time being any fiscal position. Let it blank like this the pricelist \u2013 that should be set on \u201cpublic pricelist\u201d will set the correct prices in the order."}, {"type": "text", "value": "Tags: Select \u201cShopify\u201d"}, {"type": "text", "value": "Tags: Select as well the tag of the type of bike : \u201cA-MAX\u201d, \u201cE-MAX\u201d, \u201cPower+\u201d, \u201cMOD Low\u201d, \u201cMOD Uni\u201d. Note: you can add as many tag as you want in the tag section."}, {"type": "text", "value": "Warehouse \u2013 be carefull wrong warehouse will trigger problems in Supply Team:"}, {"type": "text", "value": "Here you need to select or \u201cahooga Anderlecht\u201d or \u201cLouise\u201d. How to choose?"}, {"type": "text", "value": "You need to select Louise for all orders where the pick up location is set as Ahooga Bruxelles. Like in the picture below:"}, {"type": "image_placeholder", "value": "Screenshot 14"}, {"type": "text", "value": "You need to select \u201cAhooga Anderlecht\u201d for all the other orders."}, {"type": "text", "value": "Use this matrix:"}, {"type": "table", "value": [["Shipping details", "Warehouse in Odoo"], ["\ud83c\udfe0Pick up in store at Brussels Ahooga Store", "Louise"], ["\ud83c\udfe0Pick up in store at \"dealer name\"", "Ahooga Anderlecht"], ["\ud83d\ude9a Standard", "Ahooga Anderlecht"]]}, {"type": "text", "value": "(Note: if it is a pickup at dealer, please check the procedure available at this link: How to Handle Online Sales orders with Pick-up at a dealer.docx )"}, {"type": "image_placeholder", "value": "Screenshot 15"}, {"type": "image_placeholder", "value": "Screenshot 16"}, {"type": "text", "value": "By selecting \u201cLouise\u201d it means that the shipment will occur from Louise."}, {"type": "text", "value": "By selecting \u201cAhooga Anderlecht\u201d It means that the shipment will occur from Anderlecht."}, {"type": "text", "value": "Back to the example we were doing this is how it should be filled in:"}, {"type": "image_placeholder", "value": "Screenshot 17"}, {"type": "text", "value": "You can now add the products in \u201corder lines\u201d."}, {"type": "image_placeholder", "value": "Screenshot 18"}, {"type": "text", "value": "Click on Add product and add all the product there are in the shopify orders."}, {"type": "image_placeholder", "value": "Screenshot 19"}, {"type": "text", "value": "Click \u201cAdd a note\u201d and write \u201cPaid via Shopify on DD/MM\u201d where DD means day and MM means month. This will allow Supply team to know that the order is already been paid. You can see if it is paid or not in Shopify. If Shopify shows still in \u201cPayment pending\u201d do not confirm the sales order."}, {"type": "text", "value": "IMPORTANT!!!"}, {"type": "text", "value": "In Shopify commercial discounts are integrated immediately in the products, in Odoo they are NOT. You need to add a line call \u201ccommercial discount\u201d and add in the unit price a negative amount to have a reduction of the price."}, {"type": "text", "value": "Add Shipping if in shopify there was a shipping included. Please double check that the price is the same between Odoo and Shopify. If NOT, modify the shipping price MANUALLY."}, {"type": "text", "value": "Now go Back to \u201cOther info\u201d and put in Fiscal position the correct Fiscal Position either:"}, {"type": "text", "value": "EU prive / Regime National if it is a Sales Order in Belgium"}, {"type": "text", "value": "OSS B2C Germany \u2013 if it is a sales order for a german client"}, {"type": "text", "value": "OSS B2C France \u2013 if it is a sales order for a client in France"}, {"type": "text", "value": "OSS B2C Netherland - if it is a sales order for a client in Netherlands..."}, {"type": "text", "value": "Etc etc"}, {"type": "text", "value": "Then Click \u201cUpdate Taxes\u201d - this will set the correct VAT in the sales order."}, {"type": "text", "value": "Now go back to \u201cOrder Lines\u201d At the end of the order please compare the total price of the sales order in odoo and the total price of the order in Shopify. Odoo order must match Shopify order because client paid what Shopify told the client to pay. If total is not matching please re-check the prices in Odoo and modify them manually. Re-check the total again if it is matching with Shopify. NEVER CONFIRM AN ODOO ORDER IF NOT MATCHING WITH SHOPIFY."}, {"type": "image_placeholder", "value": "Screenshot 20"}, {"type": "text", "value": "Dear Customer,"}, {"type": "text", "value": "Thank you for your order."}, {"type": "text", "value": "Our team is currently preparing your parcel and will proceed with shipping as soon as possible. Once the order has been packed and dispatched, you will receive an email with the tracking information so you can follow its progress."}, {"type": "text", "value": "Should you have any questions in the meantime, please do not hesitate to contact us at hello@ahooga.bike"}, {"type": "text", "value": "Kind regards,"}, {"type": "text", "value": "Ahooga Team"}, {"type": "image_placeholder", "value": "Screenshot 21"}, {"type": "image_placeholder", "value": "Screenshot 22"}, {"type": "text", "value": "If the shipment was at a retailer ( Just as reminder : which also means that you have selected warehouse \u201cAhooga Anderlecht\u201d) like in this example below, you need to change the deliver address of the sales order EVEN though the customer name remains \u201cSarah Delgado\u201d. This will allow the order to be shipped to the retailer but invoiced to the client."}, {"type": "text", "value": "If this is the case, you need to @arthur and the @salesperson responsible for that retailer to inform the retailer that we will ship a shopify order to them for a specific client. This will also result in a credit note to the dealer for the service. (credit note = value of their normal margin for the shipped product)."}, {"type": "image_placeholder", "value": "Screenshot 23"}, {"type": "image_placeholder", "value": "Screenshot 24"}, {"type": "text", "value": "You CAN NOW DO THE NEXT SHOPIFY ORDER!!!!"}], "7": [{"type": "text", "value": "When a dealer wants to order a custom color you can either tell the dealer to order it directly in the B2B portal or you can do the order for them in Odoo. Let\u2019s see both procedures."}, {"type": "text", "value": "Chapter 1 \u2013 Add the order for the client in odoo"}, {"type": "text", "value": "If you want to add the order for the client:"}, {"type": "text", "value": "Go to Sales App > New"}, {"type": "text", "value": "Add the Client Name in the quotation"}, {"type": "image_placeholder", "value": "Screenshot 1"}, {"type": "text", "value": "If you the client is setup correctly in Odoo its pricelist and the fiscal position should be automatically added to the order. In the below example the client had the pricelist set as Ahooga PRO \u2013 Germany therefore the order was updated with this pricelist."}, {"type": "image_placeholder", "value": "Screenshot 2"}, {"type": "image_placeholder", "value": "Screenshot 3"}, {"type": "text", "value": "Add the product, pay attention to find the one with \u201c(custom color)\u201d in brackets!"}, {"type": "image_placeholder", "value": "Screenshot 4"}, {"type": "image_placeholder", "value": "Screenshot 5"}, {"type": "text", "value": "Add shipping!"}, {"type": "image_placeholder", "value": "Screenshot 6"}, {"type": "text", "value": "Choose the Shipping Method:"}, {"type": "text", "value": "Shipping NON Benelux for Outside BELGIUM but in EU"}, {"type": "image_placeholder", "value": "Screenshot 7"}, {"type": "text", "value": "Confirm the order!"}, {"type": "image_placeholder", "value": "Screenshot 8"}, {"type": "text", "value": "Note: if you want to be more specific you can click \u201cother info\u201d and add the reference name of the final client who chose the custom color and also the delivery requested date. You need to do this before confirming."}, {"type": "text", "value": "Chapter 2 \u2013 The dealer adds the bike in B2B portal"}, {"type": "image_placeholder", "value": "Screenshot 9"}, {"type": "text", "value": "Dealer look for the Bike they need and they click on the custom color option."}, {"type": "image_placeholder", "value": "Screenshot 10"}, {"type": "text", "value": "Color and finishing selection then click \u201cadd to cart\u201d"}, {"type": "image_placeholder", "value": "Screenshot 11"}, {"type": "text", "value": "Continue towards checkout"}, {"type": "image_placeholder", "value": "Screenshot 12"}, {"type": "text", "value": "Edit if needed the address, choose shipping method and then click CONFIRM"}, {"type": "image_placeholder", "value": "Screenshot 13"}, {"type": "image_placeholder", "value": "Screenshot 14"}, {"type": "text", "value": "Because of Odoo, to confirm the order Dealers always need to select payment method \u2013 but you can tell them that they do not have to proceed with payment because we always have the 30 days payment terms agreement \u2013 (unfortunately Odoo does not understand this in the webshop but you can say to your clients that they are not obliged to pay immediately for B2B portal orders)"}, {"type": "text", "value": "DEALERS NEED TO SELECT \u201cWIRE TRANSFER\u201d and click \u201cPAY NOW\u201d."}, {"type": "image_placeholder", "value": "Screenshot 15"}, {"type": "image_placeholder", "value": "Screenshot 16"}], "8": [{"type": "text", "value": "Go to odoo > Sales App > New quotation"}, {"type": "image_placeholder", "value": "Screenshot 1"}, {"type": "text", "value": "Add the new client and click \u201cCreate and edit\u201d if the client does not exist yet."}, {"type": "image_placeholder", "value": "Screenshot 2"}, {"type": "text", "value": "Make sure all the important information of the client are filled in, this is a MUST step to make sure prices, payment terms, etc are filled in Odoo correctly automatically."}, {"type": "text", "value": "Fill in :"}, {"type": "text", "value": "- Select if it is an individual or a company"}, {"type": "text", "value": "- Address"}, {"type": "text", "value": "- Zip"}, {"type": "text", "value": "- City"}, {"type": "text", "value": "- Country"}, {"type": "text", "value": "- VAT Number (MUST DO FROM THE START)"}, {"type": "text", "value": "- Phone number"}, {"type": "text", "value": "- E-mail"}, {"type": "text", "value": "- Language"}, {"type": "text", "value": "Note: if you do not fill in all those info you will create problems afterwards."}, {"type": "image_placeholder", "value": "Screenshot 3"}, {"type": "text", "value": "Click on Sales & Purchase and add the payment items \u2013 in red in the pic below."}, {"type": "image_placeholder", "value": "Screenshot 4"}, {"type": "text", "value": "Set payment terms: 30 Days"}, {"type": "text", "value": "Note: you can also setup the fiscal position, this will help ensure the taxes are always correct:"}, {"type": "text", "value": "For BE client setup = Regime National"}, {"type": "text", "value": "For all other clients = Regime Intracommunataire"}, {"type": "text", "value": "Select the correct pricelist you want to assign to this client. There are several pricelist per different countries (ALLY, PRO, ELITE for each country \u2013 make sure to select the level of your country)"}, {"type": "image_placeholder", "value": "Screenshot 5"}, {"type": "text", "value": "Click Save & Close."}, {"type": "text", "value": "Now you are back at the sales order."}, {"type": "text", "value": "Since you are doing a welcome offer select the correct welcome offer pricelist depending on your client country. Do it by searching for the word \u201cwelcome\u201d in the pricelist tab in the sales order as in the pic below."}, {"type": "image_placeholder", "value": "Screenshot 6"}, {"type": "text", "value": "Now select the correct quotation template depending for what you want to offer as welcome offer: we have 3 different offers which are including for all of them a Full Set of Accessories + 3 bikes as the combination in the table"}, {"type": "table", "value": [["Name", "A-MAX D", "A-MAX A", "E-MAX D", "E-MAX A"], ["Welcome offer Mix", "X", "X", "X", ""], ["Welcome offer E-MAX", "", "", "XX", "X"], ["Welcome offer A-MAX", "XX", "X", "", ""]]}, {"type": "text", "value": "Select the welcome offer you want. Be careful to have done the step before otherwise the prices will br wrong or taxes will be wrong."}, {"type": "text", "value": "If you want to make a different welcome offer that is not existing, I suggest you start from the most similar one and then change just the bikes but leave the discount has it is. You can explain the client that the welcome offer was made with specific constraints but can be modified if needed but then the price will not end with 99."}, {"type": "image_placeholder", "value": "Screenshot 7"}, {"type": "text", "value": "Click \u201cSend by mail\u201d if you want to send it to the client, Click \u201cConfirm\u201d if you want to confirm it."}], "9": [{"type": "text", "value": "if you have onboarded a new dealer probably the client is already saved in our system with all the important information (VAT, pricelist, payment terms, etc) In this case move directly to Chapter 2."}, {"type": "text", "value": "Otherwise follow Chapter 1 for client creation."}, {"type": "text", "value": "Chapter 1"}, {"type": "text", "value": "Go to contact App > Click NEW"}, {"type": "image_placeholder", "value": "Screenshot 1"}, {"type": "text", "value": "Fill in :"}, {"type": "text", "value": "- Select if it is an individual or a company"}, {"type": "text", "value": "- Address"}, {"type": "text", "value": "- Zip"}, {"type": "text", "value": "- City"}, {"type": "text", "value": "- Country"}, {"type": "text", "value": "- VAT Number (MUST DO FROM THE START)"}, {"type": "text", "value": "- Phone number"}, {"type": "text", "value": "- E-mail"}, {"type": "text", "value": "- Language"}, {"type": "text", "value": "Note: if you do not fill in all those info you will create problems afterwards."}, {"type": "image_placeholder", "value": "Screenshot 2"}, {"type": "text", "value": "Click on Sales & Purchase and add the payment items \u2013 in red in the pic below."}, {"type": "image_placeholder", "value": "Screenshot 3"}, {"type": "text", "value": "Set payment terms: 30 Days"}, {"type": "text", "value": "Note: you can also setup the fiscal position, this will help ensure the taxes are always correct:"}, {"type": "text", "value": "For BE client setup = Regime National"}, {"type": "text", "value": "For all other clients = Regime Intracommunataire"}, {"type": "text", "value": "Select the correct pricelist you want to assign to this client. There are several pricelist per different countries (ALLY, PRO, ELITE for each country \u2013 make sure to select the level of your country)"}, {"type": "image_placeholder", "value": "Screenshot 4"}, {"type": "text", "value": "Click Save & Close."}, {"type": "text", "value": "Chapter 2"}, {"type": "image_placeholder", "value": "Screenshot 5"}, {"type": "text", "value": "Use the search bar to look for your client:"}, {"type": "image_placeholder", "value": "Screenshot 6"}, {"type": "image_placeholder", "value": "Screenshot 7"}, {"type": "text", "value": "The icon of the building means the contact has been saved as a \u201ccompany\u201d and not an individual. Hence, the contact information are the contact of their headquarter."}, {"type": "text", "value": "If several contacts have been saved within the headquarter profile you should see several different icons like in the pic below. If you need to add several address for one contact click \u201cADD\u201d inside the contact card and create the different contacts for invoicing, deliveries, etc."}, {"type": "image_placeholder", "value": "Screenshot 8"}, {"type": "image_placeholder", "value": "Screenshot 9"}, {"type": "text", "value": "Meaning of the icons:"}, {"type": "text", "value": "Building > headquarter contact and address"}, {"type": "text", "value": "Person profile > Person contact and address"}, {"type": "text", "value": "1 Dollar icon > accounting profile \u2013 where the invoices will be sent"}, {"type": "text", "value": "Little van > where goods will be delivered. Note: if more than one icon with little van it means that there are several delivery addressed associated to that profile."}, {"type": "text", "value": "Open now the Headquarter icon or the icon of the person you want to give access to odoo."}, {"type": "text", "value": "Click now on the little wheel close to the name:"}, {"type": "image_placeholder", "value": "Screenshot 10"}, {"type": "text", "value": "Click on Grant Portal access > then gran access to the e-mail you want to grant B2B portal access"}, {"type": "image_placeholder", "value": "Screenshot 11"}, {"type": "image_placeholder", "value": "Screenshot 12"}, {"type": "text", "value": "Now your client will receive an e-mail from Ahooga.odoo.com saying to setup their password. From now on your client has access to Odoo portal. Be careful to have really setup the client information before giving them access otherwise they will see wrong prices in the portal and they will complain!!!!"}, {"type": "text", "value": "Now move the lead in the correct CRM stage, by dragging and moving their card in the CRM to \u201csigned deal\u201d. You can do this directly from the Contact application you are in:"}, {"type": "image_placeholder", "value": "Screenshot 13"}, {"type": "image_placeholder", "value": "Screenshot 14"}, {"type": "image_placeholder", "value": "Screenshot 15"}, {"type": "text", "value": "Now you need to make sure the dealer will be installed in our website!!"}, {"type": "text", "value": "Fill in this document at this link:"}, {"type": "text", "value": "Retailer Follow Up file"}, {"type": "text", "value": "Fill in a new line with the information required for the shop:"}, {"type": "text", "value": "Name, Language, Address, Opening hours, which bikes they have A/E"}, {"type": "text", "value": "Communicate to it@ahooga.odoo.com and it@ahooga.bike and to alix@ahooga.bike that you have filled in a new shop information in the Retailer Follow up file. This is necessary for making sure they will be in our website, active as a test ride location and also active as pick up point for online sales."}, {"type": "text", "value": "Now you have to inform the dealer per mail on the functionalities of our B2B portal. Here below the 2 template e-mails for English or German. Consult Appendix B to check the e-mail to send."}, {"type": "text", "value": "Propose to the dealer some marketing material as part of the deal. Consult with the client the marketing catalogue and make a sales odoo order."}, {"type": "text", "value": "Catalogue link: MARKETING CATALOG."}, {"type": "text", "value": "Fix with the client one meeting where you are going to train them on the bike. The client should be confident on making the sales order alone on B2B portal, repair the bike, know which parts to order."}, {"type": "text", "value": "Fill in the New Client Sheet online, export it as PDF, sign it and send it to massimiliano@ahooga.bike."}, {"type": "text", "value": "Appendix B - German"}, {"type": "text", "value": "Sehr geehrte Damen und Herren,"}, {"type": "text", "value": "es freut mich, Sie kennenzulernen. Mein Name ist Massimiliano Colosimo, Vertriebsleiter bei Ahooga Bike. Ich m\u00f6chte Sie pers\u00f6nlich in unserem Netzwerk willkommen hei\u00dfen und bin \u00fcberzeugt, dass Sie die Zusammenarbeit mit uns sch\u00e4tzen werden."}, {"type": "text", "value": "Ich melde mich bei Ihnen, um Ihnen unser B2B-Portal vorzustellen. Dieses unterst\u00fctzt Sie in folgenden Bereichen:"}, {"type": "text", "value": "Einkauf neuer Fahrr\u00e4der"}, {"type": "text", "value": "Einreichen von Garantieantr\u00e4gen"}, {"type": "text", "value": "Zugriff auf die Wissensdatenbank"}, {"type": "text", "value": "Im Folgenden finden Sie eine kurze \u00dcbersicht:"}, {"type": "text", "value": "1) Einkauf neuer Fahrr\u00e4der"}, {"type": "text", "value": "Um eine Bestellung aufzugeben, legen Sie die gew\u00fcnschten Produkte in den Warenkorb, gehen zur Kasse und w\u00e4hlen Sie \u201eBank\u00fcberweisung\u201c als Zahlungsmethode."}, {"type": "text", "value": "Eine sofortige Zahlung ist nicht erforderlich. Es gelten unsere Zahlungsbedingungen von 30 Tagen. Die Auswahl der Zahlungsmethode ist jedoch notwendig, um den Bestellvorgang im System abzuschlie\u00dfen."}, {"type": "text", "value": "2) Einreichen von Garantieantr\u00e4gen"}, {"type": "text", "value": "Im Falle von Qualit\u00e4tsproblemen gehen Sie bitte wie folgt vor:"}, {"type": "text", "value": "Richten Sie Ihr Passwort f\u00fcr den B2B-Zugang ein, indem Sie auf den Link in der E-Mail klicken, die Sie erhalten haben"}, {"type": "text", "value": "Gehen Sie auf: https://ahooga.odoo.com"}, {"type": "text", "value": "Melden Sie sich an"}, {"type": "text", "value": "Klicken Sie auf \u201eGarantieformular\u201c"}, {"type": "text", "value": "Geben Sie die erforderlichen Informationen ein"}, {"type": "text", "value": "Bitte beachten Sie:"}, {"type": "text", "value": "Die Fahrrad-ID befindet sich auf dem Etikett am Sattelrohr"}, {"type": "text", "value": "Je mehr Bilder Sie bereitstellen, desto schneller k\u00f6nnen wir den Fall bearbeiten und l\u00f6sen"}, {"type": "text", "value": "3) Zugriff auf die Inhalte des Portals"}, {"type": "text", "value": "\u00dcber das B2B-Portal haben Sie au\u00dferdem Zugriff auf:"}, {"type": "text", "value": "Den E-Commerce-Shop"}, {"type": "text", "value": "Die Wissensbibliothek"}, {"type": "text", "value": "Im Ordner \u201eMAX\u201c finden Sie drei Unterordner:"}, {"type": "image_placeholder", "value": "Screenshot 16"}, {"type": "image_placeholder", "value": "Screenshot 17"}, {"type": "text", "value": "1. Teilenummern"}, {"type": "text", "value": "2. Reparatur-Anleitungsvideos"}, {"type": "text", "value": "3. Anleitungen f\u00fcr Reparatur und Montage"}, {"type": "text", "value": "4. Montageanleitung f\u00fcr den Gep\u00e4cktr\u00e4ger"}, {"type": "text", "value": "5. Bafang World (f\u00fcr \u00e4ltere Modelle)"}, {"type": "text", "value": "6. Mivice World (f\u00fcr neue Modelle)."}, {"type": "image_placeholder", "value": "Screenshot 18"}, {"type": "text", "value": "In B. \"MAX_Sales\" finden Sie alle Dokumente, die Sie oder Ihre Mitarbeiter lesen m\u00f6chten, um mehr \u00fcber unser Alleinstellungsmerkmal zu erfahren. In C. Medienbibliothek"}, {"type": "text", "value": "in C. \"Media Library\" alle Dateien finden, die Sie m\u00f6glicherweise zur Aktualisierung Ihrer Website oder Ihrer Social-Media-Seiten verwenden m\u00f6chten."}, {"type": "text", "value": "Was Ihre Bestellungen und Lieferungen betrifft, k\u00f6nnen Sie den Status Ihrer Bestellungen unter \u201eMein Konto\u201c einsehen. Wenn Sie dort auf \u201eBestellungen\u201c klicken, finden Sie das \u201egeplante Lieferdatum\u201c der Sendungen."}, {"type": "text", "value": "Was Ihre Bestellungen und Lieferungen betrifft, k\u00f6nnen Sie den Status Ihrer Bestellungen unter \u201eMein Konto\u201c auf https://ahooga.odoo.com einsehen. Wenn Sie dort auf Ihre Bestellungen klicken, finden Sie das \u201egeplante Lieferdatum\u201c der Sendungen."}, {"type": "image_placeholder", "value": "Screenshot 19"}, {"type": "image_placeholder", "value": "Screenshot 20"}, {"type": "image_placeholder", "value": "Screenshot 21"}, {"type": "text", "value": "Z\u00f6gern Sie nicht, mich zu kontaktieren, falls Sie Fragen haben."}, {"type": "text", "value": "Appendix C - English"}, {"type": "text", "value": "Dear Sir or Madam,"}, {"type": "text", "value": "I am reaching out to introduce our B2B portal. The portal is designed to support you in the following areas:"}, {"type": "text", "value": "Purchasing new bikes"}, {"type": "text", "value": "Submitting warranty claims"}, {"type": "text", "value": "Accessing the knowledge base"}, {"type": "text", "value": "Below is a step-by-step overview:"}, {"type": "text", "value": "1) Purchasing new bikes"}, {"type": "text", "value": "To place an order, simply add the desired products to your cart, proceed to checkout, and select \u201cbank transfer\u201d as the payment method."}, {"type": "text", "value": "No immediate payment is required. Our standard payment terms of 30 days apply. However, selecting a payment method is necessary in the system to complete the order process."}, {"type": "text", "value": "2) Submitting warranty claims"}, {"type": "image_placeholder", "value": "Screenshot 22"}, {"type": "text", "value": "In case of quality issues, please follow the steps below:"}, {"type": "text", "value": "Set up your password for the B2B portal by clicking the link in the email sent to your address"}, {"type": "text", "value": "Go to: https://ahooga.odoo.com"}, {"type": "text", "value": "Log in"}, {"type": "text", "value": "Click on \u201cWarranty Form\u201d"}, {"type": "text", "value": "Fill in the required information"}, {"type": "text", "value": "Please note:"}, {"type": "text", "value": "The bike ID can be found on the label located on the seat tube"}, {"type": "text", "value": "The more pictures you provide, the faster we can process and resolve the issue"}, {"type": "text", "value": "3) Access to the portal content"}, {"type": "text", "value": "Through the B2B portal, you also have access to:"}, {"type": "text", "value": "The e-commerce shop"}, {"type": "text", "value": "The knowledge library"}, {"type": "text", "value": function openGuide(id){
  const g=GUIDES.find(x=>x.id===id);
  if(!g)return;
  document.getElementById('modal-dept').textContent=DEPT_LABELS[g.dept];
  document.getElementById('modal-dept').className='modal-dept '+g.dept;
  document.getElementById('modal-title').textContent=g.title;
  document.getElementById('modal').classList.add('open');
  document.getElementById('modal').scrollTop=0;
  document.body.style.overflow='hidden';

  const content = STATIC_CONTENT[id] || ALL_GUIDES_DATA[id] || [];
  document.getElementById('modal-body').innerHTML=renderContent(content);
}

function closeModal(){
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow='';
}
function closeModalOverlay(e){
  if(e.target===document.getElementById('modal'))closeModal();
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

initTabs();
renderCards();
