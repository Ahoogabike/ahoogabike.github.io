<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MTB Maastricht · Wheel board</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap">
<style>
:root{
  --bg:#f7f4ec; --panel:#ffffff; --line:#e4ddcd;
  --ink:#1d1c16; --ink2:#5a5548; --ink3:#8b8474;
  --in:#1c4fbf; --out:#c9991f; --late:#c0451f; --sn:#1c4fbf;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#f7f4ec;color:#1d1c16;
  font-family:'Archivo',system-ui,-apple-system,"Segoe UI",Arial,sans-serif;overflow:hidden}
.wrap{height:100%;display:flex;flex-direction:column;padding:26px 30px 18px}
header{display:flex;align-items:baseline;gap:18px;flex:none}
h1{margin:0;font-size:34px;font-weight:700;letter-spacing:-.5px}
.sub{color:#8b8474;font-size:19px}
.clock{margin-left:auto;font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}
.cols{flex:1;display:grid;grid-template-columns:1.6fr 1fr 1.1fr;gap:18px;margin-top:18px;min-height:0}
.col.plan h2{color:#5a5548}
.row .rank{display:inline-block;min-width:30px;font-family:'Space Mono',ui-monospace,monospace;font-weight:700;color:#8b8474}
.row .po{font-family:'Space Mono',ui-monospace,monospace;font-weight:700}
.col{background:#ffffff;border:1px solid #e4ddcd;border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;min-height:0}
.col h2{margin:0 0 4px;font-size:24px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.col .cnt{color:#8b8474;font-size:18px;margin-bottom:14px}
.col.in h2{color:#1c4fbf}
.col.out h2{color:#c9991f}
.list{flex:1;overflow:hidden;display:flex;flex-direction:column;gap:9px}
.col.in .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:9px 14px;align-content:start}
.row{background:#fbf9f3;border:1px solid #ece5d6;border-radius:10px;padding:10px 13px;display:flex;gap:12px;align-items:baseline}
.row .main{font-size:23px;font-weight:600;line-height:1.25}
.row .meta{color:#5a5548;font-size:18px;line-height:1.3}
.row .right{margin-left:auto;text-align:right;color:#8b8474;font-size:18px;white-space:nowrap}
.row.late{background:#fdece7;border-color:#e8b9a6}
.row.late .right{color:#c0451f;font-weight:700}
.sn{font-family:'Space Mono',ui-monospace,Menlo,Consolas,monospace;font-size:24px;font-weight:700;color:#1c4fbf}
.pending{opacity:.62;background:#f4f1e8}
.empty{color:#8b8474;font-size:21px;padding:14px 2px}
footer{flex:none;color:#8b8474;font-size:17px;padding-top:12px;display:flex;gap:18px}
.err{color:#c0451f}
</style></head><body>
<div class="wrap">
  <header>
    <h1 id="site">…</h1>
    <span class="sub" id="sub">reading the board…</span>
    <span class="clock" id="clock">--:--</span>
  </header>
  <div class="cols">
    <section class="col in">
      <h2>Components coming in</h2>
      <div class="cnt" id="in-cnt">—</div>
      <div class="list" id="in-list"></div>
    </section>
    <section class="col out">
      <h2>Wheels to Velovisie</h2>
      <div class="cnt" id="out-cnt">—</div>
      <div class="list" id="out-list"></div>
    </section>
    <section class="col plan">
      <h2>Build in this order</h2>
      <div class="cnt" id="plan-cnt">—</div>
      <div class="list" id="plan-list"></div>
    </section>
  </div>
  <footer><span id="stamp">—</span><span id="msg"></span></footer>
</div>
<script>
/* The board is read-only. It holds the same device key as vv-scan, stored on
   this tablet only, and asks the Worker for one combined read every minute. */
var IB_URL = "https://vv-inbound.ahoogahouse-1050-be.workers.dev";
var SITE   = "mtb";
var PLAN_MODE = "priority";  /* one big order, so show what comes first */
var KEY = "";
var KEY_STORE = "mtb_key";
/* The key lives in the same slot the scan app uses, so one paste sets up
   both on a shared tablet. A key the Worker refuses is thrown away rather
   than retried for ever: before this, a rotated key left the screen stuck
   on "reading the board…" with no clue why. */
function readKey(){
  KEY = "";
  try{ KEY = localStorage.getItem(KEY_STORE) || ""; }catch(e){}
  return KEY;
}
function askKey(why){
  try{ localStorage.removeItem(KEY_STORE); }catch(e){}
  KEY = (prompt(why || "Device key for this screen") || "").trim();
  if(KEY){ try{ localStorage.setItem(KEY_STORE, KEY); }catch(e){} }
  return KEY;
}
if(!readKey()) askKey();
function esc(s){ return String(s==null?"":s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function tick(){
  var d = new Date();
  document.getElementById("clock").textContent =
    String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}
function rowIn(p){
  var late = p.late || /overdue/i.test(p.when||"");
  /* Supplier on top, their order number under it, then what is in the
     delivery. The transfer reference (VV/IN/00002) is our own bookkeeping
     and was only ever noise on a wall screen — it is gone. */
  var what = (p.items && p.items.length)
           ? esc(p.items.join(", ")) + (p.more ? " +"+p.more+" more" : "")
           : (p.lines ? p.lines+" line"+(p.lines===1?"":"s") : "");
  var meta = (p.order ? '<span class="po">'+esc(p.order)+'</span> · ' : '') + what;
  return '<div class="row'+(late?" late":"")+'">'+
    '<div><div class="main">'+esc(p.partner||p.ref||"")+'</div>'+
    '<div class="meta">'+meta+'</div></div>'+
    '<div class="right">'+esc(p.when||"")+'</div></div>';
}

/* One open purchase order = one batch this site has been asked to build.
   That IS the production plan: nobody schedules a subcontractor's bench
   for them, we order batches and they build them. */
function rowPlan(o){
  var head = o.rows.slice(0,3).map(function(r){
    return esc((r.colour ? r.colour+" " : "")+r.name)+" ×"+r.left;
  }).join(" · ");
  if(o.rows.length > 3) head += " · +"+(o.rows.length-3)+" more";
  return '<div class="row">'+
    '<div><div class="main"><span class="po">'+esc(o.po)+'</span> · '+o.left+' to build</div>'+
    '<div class="meta">'+head+'</div></div>'+
    '<div class="right">'+esc(o.when||"")+'</div></div>';
}

/* A single large order hides the order to build it in. This is the same
   lines, flattened and ranked by the date they are due. */
function rowPrio(r){
  return '<div class="row">'+
    '<div><div class="main"><span class="rank">'+r.rank+'</span>'+
      esc((r.colour ? r.colour+" " : "")+r.name)+'</div>'+
    '<div class="meta">'+esc(r.code||"")+' · <span class="po">'+esc(r.po)+'</span></div></div>'+
    '<div class="right">'+r.left+' · '+esc(r.when||"")+'</div></div>';
}

async function loadPlan(){
  try{
    var r = await fetch(IB_URL+"/plan", { headers:{ "x-device-key": KEY } });
    if(!r.ok) return;              /* the board read reports the real error */
    var d = await r.json();
    var rows = PLAN_MODE === "priority" ? (d.priority||[]) : (d.orders||[]);
    fill("plan-list", rows, PLAN_MODE === "priority" ? rowPrio : rowPlan,
         "Nothing ordered for the coming weeks.", 12);
    document.getElementById("plan-cnt").textContent =
      PLAN_MODE === "priority"
        ? (d.priority||[]).reduce(function(a,x){return a+x.left;},0) + " still to build"
        : (d.orders||[]).length + " open order" + ((d.orders||[]).length===1?"":"s");
  }catch(e){ /* the plan is the least important panel on the wall */ }
}
/* One shape for both sites: a code, where it is going, a line of detail,
   and a figure on the right. At Velovisie the code is a bike serial and the
   destination a customer; at MTB it is a wheel and the destination Hasselt. */
function rowOut(b){
  return '<div class="row'+(b.ready?"":" pending")+'">'+
    '<div><div class="main"><span class="sn">'+esc(b.code)+'</span> &rarr; '+esc(b.to||"—")+'</div>'+
    '<div class="meta">'+esc(b.sub||"")+'</div></div>'+
    '<div class="right">'+esc(b.right||"")+'</div></div>';
}
/* Inbound runs two columns, so it holds roughly twice as many lines as the
   outbound stack beside it. Anything past the cap is counted in the header
   rather than scrolled — a wall screen nobody touches must not hide rows
   below the fold. */
function fill(id, rows, html, emptyText, max){
  var el = document.getElementById(id);
  el.innerHTML = rows.length ? rows.slice(0, max).map(html).join("")
                             : '<div class="empty">'+emptyText+'</div>';
}
async function load(){
  var msg = document.getElementById("msg");
  try{
    var r = await fetch(IB_URL+"/board", { headers:{ "x-device-key": KEY } });
    if(r.status === 401 || r.status === 403){
      askKey("This screen's device key is no longer valid.\nPaste the new one:");
      throw new Error("device key refused — enter the new key");
    }
    if(!r.ok) throw new Error("Worker said "+r.status);
    var d = await r.json();
    /* The heading is the site the device key belongs to — never assumed.
       A tablet holding MTB's key shows MTB's board, titled MTB. */
    /* This page is MTB's. A tablet holding another site's key gets a plain
       refusal rather than someone else's board under our name. */
    if(d.key && d.key !== SITE){
      document.getElementById("site").textContent = "Wrong screen";
      document.getElementById("sub").textContent  =
        "This device key belongs to " + (d.site||d.key) + " \u2014 open that site's board instead.";
      document.getElementById("in-list").innerHTML  = "";
      document.getElementById("out-list").innerHTML = "";
      document.getElementById("in-cnt").textContent = "";
      document.getElementById("out-cnt").textContent = "";
      document.getElementById("plan-list").innerHTML = "";
      document.getElementById("plan-cnt").textContent = "";
      return;
    }
    document.getElementById("site").textContent = d.site || "MTB Maastricht";
    document.getElementById("sub").textContent  = "wheel board";
    fill("in-list",  d.inbound||[],  rowIn,  "Nothing on its way.", 18);
    fill("out-list", d.outbound||[], rowOut, "No wheel ready to ship.", 9);
    document.getElementById("in-cnt").textContent  =
      (d.inbound||[]).length + " delivery" + ((d.inbound||[]).length===1?"":"s") + " due" +
      ((d.inbound||[]).length > 18 ? " · 18 shown" : "");
    var ready = (d.outbound||[]).filter(function(b){ return b.ready; }).length;
    document.getElementById("out-cnt").textContent =
      ready + " ready · " + (d.outbound||[]).length + " in hand";
    document.getElementById("stamp").textContent =
      "updated " + new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
    msg.textContent = "";
  }catch(e){
    msg.className = "err";
    msg.textContent = "· " + String(e.message||e);
  }
}
tick(); setInterval(tick, 20000);
load();     setInterval(load, 60000);
loadPlan(); setInterval(loadPlan, 300000);
</script>
</body></html>
