<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ahooga — Support inbox (internal)</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
 :root{--ink:#16160f;--dim:#6f6d63;--line:#e6e3da;--gold:#f2b705;--gold-d:#caa006;--bg2:#f5f4f1}
 *{box-sizing:border-box}html,body{margin:0;height:100%}
 body{font-family:'Archivo',system-ui,sans-serif;color:var(--ink);background:#fff;height:100vh;display:flex;flex-direction:column}
 header{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line)}
 header b{font-weight:900}.tag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
 .spacer{flex:1}.muted{color:var(--dim);font-size:12px}
 .gate{max-width:360px;margin:12vh auto;text-align:center}
 .gate input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;margin:10px 0}
 .gate button{width:100%;padding:13px;border:0;border-radius:10px;background:var(--gold);font-weight:800;cursor:pointer;font-family:inherit}
 .main{flex:1;display:grid;grid-template-columns:300px 1fr;min-height:0}
 .list{border-right:1px solid var(--line);overflow:auto}
 .th{padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer}
 .th:hover{background:var(--bg2)}.th.on{background:#fffbe9}
 .th .nm{font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px}
 .dot{background:#e24b4a;color:#fff;font-size:10px;font-weight:800;border-radius:10px;padding:1px 7px}
 .th .ls{font-size:12.5px;color:var(--dim);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .conv{display:flex;flex-direction:column;min-height:0}
 .convh{padding:12px 18px;border-bottom:1px solid var(--line);font-weight:800}
 .feed{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:10px;background:var(--bg2)}
 .m{max-width:70%;padding:9px 13px;border-radius:12px;font-size:14px;line-height:1.45;white-space:pre-wrap}
 .m.dealer{background:#fff;border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
 .m.ahooga{background:#16160f;color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
 .m .t{display:block;font-size:10.5px;opacity:.6;margin-top:4px}
 .cbar{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--line)}
 .cbar textarea{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 13px;font-family:inherit;font-size:14px;resize:none}
 .cbar button{border:0;border-radius:10px;background:var(--gold);font-weight:800;padding:0 20px;cursor:pointer;font-family:inherit}
 .empty{margin:auto;color:var(--dim)}
</style></head>
<body>
<div id="gate" class="gate">
 <h2>Ahooga support inbox</h2>
 <p class="muted">Internal — enter the admin password.</p>
 <input id="pw" type="password" placeholder="Admin password" onkeydown="if(event.key==='Enter')enter()">
 <button onclick="enter()">Open inbox</button>
 <div id="gmsg" class="muted" style="color:#b3261e;margin-top:8px"></div>
</div>
<div id="app" style="display:none;height:100%;flex-direction:column">
 <header><button onclick="goBack()" style="border:1px solid var(--line);background:#fff;border-radius:16px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--dim);cursor:pointer;font-family:inherit">← Back</button><b>Ahooga</b><span class="tag">Support inbox</span><span class="spacer"></span><button onclick="adminLock()" style="border:1px solid var(--line);background:#fff;border-radius:16px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--dim);cursor:pointer;font-family:inherit">🔒 Lock</button><span class="muted" id="status">live</span></header>
 <div class="main">
  <div class="list" id="list"></div>
  <div class="conv" id="conv"><div class="empty">Select a conversation</div></div>
 </div>
</div>
<script>
const CF="https://ahooga-odoo-proxy.ahoogahouse-1050-be.workers.dev";
let pw="",cur=null,threads=[],msgs=[],tPoll=null,mPoll=null;
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function ago(ts){if(!ts)return"";const d=Math.floor((Date.now()-ts)/1000);if(d<60)return"now";if(d<3600)return Math.floor(d/60)+"m";if(d<86400)return Math.floor(d/3600)+"h";return new Date(ts).toLocaleDateString(undefined,{day:"2-digit",month:"short"});}
async function api(path,extra){const r=await fetch(CF+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.assign({adminPw:pw},extra||{}))});return r.json();}
function goBack(){try{if(window.parent&&window.parent!==window&&window.parent.closeApp){window.parent.closeApp();return;}}catch(e){}if(history.length>1){history.back();}else{location.href='index.html';}}
function adminSavePw(){try{localStorage.setItem('ahg_admin_pw',pw);}catch(e){}}
function adminClearPw(){try{localStorage.removeItem('ahg_admin_pw');}catch(e){}}
function adminLock(){adminClearPw();location.reload();}
window.addEventListener('DOMContentLoaded',function(){try{var _sp=localStorage.getItem('ahg_admin_pw');if(_sp){var _i=document.getElementById('pw');if(_i){_i.value=_sp;enter(true);}}}catch(e){}});
async function enter(silent){pw=document.getElementById("pw").value||"";const d=await api("/support/admin/threads");if(d.error){if(!silent)document.getElementById("gmsg").textContent=d.error;adminClearPw();return;}adminSavePw();
 document.getElementById("gate").style.display="none";document.getElementById("app").style.display="flex";
 threads=d.threads||[];renderList();tPoll=setInterval(loadThreads,10000);}
async function loadThreads(){const d=await api("/support/admin/threads");if(d.threads){threads=d.threads;renderList();}}
function renderList(){document.getElementById("list").innerHTML=threads.map(t=>'<div class="th'+(cur===t.pid?' on':'')+'" onclick="open_(\''+t.pid+'\',\''+esc(t.name).replace(/\x27/g,"")+'\')"><div class="nm">'+esc(t.name)+(t.unread?' <span class="dot">'+t.unread+'</span>':'')+'</div><div class="ls">'+esc(t.last||'')+' · '+ago(t.lastTs)+'</div></div>').join("")||'<div class="empty" style="padding:20px">No conversations yet</div>';}
async function open_(pid,name){cur=pid;renderList();document.getElementById("conv").innerHTML='<div class="convh">'+esc(name)+'</div><div class="feed" id="feed"></div><div class="cbar"><textarea id="rep" rows="2" placeholder="Reply to '+esc(name)+'…" onkeydown="if(event.key===\x27Enter\x27&&!event.shiftKey){event.preventDefault();reply()}"></textarea><button onclick="reply()">Send</button></div>';
 await loadMsgs();if(mPoll)clearInterval(mPoll);mPoll=setInterval(loadMsgs,8000);}
async function loadMsgs(){if(!cur)return;const d=await api("/support/admin/messages",{pid:cur});if(d.messages){msgs=d.messages;const f=document.getElementById("feed");if(f){f.innerHTML=msgs.map(m=>'<div class="m '+(m.from==="ahooga"?"ahooga":"dealer")+'">'+esc(m.text)+'<span class="t">'+(m.from==="ahooga"?"Ahooga":esc(m.name))+' · '+ago(m.ts)+'</span></div>').join("");f.scrollTop=f.scrollHeight;}loadThreads();}}
async function reply(){const ta=document.getElementById("rep");const text=(ta.value||"").trim();if(!text||!cur)return;ta.value="";const d=await api("/support/admin/post",{pid:cur,text});if(d.error){alert(d.error);return;}loadMsgs();}
</script>
</body></html>
