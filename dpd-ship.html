<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap');
:root{
  --paper:#f7f4ec;--paper-2:#efe9dc;--card:#fff;--line:#e4ddcd;--line-soft:#eee8da;
  --ink:#1d1c16;--ink-dim:#6b6557;--ink-faint:#9a9384;--gold:#c9991f;--pink:#ea1d5e;
  --blue:#2b7fd6;--green:#2e8c3c;--red:#c01650;--radius:14px;--dpd:#dc0032;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Archivo',system-ui,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
.mono{font-family:'Space Mono',monospace}
header{display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:64px;background:rgba(255,255,255,.8);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.logo{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:-.5px;font-size:18px}
.logo .b{color:var(--dpd)}
.logo .tag{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);border-left:1px solid var(--line);padding-left:12px}
.pills{display:flex;gap:8px;align-items:center}
.pill{font-family:'Space Mono',monospace;font-size:11px;padding:5px 11px;border-radius:20px;background:var(--paper-2);color:var(--ink-faint);border:1px solid var(--line)}
.pill.ok{background:rgba(46,140,60,.1);color:var(--green);border-color:rgba(46,140,60,.3)}
.pill.err{background:rgba(234,29,94,.08);color:var(--red);border-color:rgba(234,29,94,.3)}
.wrap{max-width:1180px;margin:0 auto;padding:24px 28px 60px}
.connect{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:20px}
.fld{display:flex;flex-direction:column;flex:1;min-width:200px}
.fld label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-faint);margin-bottom:6px}
.fld input,.fld select{padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-family:'Space Mono',monospace;font-size:13px;background:#fff;outline:none}
.fld input:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(43,127,214,.14)}
.btn{padding:10px 18px;border:0;border-radius:9px;cursor:pointer;font-family:'Archivo';font-weight:800;font-size:13px;color:#fff;background:linear-gradient(100deg,var(--dpd),#ff5a2c 140%);box-shadow:0 4px 14px rgba(220,0,50,.2);white-space:nowrap}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.blue{background:var(--blue);box-shadow:0 4px 14px rgba(43,127,214,.2)}
.btn.red{background:var(--dpd);box-shadow:0 4px 14px rgba(220,0,50,.2)}
.btn.sm{padding:6px 12px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.tabs{display:flex;gap:6px;margin-bottom:18px;border-bottom:1px solid var(--line)}

.alert.ok{background:rgba(46,140,60,.1);color:var(--green);border:1px solid rgba(46,140,60,.3)}
.alert.warn{background:rgba(201,153,31,.12);color:#8a6a12;border:1px solid rgba(201,153,31,.35)}
.alert.err{background:rgba(234,29,94,.08);color:var(--red);border:1px solid rgba(234,29,94,.3)}
.toolbar{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
.toolbar .fld{flex:0 0 auto;min-width:0}
.toolbar input[type=text]{min-width:220px}
.row{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden}
.row-head{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.row-head:hover{background:var(--paper-2)}
.r-name{font-weight:800;font-family:'Space Mono',monospace;font-size:13px;min-width:96px}
.r-cust{font-weight:600;flex:1;min-width:120px}
.r-so{font-family:'Space Mono',monospace;font-size:11.5px;color:var(--blue);min-width:70px}
a.r-so{text-decoration:none;cursor:pointer}
a.r-so:hover{text-decoration:underline}
.r-meta{font-size:12px;color:var(--ink-dim)}
.badge{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:3px 9px;border-radius:20px;white-space:nowrap}
.badge.ready{background:rgba(43,127,214,.1);color:var(--blue)}
.badge.wait{background:rgba(201,153,31,.14);color:#8a6a12}
.badge.done{background:var(--paper-2);color:var(--ink-dim)}
.badge.booked{background:rgba(220,0,50,.1);color:var(--dpd)}
.badge.tin{background:rgba(43,127,214,.08);color:var(--blue)}
.badge.tout{background:rgba(201,153,31,.12);color:#8a6a12}
.detail{border-top:1px solid var(--line);padding:14px 16px;background:#fcfbf7;display:none}
.detail.open{display:block}
.info{font-size:12.5px;color:var(--ink-dim);margin:4px 0}
.info b{color:var(--ink)}
.grid2{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0}
.box{flex:1;min-width:240px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}
.box.full{flex-basis:100%}
.box h4{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-faint);margin-bottom:8px}
.minif{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.minif .fld{min-width:90px}
.minif .fld input{padding:7px 9px;font-size:12px}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-dim);margin-top:8px}

.muted{color:var(--ink-faint)}
.empty{text-align:center;color:var(--ink-faint);padding:40px;font-size:13px}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--dpd);border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
.cap{font-size:11px;color:var(--ink-faint);margin-top:4px}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px}
table.tbl th{text-align:left;color:var(--ink-faint);font-size:10px;text-transform:uppercase;letter-spacing:.1em;padding:4px 6px;border-bottom:1px solid var(--line)}
table.tbl td{padding:5px 6px;border-bottom:1px solid var(--line-soft);vertical-align:top}
td.num{text-align:right;font-family:'Space Mono',monospace;white-space:nowrap}
.dpd-box{background:rgba(220,0,50,.04);border:1px solid rgba(220,0,50,.22)}
table.pkg input{padding:5px 6px;border:1px solid var(--line);border-radius:7px;font-family:'Space Mono',monospace;font-size:12px;background:#fff;width:54px}
</style>

<body>
<header>
  <div class="logo">DPD <span class="b">Ship</span> <span class="tag">Odoo → DPD</span> <span class="tag" style="background:#0a7d32;color:#fff">build 2026‑07‑02 (draft≠sent clarity + live DPD status)</span></div>
  <div class="pills">
    <span id="dpd-pill" class="pill">DPD: ?</span>
    <span id="conn-pill" class="pill">Not connected</span>
  </div>
</header>

<div class="wrap">
  <div class="connect">
    <div class="fld"><label>Odoo Email</label><input id="cfg-user" placeholder="yourname@ahooga.bike"/></div>
    <div class="fld"><label>Odoo Password / API key</label><input id="cfg-key" type="password" placeholder="your odoo password"/></div>
    <button class="btn" onclick="connectAndLoad()">Connect &amp; load transfers →</button>
    <button class="btn ghost" onclick="loadDeliveries()">Refresh</button>
  </div>

  <div id="alert"></div>

  <div class="tabs">
    <button class="tab active" id="nav-deliveries" onclick="showTab('deliveries')">Transfers</button>
    <button class="tab" id="nav-track" onclick="showTab('track')">Track</button>
    <button class="tab" id="nav-settings" onclick="showTab('settings')">Settings</button>
  </div>

  <div class="view active" id="view-deliveries">
    <div class="toolbar">
      <div class="fld"><label>Type</label>
        <select id="ptype" onchange="loadDeliveries()">
          <option value="outgoing">Outgoing only</option>
          <option value="both">Outgoing + Internal</option>
          <option value="internal">Internal only</option>
        </select>
      </div>
      <div class="fld"><label>Show</label>
        <select id="pstate" onchange="loadDeliveries()">
          <option value="open">Ready + Waiting</option>
          <option value="all">All (incl. done)</option>
        </select>
      </div>
      <div class="fld"><label>How many</label>
        <select id="plimit" onchange="loadDeliveries()">
          <option value="80">80</option>
          <option value="200">200</option>
          <option value="500">500</option>
        </select>
      </div>
      <div class="fld" style="flex:1"><label>Filter</label><input type="text" id="pfilter" placeholder="name, customer or SO…" oninput="onFilterInput()"/></div>
      <label class="muted" style="font-size:12.5px;padding-bottom:10px"><input type="checkbox" id="hide-booked" onchange="renderDeliveries()"/> hide sent</label>
    </div>
    <div class="muted" style="font-size:12.5px;margin-bottom:8px" id="del-count"></div>
    <div id="del-list"><div class="empty">Enter your Odoo email + password, then “Connect &amp; load transfers”. DPD is used for accessories &amp; spare parts.</div></div>
  </div>

  <div class="view" id="view-track">
    <div class="toolbar">
      <div class="fld" style="max-width:340px"><label>DPD parcel / tracking number</label><input id="trk-id" placeholder="e.g. 09988776655443"/></div>
      <button class="btn red sm" onclick="doTrack()">Track →</button>
    </div>
    <div id="trk-body"><div class="empty">Enter a DPD parcel/tracking number to fetch its latest status &amp; events.</div></div>
  </div>

  <div class="view" id="view-settings"><div id="settings-body"></div></div>
</div>
<script>
/* DPD Ship — hosted front-end. Odoo via planner-proxy; DPD via ahooga-dpd-proxy worker.
   Used for shipping accessories & spare parts (parcel shipping, not pallets). */
const CF_WORKER   = 'https://ahooga-odoo-proxy.ahoogahouse-1050-be.workers.dev';
const ODOO_URL    = 'https://ahooga.odoo.com';
const ODOO_DB     = 'logicasoft-aho-18-0-21599177';
const DPD_WORKER_DEFAULT = 'https://ahooga-dpd-proxy.ahoogahouse-1050-be.workers.dev';
let   DPD_WORKER = (function(){ try{ return localStorage.getItem('dpd_worker')||DPD_WORKER_DEFAULT; }catch(e){ return DPD_WORKER_DEFAULT; } })();

let odooUid=null, DELIVERIES=[], _ccache={}, _hasSaleId=true, PKGROWS={};

const $ = (id)=>document.getElementById(id);
const cssId = (s)=>(s||'').replace(/[^a-z0-9]/gi,'');
const esc = (s)=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const num = (x)=> (x==null||x===''?0:Number(x));
const soOf = (d)=> (Array.isArray(d.sale_id)? d.sale_id[1] : '') || d.origin || '';

function setPill(state){ const p=$('conn-pill'); if(state==='ok'){p.textContent='✓ Connected';p.className='pill ok';} else if(state==='err'){p.textContent='Connection error';p.className='pill err';} else if(state==='loading'){p.innerHTML='<span class="spin"></span> Loading…';p.className='pill';} else {p.textContent='Not connected';p.className='pill';} }
function alert_(msg,type){ $('alert').innerHTML=`<div class="alert ${type}">${msg}</div>`; if(type==='ok') setTimeout(()=>{$('alert').innerHTML='';},6000); window.scrollTo({top:0,behavior:'smooth'}); }
function creds(){ return { user:$('cfg-user').value.trim(), key:$('cfg-key').value.trim() }; }

/* ── Odoo client ── */
function proxyUrl(path){ return `${CF_WORKER}/odoo/${encodeURIComponent(ODOO_URL+path)}`; }
function v(x){
  if(x===null||x===undefined) return '<value><boolean>0</boolean></value>';
  if(typeof x==='boolean') return `<value><boolean>${x?1:0}</boolean></value>`;
  if(typeof x==='number'&&Number.isInteger(x)) return `<value><int>${x}</int></value>`;
  if(typeof x==='number') return `<value><double>${x}</double></value>`;
  if(Array.isArray(x)) return `<value><array><data>${x.map(v).join('')}</data></array></value>`;
  if(typeof x==='object'){ const m=Object.entries(x).map(([k,vv])=>`<member><name>${k}</name>${v(vv)}</member>`).join(''); return `<value><struct>${m}</struct></value>`; }
  return `<value><string>${String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</string></value>`;
}
function parseXml(xml){
  const doc=new DOMParser().parseFromString(xml,'text/xml');
  if(doc.querySelector('fault')) throw new Error('Odoo: '+(doc.querySelector('faultString')?.textContent?.substring(0,200)||'fault'));
  function pv(n){ if(!n)return null; const c=n.firstElementChild; if(!c)return n.textContent;
    switch(c.tagName){
      case'int':case'i4':case'i8':return parseInt(c.textContent);
      case'double':return parseFloat(c.textContent);
      case'boolean':return c.textContent==='1';
      case'string':return c.textContent;
      case'nil':return null;
      case'array':return Array.from(c.querySelector('data')?.children||[]).map(pv);
      case'struct':{const o={};c.querySelectorAll(':scope>member').forEach(m=>{o[m.querySelector('name').textContent]=pv(m.querySelector('value'))});return o;}
      default:return c.textContent;
    } }
  return pv(doc.querySelector('methodResponse>params>param>value'));
}
async function odoo(model,method,args,kwargs={}){
  const {user,key}=creds();
  if(!odooUid){
    const b=`<?xml version="1.0"?><methodCall><methodName>authenticate</methodName><params>${[v(ODOO_DB),v(user),v(key),v({})].map(x=>`<param>${x}</param>`).join('')}</params></methodCall>`;
    const r=await fetch(proxyUrl('/xmlrpc/2/common'),{method:'POST',headers:{'Content-Type':'application/xml'},body:b});
    odooUid=parseXml(await r.text());
    if(!odooUid||typeof odooUid!=='number') throw new Error('Odoo authentication failed — check your email and password/API key.');
  }
  const params=[v(ODOO_DB),v(odooUid),v(key),v(model),v(method),v(args),v(kwargs)];
  const b=`<?xml version="1.0"?><methodCall><methodName>execute_kw</methodName><params>${params.map(x=>`<param>${x}</param>`).join('')}</params></methodCall>`;
  const r=await fetch(proxyUrl('/xmlrpc/2/object'),{method:'POST',headers:{'Content-Type':'application/xml'},body:b});
  return parseXml(await r.text());
}

/* ── DPD worker client ── */
async function dpd(path,body){
  const r=await fetch(`${DPD_WORKER}${path}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});
  const t=await r.text();
  let j; try{ j=JSON.parse(t); }catch(e){ j={ok:false,error:'DPD worker returned non-JSON: '+t.slice(0,200)}; }
  if(!r.ok && j && j.error==null) j.error='HTTP '+r.status;
  return j;
}
async function dpdPing(){
  const p=$('dpd-pill');
  try{ const r=await fetch(`${DPD_WORKER}/health`); const j=await r.json().catch(()=>({}));
    if(r.ok&&(j.ok||j.status==='ok')){ p.textContent='DPD: '+(j.env||'ready'); p.className='pill ok'; }
    else { p.textContent='DPD: not ready'; p.className='pill err'; }
  }catch(e){ p.textContent='DPD: unreachable'; p.className='pill err'; }
}

(function prefill(){ try{ const c=localStorage.getItem('mxp_cfg'); if(c){ const cfg=JSON.parse(c); if(cfg.user)$('cfg-user').value=cfg.user; if(cfg.key)$('cfg-key').value=cfg.key; } }catch(e){} })();

async function connectAndLoad(){
  const {user,key}=creds(); if(!user||!key){ alert_('Enter your Odoo email and password.','warn'); return; }
  odooUid=null; setPill('loading');
  try{
    try{ const c=localStorage.getItem('mxp_cfg'); const cfg=c?JSON.parse(c):{}; cfg.user=user; cfg.key=key; localStorage.setItem('mxp_cfg',JSON.stringify(cfg)); }catch(e){}
    await odoo('res.users','search_read',[[['id','=',1]]],{fields:['name'],limit:1});
    await loadDeliveries();
  }catch(e){ alert_('Could not connect: '+esc(e.message),'err'); setPill('err'); }
}

function typeDomain(){
  const t=$('ptype').value;
  if(t==='outgoing') return ['picking_type_code','=','outgoing'];
  if(t==='internal') return ['picking_type_code','=','internal'];
  return ['picking_type_code','in',['outgoing','internal']];
}

async function loadDeliveries(){
  const {user,key}=creds(); if(!user||!key){ alert_('Enter your Odoo email and password.','warn'); return; }
  setPill('loading');
  const states = $('pstate').value==='all' ? ['assigned','confirmed','done'] : ['assigned','confirmed'];
  const limit = parseInt($('plimit').value)||80;
  const baseFields=['name','state','origin','scheduled_date','date_done','partner_id','carrier_id','carrier_tracking_ref','weight','picking_type_code'];
  const domain=[typeDomain(),['state','in',states]];
  try{
    let pickings;
    try{ pickings=await odoo('stock.picking','search_read',[domain],{fields:baseFields.concat(_hasSaleId?['sale_id']:[]),limit,order:'scheduled_date desc'}); }
    catch(e){ if(_hasSaleId){ _hasSaleId=false; pickings=await odoo('stock.picking','search_read',[domain],{fields:baseFields,limit,order:'scheduled_date desc'}); } else throw e; }
    DELIVERIES=pickings||[];
    await attachPartners(DELIVERIES);
    setPill('ok'); renderDeliveries();
    if(!DELIVERIES.length) alert_('No transfers found for this filter.','warn');
  }catch(e){ alert_('Could not load transfers: '+esc(e.message),'err'); setPill('err'); }
}

let _searchTimer=null;
async function attachPartners(records){
  const pids=[...new Set(records.map(d=>Array.isArray(d.partner_id)?d.partner_id[0]:null).filter(Boolean))];
  if(!pids.length) return;
  const partners={};
  const recs=await odoo('res.partner','read',[pids,['name','street','street2','zip','city','country_id','phone','mobile','email']]);
  (recs||[]).forEach(r=>{ partners[r.id]=r; });
  const cids=[...new Set((recs||[]).map(r=>Array.isArray(r.country_id)?r.country_id[0]:null).filter(Boolean))];
  if(cids.length){ const cs=await odoo('res.country','read',[cids,['code']]); (cs||[]).forEach(c=>{ _ccache[c.id]=c.code; }); }
  records.forEach(d=>{ const pid=Array.isArray(d.partner_id)?d.partner_id[0]:null; if(pid&&partners[pid]) d.partner=partners[pid]; });
}
/* Filter box also searches Odoo directly (debounced), so any SO / transfer is found regardless of the loaded window. */
function onFilterInput(){
  renderDeliveries();
  clearTimeout(_searchTimer);
  const q=($('pfilter').value||'').trim();
  if(q.length<2) return;
  _searchTimer=setTimeout(()=>serverSearch(q),400);
}
async function serverSearch(q){
  const {user,key}=creds(); if(!user||!key) return;
  const states = $('pstate').value==='all' ? ['assigned','confirmed','done'] : ['assigned','confirmed'];
  const baseFields=['name','state','origin','scheduled_date','date_done','partner_id','carrier_id','carrier_tracking_ref','weight','picking_type_code'];
  const or=[['name','ilike',q],['origin','ilike',q],['partner_id.name','ilike',q]];
  if(_hasSaleId) or.push(['sale_id.name','ilike',q]);
  const orPrefix=[]; for(let i=0;i<or.length-1;i++) orPrefix.push('|');
  const domain=['&','&',typeDomain(),['state','in',states]].concat(orPrefix).concat(or);
  const cnt=$('del-count'); const q0=q;
  try{
    if(cnt) cnt.textContent='Searching Odoo…';
    let found;
    try{ found=await odoo('stock.picking','search_read',[domain],{fields:baseFields.concat(_hasSaleId?['sale_id']:[]),limit:200,order:'scheduled_date desc'}); }
    catch(e){ if(_hasSaleId){ _hasSaleId=false; return serverSearch(q0); } throw e; }
    const have=new Set(DELIVERIES.map(d=>d.id));
    const fresh=(found||[]).filter(d=>!have.has(d.id));
    if(fresh.length){ await attachPartners(fresh); DELIVERIES=DELIVERIES.concat(fresh); }
    renderDeliveries();
  }catch(e){ renderDeliveries(); }
}
function soUrl(d){ return (Array.isArray(d.sale_id)&&d.sale_id[0]) ? (ODOO_URL+'/web#id='+d.sale_id[0]+'&model=sale.order&view_type=form') : ''; }
function soCell(d){ const so=soOf(d); const u=soUrl(d); return u ? `<a class="r-so" href="${u}" target="_blank" rel="noopener" title="Open sales order in Odoo" onclick="event.stopPropagation()">${esc(so)}</a>` : `<span class="r-so" title="Sales order / source">${esc(so)}</span>`; }

function stateBadge(d){
  if(d.carrier_tracking_ref) return '<span class="badge booked">Sent · DPD '+esc(d.carrier_tracking_ref)+'</span>';
  if(d.state==='assigned') return '<span class="badge ready">Ready</span>';
  if(d.state==='confirmed') return '<span class="badge wait">Waiting</span>';
  if(d.state==='done') return '<span class="badge done">Done</span>';
  return '<span class="badge done">'+esc(d.state)+'</span>';
}
function typeBadge(d){
  return d.picking_type_code==='internal' ? '<span class="badge tin">Internal</span>' : '<span class="badge tout">Outgoing</span>';
}
function addrLine(p){
  if(!p) return '(no address)';
  const cc=Array.isArray(p.country_id)?(_ccache[p.country_id[0]]||p.country_id[1]):'';
  return [p.street,p.street2,[p.zip,p.city].filter(Boolean).join(' '),cc].filter(Boolean).join(', ');
}

function renderDeliveries(){
  const box=$('del-list'); const hide=$('hide-booked').checked;
  const q=($('pfilter').value||'').toLowerCase().trim();
  let list=DELIVERIES.slice();
  if(hide) list=list.filter(d=>!d.carrier_tracking_ref);
  if(q) list=list.filter(d=>{
    const cust=Array.isArray(d.partner_id)?d.partner_id[1]:'';
    return (d.name+' '+cust+' '+soOf(d)).toLowerCase().includes(q);
  });
  $('del-count').textContent=`${list.length} shown · ${DELIVERIES.length} loaded`;
  if(!list.length){ box.innerHTML='<div class="empty">Nothing to show.</div>'; return; }
  box.innerHTML=list.map(d=>{
    const id=cssId(d.name);
    const cust=Array.isArray(d.partner_id)?d.partner_id[1]:'(no partner)';
    const so=soOf(d);
    const when=(d.scheduled_date||d.date_done||'').replace('T',' ').slice(0,16);
    return `<div class="row">
      <div class="row-head" onclick="toggle('${id}')">
        <span class="r-name">${esc(d.name)}</span>
        <span class="r-cust">${esc(cust)}</span>
        ${soCell(d)}
        <span class="r-meta">${esc(when)}</span>
        <span class="r-meta mono">${d.weight?Number(d.weight).toFixed(1)+' kg':''}</span>
        ${typeBadge(d)} ${stateBadge(d)}
        <span style="flex:1"></span>
        ${d.carrier_tracking_ref?'<span class="muted" style="font-size:12px">sent ✓</span>':'<button class="btn red sm" onclick="event.stopPropagation();toggle(\''+id+'\',true)">Book DPD →</button>'}
      </div>
      <div class="detail" id="d-${id}"></div>
    </div>`;

async function toggle(id,forceOpen){
  const el=$('d-'+id); if(!el)return;
  if(el.classList.contains('open')&&!forceOpen){ el.classList.remove('open'); el.innerHTML=''; return; }
  const d=DELIVERIES.find(x=>cssId(x.name)===id); if(!d)return;
  el.classList.add('open');
  if(!d._loaded){
    el.innerHTML='<div class="info"><span class="spin"></span> Loading transfer contents…</div>';
    try{ await loadPickingDetail(d); d._loaded=true; }
    catch(e){ d._lines=[]; d._loadErr=e.message; d._loaded=true; }
  }
  if(!PKGROWS[id]) PKGROWS[id]=buildRows(d);
  el.innerHTML=detailHtml(d,id);
  if(d.carrier_tracking_ref) loadDpdStatus(d,id);
}

async function loadPickingDetail(d){
  // validated move lines: product, done quantity, lot, package
  const mls=await odoo('stock.move.line','search_read',[[['picking_id','=',d.id]]],
    {fields:['product_id','quantity','lot_id','lot_name','product_uom_id','result_package_id']});
  d._lines=mls||[];
  const pids=[...new Set(d._lines.map(m=>Array.isArray(m.product_id)?m.product_id[0]:null).filter(Boolean))];
  d._wt={};
  if(pids.length){
    let ps;
    try{
      ps=await odoo('product.product','read',[pids,['weight','default_code','x_gross_weight']]);
    }catch(e){
      // x_gross_weight lives on product.template, not the variant → read base + template
      ps=await odoo('product.product','read',[pids,['weight','default_code','product_tmpl_id']]);
      const tids=[...new Set((ps||[]).map(p=>Array.isArray(p.product_tmpl_id)?p.product_tmpl_id[0]:null).filter(Boolean))];
      let tmap={};
      if(tids.length){ try{ const ts=await odoo('product.template','read',[tids,['x_gross_weight']]); (ts||[]).forEach(t=>{tmap[t.id]=t.x_gross_weight;}); }catch(e2){} }
      (ps||[]).forEach(p=>{ const tid=Array.isArray(p.product_tmpl_id)?p.product_tmpl_id[0]:null; p.x_gross_weight=tid?tmap[tid]:undefined; });
    }
    (ps||[]).forEach(p=>{ const g=(p.x_gross_weight!=null&&p.x_gross_weight!==false&&p.x_gross_weight!=='')?Number(p.x_gross_weight):null; d._wt[p.id]={weight:(g!=null?g:p.weight),code:p.default_code,gross:g,net:p.weight}; });
  }
  // packages used on the transfer → pull dimensions/weight if Odoo has them
  d._odooPkgs=[];
  try{
    const pkgIds=[...new Set(d._lines.map(m=>Array.isArray(m.result_package_id)?m.result_package_id[0]:null).filter(Boolean))];
    if(pkgIds.length){
      const pks=await odoo('stock.quant.package','read',[pkgIds,['name','package_type_id','shipping_weight']]);
      const tids=[...new Set((pks||[]).map(x=>Array.isArray(x.package_type_id)?x.package_type_id[0]:null).filter(Boolean))];
      let types={};
      if(tids.length){ const ts=await odoo('stock.package.type','read',[tids,['name','packaging_length','width','height']]); (ts||[]).forEach(t=>{types[t.id]=t;}); }
      d._odooPkgs=(pks||[]).map(pk=>{ const t=Array.isArray(pk.package_type_id)?types[pk.package_type_id[0]]:null;
        return { name:pk.name, l:t?t.packaging_length:0, w:t?t.width:0, h:t?t.height:0, weight:pk.shipping_weight||0 }; });
    }
  }catch(e){ d._odooPkgs=[]; }
}

/* ── parcel rows (multi-parcel; DPD is parcel shipping) ── */
function buildRows(d){
  const defs=getDefaults();
  if(d._odooPkgs&&d._odooPkgs.length){
    return d._odooPkgs.map(pk=>({ qty:1, weight: pk.weight||defs.weight, l: pk.l||defs.length, w: pk.w||defs.width, h: pk.h||defs.height, content:'' }));
  }
  const gt=(d._lines||[]).reduce((s,m)=>{const pid=Array.isArray(m.product_id)?m.product_id[0]:null;const wi=pid&&d._wt?d._wt[pid]:null;return s+((wi&&wi.weight?wi.weight*(m.quantity||0):0));},0);
  const wt=gt>0?gt:(d.weight&&Number(d.weight)>0?Number(d.weight):defs.weight);
  return [{ qty:1, weight:wt, l:defs.length, w:defs.width, h:defs.height, content:'' }];
}
function pkgRowsHtml(id){
  const rows=PKGROWS[id]||[];
  const body=rows.map((r,i)=>`<tr>
    <td><input id="prq-${id}-${i}" value="${esc(r.qty)}" inputmode="numeric"/></td>
    <td><input id="prw-${id}-${i}" value="${esc(r.weight)}" inputmode="decimal"/></td>
    <td><input id="prl-${id}-${i}" value="${esc(r.l)}" inputmode="numeric"/></td>
    <td><input id="prW-${id}-${i}" value="${esc(r.w)}" inputmode="numeric"/></td>
    <td><input id="prh-${id}-${i}" value="${esc(r.h)}" inputmode="numeric"/></td>
    <td><input id="prc-${id}-${i}" value="${esc(r.content||'')}" style="width:170px" placeholder="accessories / spare parts"/></td>
    <td>${rows.length>1?'<button class="btn ghost sm" style="padding:3px 8px" onclick="pkgDel(\''+id+'\','+i+')">×</button>':''}</td></tr>`).join('');
  return `<table class="tbl pkg"><thead><tr><th>Qty</th><th>Weight kg</th><th>L cm</th><th>W cm</th><th>H cm</th><th>Content</th><th></th></tr></thead><tbody>${body}</tbody></table>`;
}
function pkgRead(id){
  const rows=PKGROWS[id]||[]; const out=[];
  for(let i=0;i<rows.length;i++){ const q=$('prq-'+id+'-'+i); if(!q) continue;
    out.push({ qty:parseInt(q.value)||1, weight:num(($('prw-'+id+'-'+i)||{}).value), l:num(($('prl-'+id+'-'+i)||{}).value), w:num(($('prW-'+id+'-'+i)||{}).value), h:num(($('prh-'+id+'-'+i)||{}).value), content:(($('prc-'+id+'-'+i)||{}).value)||'' }); }
  if(out.length) PKGROWS[id]=out;
  return PKGROWS[id]||[];
}
function pkgRerender(id){ const c=$('pkgs-'+id); if(c) c.innerHTML=pkgRowsHtml(id); }
function pkgAdd(id){ pkgRead(id); const defs=getDefaults(); PKGROWS[id].push({qty:1,weight:defs.weight,l:defs.length,w:defs.width,h:defs.height,content:''}); pkgRerender(id); }
function pkgDel(id,i){ pkgRead(id); PKGROWS[id].splice(i,1); if(!PKGROWS[id].length){const defs=getDefaults();PKGROWS[id]=[{qty:1,weight:defs.weight,l:defs.length,w:defs.width,h:defs.height,content:''}];} pkgRerender(id); }

function contentsTable(d){
  if(d._loadErr) return '<div class="info" style="color:var(--red)">Could not load contents: '+esc(d._loadErr)+'</div>';
  const lines=d._lines||[];
  if(!lines.length) return '<div class="muted" style="font-size:12.5px">No move lines on this transfer.</div>';
  const rows=lines.map(m=>{
    const pid=Array.isArray(m.product_id)?m.product_id[0]:null;
    const pname=Array.isArray(m.product_id)?m.product_id[1]:'';
    const wi=pid&&d._wt?d._wt[pid]:null;
    const code=wi&&wi.code?wi.code:'';
    const qty=m.quantity||0;
    const lineWt=wi&&wi.weight?(wi.weight*qty):null;
    const pkg=Array.isArray(m.result_package_id)?m.result_package_id[1]:'';
    return `<tr><td>${esc(pname)}${code?' <span class="muted mono">('+esc(code)+')</span>':''}</td>
      <td class="num">${qty}</td>
      <td class="num">${lineWt!=null?lineWt.toFixed(2)+' kg':'<span class="muted">—</span>'}</td>
      <td>${esc(pkg)||'<span class="muted">—</span>'}</td></tr>`;
  }).join('');
  return `<table class="tbl"><thead><tr><th>Product</th><th class="num">Qty</th><th class="num">Weight</th><th>Package</th></tr></thead><tbody>${rows}</tbody></table>`;
}

  const contents=`<div class="box full"><h4>Transfer contents (validated)</h4>${contentsTable(d)}

    <div class="info"><b>${esc(cust)}</b></div>

  const dpdPreview=`<div class="box dpd-box"><h4>What gets pushed to DPD</h4>
    <div class="kvline"><span>Reference</span><span class="mono">${esc(d.name)}</span></div>
    <div class="kvline"><span>Service</span><span class="mono">${esc(defs.service)}</span></div>
    <div class="kvline"><span>Predict notify</span><span>${defs.predict?('Yes — '+esc(defs.predictChannel)):'No'}</span></div>
    <div class="kvline"><span>Parcels</span><span class="mono">${(PKGROWS[id]||[]).length} line(s) — see editor below</span></div>
    <div class="kvline"><span>Sender</span><span>${sendTxt}</span></div>
    <div class="kvline"><span>Recipient</span><span>${esc(cust)} - ${esc([p.zip,p.city,cc].filter(Boolean).join(' '))}</span></div>
    <div class="cap">Service / parcel / sender / Predict defaults are editable in <b>Settings</b>.</div></div>`;

        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn red sm" onclick="printLabel('${id}')">Print label</button>
          <button class="btn ghost sm" onclick="returnLabel('${id}')">Create return label</button>
          <button class="btn ghost sm" onclick="unbookDelivery('${id}')">Mark unbooked</button>
        </div>

    : `<div class="box full"><h4>Book this transfer with DPD</h4>

async function bookDelivery(id){
  const d=DELIVERIES.find(x=>cssId(x.name)===id); if(!d)return;
  const p=d.partner||{};
  const out=$('bk-out-'+id);
  const btns=Array.prototype.slice.call(document.querySelectorAll('.bk-'+id));
  btns.forEach(b=>{ b.disabled=true; b.innerHTML='<span class="spin"></span> Booking…'; });
  out.innerHTML='';
  try{
    const cc=Array.isArray(p.country_id)?(_ccache[p.country_id[0]]||''):'';
    const defs=getDefaults(); const sender=getSender();
    const rows=pkgRead(id);
    const parcels=[];
    rows.forEach(r=>{ const q=Math.max(1,r.qty||1); for(let k=0;k<q;k++){ parcels.push({ weight:Number(r.weight)||defs.weight, length:Number(r.l)||defs.length, width:Number(r.w)||defs.width, height:Number(r.h)||defs.height, content:((r.content||soOf(d)||'Accessories / spare parts')).slice(0,35) }); } });
    const totalWeight=parcels.reduce((s,r)=>s+(Number(r.weight)||0),0);
    const predict=!!$('pn-'+id)?.checked;
    const payload={
      reference: ($('rf-'+id)?.value||d.name).trim(),
      autobook: !!$('ab-'+id)?.checked,
      service: defs.service,
      cargoDesc: (soOf(d)||'Accessories / spare parts').slice(0,35),
      sender: sender||undefined,
      parcels, totalWeight,
      predict: predict ? {
        enabled:true,
        channel: defs.predictChannel,
        email: ($('pe-'+id)?.value||'').trim(),
        sms: ($('ps-'+id)?.value||'').trim()
      } : { enabled:false },
      recipient: { name: Array.isArray(d.partner_id)?d.partner_id[1]:'', street: p.street||'', street2: p.street2||'',
        zip: p.zip||'', city: p.city||'', countryCode: cc,
        phone: p.phone||'', mobile: p.mobile||'', email: p.email||'' }
    };
    const res=await dpd('/book',payload);
    if(!res.ok) throw new Error(res.error||'DPD booking failed.');
    const parcelNo=res.parcelNumber||res.trackingNumber||res.bookingId; const trackingUrl=res.trackingUrl||'';

    if(res.draft){
      // A draft is NOT sent to DPD. Do NOT record it in Odoo and do NOT mark the transfer as booked,
      // so the warehouse can always tell a real (sent) parcel from a draft that still needs shipping.
      try{ await odoo('stock.picking','message_post',[[d.id]],{body:'DPD DRAFT created — NOT sent. Tick “Submit as final booking” and book again to actually ship.'+(parcelNo?' Draft ref: '+String(parcelNo):''),message_type:'comment',subtype_xmlid:'mail.mt_note'}); }catch(e){}
      out.innerHTML='<div class="alert warn">⚠ <b>DRAFT created — this parcel was NOT sent to DPD.</b><br>It will not appear in DPD tracking or your DPD server. To actually ship it, tick <b>“Submit as final booking”</b> above, then press <b>Book with DPD</b> again.</div>';
      btns.forEach(b=>{ b.disabled=false; b.textContent='Book with DPD →'; });
      renderDeliveries();
      alert_('Draft only — '+d.name+' was NOT sent to DPD.','warn');
      return;
    }

    if(!parcelNo) throw new Error('DPD did not return a parcel/tracking number. Raw: '+JSON.stringify(res).slice(0,200));
    await odoo('stock.picking','write',[[d.id],{carrier_tracking_ref:String(parcelNo)}]);
    let labelMsg='';
    if(res.labelBase64){ try{ await odoo('ir.attachment','create',[{name:'DPD-'+parcelNo+'.pdf',type:'binary',mimetype:'application/pdf',datas:res.labelBase64,res_model:'stock.picking',res_id:d.id}]); labelMsg=' Label attached.'; }catch(e){ labelMsg=' (label attach failed: '+e.message+')'; } }
    const body='DPD parcel booked (sent). Parcel no: '+String(parcelNo)+(trackingUrl?'. Tracking: '+trackingUrl:'');
    try{ await odoo('stock.picking','message_post',[[d.id]],{body,message_type:'comment',subtype_xmlid:'mail.mt_note'}); }catch(e){}
    d.carrier_tracking_ref=String(parcelNo);
    out.innerHTML='<div class="alert ok">✓ <b>Sent to DPD.</b> Parcel <b>'+esc(String(parcelNo))+'</b>.'+esc(labelMsg)+'</div>'
      +(trackingUrl?'<div class="kvline"><span>Tracking link</span><a class="link" href="'+esc(trackingUrl)+'" target="_blank">'+esc(trackingUrl)+'</a></div>':'')
      +'<div class="kvline"><span>Send to client</span><span class="mono">'+esc(String(parcelNo))+'</span></div>';
    renderDeliveries();
    alert_('✓ '+d.name+' → DPD parcel '+parcelNo+' (sent).','ok');
  }catch(e){ out.innerHTML='<div class="alert err">Booking failed: '+esc(e.message)+'</div>'; btns.forEach(b=>{ b.disabled=false; b.textContent='Book with DPD →'; }); }
}

/* ── defaults + sender (editable in Settings, stored on this device) ── */
function getDefaults(){ try{ return Object.assign({service:'Classic',predict:true,predictChannel:'email',weight:2,length:30,width:20,height:15}, JSON.parse(localStorage.getItem('dpd_defaults')||'{}')); }catch(e){ return {service:'Classic',predict:true,predictChannel:'email',weight:2,length:30,width:20,height:15}; } }
function getSender(){ try{ const v=JSON.parse(localStorage.getItem('dpd_sender')||'null'); return (v&&typeof v==='object')?v:null; }catch(e){ return null; } }

/* ── open a base64 PDF in a new tab (for printing) ── */
function openPdf(b64,name){
  try{
    const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    const url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));
    const w=window.open(url,'_blank');
    if(!w){ const a=document.createElement('a'); a.href=url; a.download=(name||'label')+'.pdf'; document.body.appendChild(a); a.click(); a.remove(); }
  }catch(e){ alert_('Could not open the PDF: '+esc(e.message),'err'); }
}

async function printLabel(id){
  const d=DELIVERIES.find(x=>cssId(x.name)===id); if(!d||!d.carrier_tracking_ref) return;
  const out=$('bk-out-'+id); if(out) out.innerHTML='<div class="info"><span class="spin"></span> Fetching label…</div>';
  try{
    const res=await dpd('/label',{parcelNumber:d.carrier_tracking_ref});
    if(!res.ok||!res.labelBase64) throw new Error(res.error||'No label available yet — try again shortly.');
    openPdf(res.labelBase64,'DPD-'+d.carrier_tracking_ref);
    if(out) out.innerHTML='<div class="alert ok">Label opened in a new tab — print it from there.</div>';
  }catch(e){ if(out) out.innerHTML='<div class="alert err">'+esc(e.message)+'</div>'; }
}

async function unbookDelivery(id){
  const d=DELIVERIES.find(x=>cssId(x.name)===id); if(!d)return;
  if(!confirm('Mark '+d.name+' as unbooked?\n\nThis clears the DPD reference in Odoo so it can be re-booked.\nIt does NOT cancel the parcel at DPD — cancel that in myDPD.')) return;
  const prev=d.carrier_tracking_ref;
  try{
    await odoo('stock.picking','write',[[d.id],{carrier_tracking_ref:false}]);
    try{ await odoo('stock.picking','message_post',[[d.id]],{body:'DPD booking unlinked in app (was '+prev+'). Cancel the parcel in myDPD if needed.',message_type:'comment',subtype_xmlid:'mail.mt_note'}); }catch(e){}
    d.carrier_tracking_ref=false; renderDeliveries(); alert_('✓ '+d.name+' marked unbooked.','ok');
  }catch(e){ alert_('Could not unbook: '+esc(e.message),'err'); }
}

async function returnLabel(id){
  const d=DELIVERIES.find(x=>cssId(x.name)===id); if(!d)return;
  if(!confirm('Create a RETURN parcel (customer → Ahooga) and open its label for '+d.name+'?')) return;
  const p=d.partner||{}; const cc=Array.isArray(p.country_id)?(_ccache[p.country_id[0]]||''):''; const defs=getDefaults();
  const out=$('bk-out-'+id); if(out) out.innerHTML='<div class="info"><span class="spin"></span> Creating return parcel…</div>';
  try{
    const payload={ reference:'RET-'+d.name, isReturn:true, autobook:true, service:defs.service,
      parcels:[{ weight:num(d.weight||0)||defs.weight, length:defs.length, width:defs.width, height:defs.height, content:('Return '+(soOf(d)||'')).slice(0,35) }],
      cargoDesc:('Return '+(soOf(d)||'')).slice(0,35),
      recipient:{ name:Array.isArray(d.partner_id)?d.partner_id[1]:'', street:p.street||'', zip:p.zip||'', city:p.city||'', countryCode:cc, phone:p.phone||'', mobile:p.mobile||'', email:p.email||'' } };
    const res=await dpd('/book',payload);
    if(!res.ok) throw new Error(res.error||'Return booking failed.');
    const parcelNo=res.parcelNumber||res.trackingNumber||res.bookingId;
    if(res.labelBase64) openPdf(res.labelBase64,'DPD-return-'+parcelNo);
    try{ await odoo('stock.picking','message_post',[[d.id]],{body:'DPD RETURN label created. Return parcel no: '+parcelNo,message_type:'comment',subtype_xmlid:'mail.mt_note'}); }catch(e){}
    if(out) out.innerHTML='<div class="alert ok">✓ Return parcel <b>'+esc(String(parcelNo))+'</b> created'+(res.labelBase64?' — label opened in a new tab.':' (label not ready yet — use Print label shortly).')+'</div>';
  }catch(e){ if(out) out.innerHTML='<div class="alert err">Return label: '+esc(e.message)+'</div>'; }
}

async function loadDpdStatus(d,id){
  const box=$('dpd-status-'+id); if(!box || !d.carrier_tracking_ref) return;
  box.innerHTML='<span class="spin"></span> checking DPD status…';
  try{
    const res=await dpd('/track',{parcelNumber:d.carrier_tracking_ref});
    if(res && res.ok){
      const ev=(res.events&&res.events[0])?res.events[0]:null;
      const when=ev&&ev.date?(' · '+esc(String(ev.date).replace('T',' ').slice(0,16))):'';
      const where=ev&&ev.location?(' ('+esc(ev.location)+')'):'';
      const st=res.status||(ev&&ev.description)||'no status yet';
      box.innerHTML='<b>DPD status:</b> '+esc(st)+where+when+(res.trackingUrl?' · <a class="link" href="'+esc(res.trackingUrl)+'" target="_blank">open tracking</a>':'');
    } else {
      box.innerHTML='<span class="muted">DPD has no tracking for this parcel yet — not scanned/picked up (or it was only a draft).</span>';
    }
  }catch(e){ box.innerHTML='<span class="muted">Could not reach DPD tracking right now.</span>'; }
}

async function doTrack(){
  const id=$('trk-id').value.trim(); const body=$('trk-body');
  if(!id){ body.innerHTML='<div class="empty">Enter a DPD parcel/tracking number.</div>'; return; }
  body.innerHTML='<div class="empty"><span class="spin"></span> Fetching parcel status…</div>';
  try{
    const res=await dpd('/track',{parcelNumber:id});
    if(!res.ok) throw new Error(res.error||'Tracking failed.');
    const status=res.status||'(unknown)'; const events=res.events||[];
    let html='<div class="row" style="padding:14px 16px"><div class="info"><b>Status:</b> '+esc(status)+'</div>';
    if(res.parcelNumber) html+='<div class="info muted">Parcel: '+esc(res.parcelNumber)+'</div>';
    if(res.trackingUrl) html+='<div class="kvline"><span>Tracking link</span><a class="link" href="'+esc(res.trackingUrl)+'" target="_blank">'+esc(res.trackingUrl)+'</a></div>';
    if(events.length){ html+='<table class="tbl"><thead><tr><th>When</th><th>Event</th><th>Location</th></tr></thead><tbody>'
      +events.map(e=>`<tr><td class="mono">${esc((e.date||'').replace('T',' ').slice(0,16))}</td><td>${esc(e.description||'')}</td><td>${esc(e.location||'')}</td></tr>`).join('')+'</tbody></table>'; }
    html+='</div>'; body.innerHTML=html;
  }catch(e){ body.innerHTML='<div class="alert err">'+esc(e.message)+'</div>'; }
}

function renderSettings(){
  $('settings-body').innerHTML=`
    <div class="box" style="max-width:760px"><h4>DPD worker</h4>
      <div class="info">The app talks to DPD through your <b>ahooga-dpd-proxy</b> Cloudflare Worker (holds the DPD keys as secrets).</div>
      <div class="minif" style="margin-top:10px"><div class="fld" style="flex:3"><label>DPD worker URL</label><input id="set-worker" value="${esc(DPD_WORKER)}"/></div>
        <button class="btn red sm" onclick="saveWorker()">Save &amp; test</button></div>
      <div class="cap">Default: ${esc(DPD_WORKER_DEFAULT)}</div></div>
    ${(function(){const f=getDefaults();return `
    <div class="box" style="max-width:760px;margin-top:12px"><h4>Booking defaults (sent with every booking)</h4>
      <div class="minif">
        <div class="fld" style="flex:2"><label>Service</label><input id="def-sv" value="${esc(f.service)}"/></div>
        <div class="fld"><label>Default weight kg</label><input id="def-wt" value="${esc(f.weight)}" inputmode="decimal"/></div>
        <div class="fld"><label>Length cm</label><input id="def-l" value="${esc(f.length)}" inputmode="numeric"/></div>
        <div class="fld"><label>Width cm</label><input id="def-w" value="${esc(f.width)}" inputmode="numeric"/></div>
        <div class="fld"><label>Height cm</label><input id="def-h" value="${esc(f.height)}" inputmode="numeric"/></div>
      </div>
      <div class="minif" style="margin-top:8px">
        <label class="chk"><input type="checkbox" id="def-pr" ${f.predict?'checked':''}/> Default Predict notification ON</label>
        <div class="fld"><label>Predict channel</label><select id="def-pc"><option value="email"${f.predictChannel==='email'?' selected':''}>email</option><option value="sms"${f.predictChannel==='sms'?' selected':''}>sms</option><option value="both"${f.predictChannel==='both'?' selected':''}>both</option></select></div>
        <button class="btn red sm" onclick="saveDefaults()">Save defaults</button>
      </div>
      <div class="cap">Service (e.g. Classic, Predict, Express), default parcel size/weight used when Odoo has none, and the DPD Predict notification preset.</div></div>`;})()}
    ${(function(){const k=getSender()||{};return `
    <div class="box" style="max-width:760px;margin-top:12px"><h4>Sender / pickup address (where DPD collects)</h4>
      <div class="minif">
        <div class="fld" style="flex:2"><label>Name</label><input id="sn-name" value="${esc(k.name||'')}"/></div>
        <div class="fld" style="flex:2"><label>Street</label><input id="sn-street" value="${esc(k.street||'')}"/></div>
        <div class="fld"><label>Zip</label><input id="sn-zip" value="${esc(k.zip||'')}"/></div>
        <div class="fld"><label>City</label><input id="sn-city" value="${esc(k.city||'')}"/></div>
        <div class="fld"><label>Country</label><input id="sn-cc" value="${esc(k.countryCode||'')}" placeholder="BE"/></div>
      </div>
      <div style="margin-top:8px;display:flex;gap:8px"><button class="btn red sm" onclick="saveSender()">Save sender</button><button class="btn ghost sm" onclick="clearSender()">Use DPD account default</button></div>
      <div class="cap">Leave empty to use the sender address registered on your DPD account. Set it here to override.</div></div>`;})()}
    <div class="box" style="max-width:760px;margin-top:12px"><h4>How it works</h4>
      <div class="info">1. <b>Transfers</b> read from Odoo (<span class="mono">stock.picking</span>) via the planner-proxy — defaults to outgoing (accessories &amp; spare parts).</div>
      <div class="info">2. Click a transfer to see its validated contents and exactly what gets sent to DPD.</div>
      <div class="info">3. <b>Book with DPD</b> → writes <span class="mono">carrier_tracking_ref</span>, attaches the label PDF, posts a chatter note. Then Print label, Create return label, or Mark unbooked.</div>
      <div class="cap">Leave “final booking” unchecked while testing — bookings land as drafts in myDPD.</div></div>`;
}
async function saveWorker(){
  const u=$('set-worker').value.trim().replace(/\/+$/,''); if(!u){ alert_('Enter a worker URL.','warn'); return; }
  DPD_WORKER=u; try{ localStorage.setItem('dpd_worker',u); }catch(e){}
  await dpdPing(); alert_('Saved DPD worker URL.','ok');
}
function saveDefaults(){
  const def={ service:($('def-sv').value||'Classic').trim(),
    predict:!!$('def-pr').checked, predictChannel:$('def-pc').value||'email',
    weight:num($('def-wt').value)||2, length:num($('def-l').value)||30, width:num($('def-w').value)||20, height:num($('def-h').value)||15 };
  try{ localStorage.setItem('dpd_defaults',JSON.stringify(def)); }catch(e){}
  alert_('Saved booking defaults.','ok');
}
function saveSender(){
  const k={ name:($('sn-name').value||'').trim(), street:($('sn-street').value||'').trim(), zip:($('sn-zip').value||'').trim(),
    city:($('sn-city').value||'').trim(), countryCode:($('sn-cc').value||'').trim().toUpperCase() };
  try{ localStorage.setItem('dpd_sender',JSON.stringify(k)); }catch(e){}
  alert_('Saved sender address.','ok');
}
function clearSender(){ try{ localStorage.removeItem('dpd_sender'); }catch(e){} renderSettings(); alert_('Sender reset to DPD account default.','ok'); }

function showTab(t){
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  $('view-'+t).classList.add('active'); $('nav-'+t).classList.add('active');
  if(t==='settings') renderSettings();
}

dpdPing();
try{ console.log('DPD Ship build 2026-06-18a loaded OK'); }catch(e){}
</script>
