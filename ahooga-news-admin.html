<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ahooga — Send a communication (internal)</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
 :root{--ink:#16160f;--dim:#6f6d63;--line:#e6e3da;--gold:#f2b705;--gold-d:#caa006;--bg2:#f5f4f1}
 *{box-sizing:border-box}body{margin:0;font-family:'Archivo',system-ui,sans-serif;color:var(--ink);background:#faf9f6}
 header{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line);background:#fff}
 header b{font-weight:900}.tag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
 .gate{max-width:360px;margin:12vh auto;text-align:center}
 .gate input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;margin:10px 0}
 .gate button{width:100%;padding:13px;border:0;border-radius:10px;background:var(--gold);font-weight:800;cursor:pointer;font-family:inherit}
 .wrap{max-width:1040px;margin:0 auto;padding:22px 20px;display:grid;grid-template-columns:1fr 1fr;gap:26px}
 @media(max-width:820px){.wrap{grid-template-columns:1fr}}
 h2{font-size:17px;font-weight:900;margin:0 0 12px}
 label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:700;margin:14px 0 5px}
 input,textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit}
 textarea{resize:vertical}
 input:focus,textarea:focus{outline:none;border-color:var(--gold)}
 .send{margin-top:18px;width:100%;padding:14px;border:0;border-radius:10px;background:var(--gold);font-weight:800;font-size:15px;cursor:pointer;font-family:inherit}
 .send:hover{background:var(--gold-d)}.send:disabled{opacity:.6}
 .smsg{font-size:13px;margin-top:10px;min-height:18px}
 /* preview */
 .pv{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff;position:sticky;top:20px}
 .pvhero{background:var(--bg2);min-height:60px}.pvhero img{width:100%;display:block;max-height:260px;object-fit:cover}
 .pvb{padding:20px 22px}
 .pvb h3{font-size:24px;font-weight:900;letter-spacing:-.02em;margin:0 0 4px;line-height:1.05}
 .pvb .intro{font-size:15px;font-weight:600;margin:8px 0}
 .pvb .body{font-size:14px;line-height:1.6;white-space:pre-wrap;color:#2b2b2b}
 .pvb .cta{display:inline-block;margin-top:16px;background:var(--gold);color:#16160f;font-weight:800;font-size:14px;padding:11px 20px;border-radius:10px}
 .sent{margin-top:24px}.sent h2{font-size:14px}
 .srow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
 .srow .dl{color:#b3261e;cursor:pointer;font-weight:700;font-size:12px}
 .muted{color:var(--dim);font-size:12px}
</style></head>
<body>
<div id="gate" class="gate">
 <h2>Send a communication</h2>
 <p class="muted">Internal — enter the admin password.</p>
 <input id="pw" type="password" placeholder="Admin password" onkeydown="if(event.key==='Enter')enter()">
 <button onclick="enter()">Open</button>
 <div id="gmsg" class="muted" style="color:#b3261e;margin-top:8px"></div>
</div>
<div id="app" style="display:none">
 <header><button onclick="goBack()" style="border:1px solid var(--line);background:#fff;border-radius:16px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--dim);cursor:pointer;font-family:inherit">← Back</button><b>Ahooga</b><span class="tag">Send to all dealers</span><span style="flex:1"></span><button onclick="adminLock()" style="border:1px solid var(--line);background:#fff;border-radius:16px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--dim);cursor:pointer;font-family:inherit">🔒 Lock</button></header>
 <div class="wrap">
  <div>
   <h2>Compose</h2>
   <label>Title</label><input id="title" oninput="pv()" placeholder="e.g. New 2026 colours just landed">
   <label>Image URL (optional)</label><input id="image" oninput="pv()" placeholder="https://…  (paste a media/CDN image link)">
   <label>Intro (optional, one line)</label><input id="intro" oninput="pv()" placeholder="A short teaser line">
   <label>Message</label><textarea id="body" rows="9" oninput="pv()" placeholder="Write your communication…"></textarea>
   <label>Button label (optional)</label><input id="ctaLabel" oninput="pv()" placeholder="e.g. See the colours">
   <label>Button link (optional)</label><input id="ctaUrl" oninput="pv()" placeholder="https://…">
   <label>Attachments (optional) — PDF, images, etc.</label>
   <input type="file" id="files" multiple onchange="pickFiles(this)" style="font-size:13px">
   <div id="attList" style="margin-top:8px;display:flex;flex-direction:column;gap:6px"></div>
   <button class="send" id="sendBtn" onclick="send()">Send to all dealers</button>
   <div class="smsg" id="smsg"></div>
   <div class="sent"><h2>Sent communications</h2><div id="sentList"></div></div>
  </div>
  <div>
   <h2>Preview</h2>
   <div class="pv"><div class="pvhero" id="pvhero"></div><div class="pvb"><h3 id="pvt">Title</h3><div class="intro" id="pvi"></div><div class="body" id="pvbody"></div><span id="pvcta"></span></div></div>
  </div>
 </div>
</div>
<script>
const CF="https://ahooga-odoo-proxy.ahoogahouse-1050-be.workers.dev";
let pw="";
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function val(id){return document.getElementById(id).value;}
async function api(path,extra){const r=await fetch(CF+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.assign({adminPw:pw},extra||{}))});return r.json();}
function goBack(){try{if(window.parent&&window.parent!==window&&window.parent.closeApp){window.parent.closeApp();return;}}catch(e){}if(history.length>1){history.back();}else{location.href='index.html';}}
function adminSavePw(){try{localStorage.setItem('ahg_admin_pw',pw);}catch(e){}}
function adminClearPw(){try{localStorage.removeItem('ahg_admin_pw');}catch(e){}}
function adminLock(){adminClearPw();location.reload();}
window.addEventListener('DOMContentLoaded',function(){try{var _sp=localStorage.getItem('ahg_admin_pw');if(_sp){var _i=document.getElementById('pw');if(_i){_i.value=_sp;enter(true);}}}catch(e){}});
async function enter(silent){pw=val("pw");const d=await api("/news/admin/list");if(d.error){if(!silent)document.getElementById("gmsg").textContent=d.error;adminClearPw();return;}adminSavePw();document.getElementById("gate").style.display="none";document.getElementById("app").style.display="block";pv();renderSent(d.messages||[]);}
function pv(){
 document.getElementById("pvt").textContent=val("title")||"Title";
 var im=val("image");document.getElementById("pvhero").innerHTML=im?'<img src="'+esc(im)+'" alt="">':'';
 document.getElementById("pvi").textContent=val("intro");
 document.getElementById("pvbody").textContent=val("body");
 var cl=val("ctaLabel"),cu=val("ctaUrl");document.getElementById("pvcta").innerHTML=(cl&&cu)?'<a class="cta">'+esc(cl)+'</a>':'';
}
function renderSent(list){document.getElementById("sentList").innerHTML=(list||[]).map(m=>'<div class="srow"><span>'+esc(m.title)+(m.att?' <span class="muted">📎'+m.att+'</span>':'')+' <span class="muted">· '+new Date(m.ts).toLocaleDateString()+'</span></span><span class="dl" onclick="del(\''+m.id+'\')">Delete</span></div>').join("")||'<div class="muted" style="padding:10px 0">Nothing sent yet.</div>';}
let attachments=[];
function fmtSize(b){if(b<1024)return b+' B';if(b<1048576)return Math.round(b/1024)+' KB';return (b/1048576).toFixed(1)+' MB';}
function renderAtts(){document.getElementById("attList").innerHTML=attachments.map((a,i)=>'<div style="display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px"><span>📎</span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(a.name)+'</span><span class="muted">'+fmtSize(a.bytes)+'</span><span class="dl" style="cursor:pointer" onclick="removeAtt('+i+')">Remove</span></div>').join("");}
function removeAtt(i){attachments.splice(i,1);renderAtts();}
function pickFiles(input){const files=Array.from(input.files||[]);input.value="";files.forEach(f=>{if(f.size>5*1024*1024){const sm=document.getElementById("smsg");sm.style.color="#b3261e";sm.textContent='"'+f.name+'" is larger than 5 MB and was skipped.';return;}const rd=new FileReader();rd.onload=function(){attachments.push({name:f.name,type:f.type||"",bytes:f.size,data:rd.result});renderAtts();};rd.readAsDataURL(f);});}
async function send(){
 const t=val("title").trim();const sm=document.getElementById("smsg");if(!t){sm.style.color="#b3261e";sm.textContent="A title is required.";return;}
 const btn=document.getElementById("sendBtn");btn.disabled=true;sm.style.color="var(--dim)";sm.textContent=attachments.length?"Uploading & sending…":"Sending…";
 const d=await api("/news/admin/send",{title:t,intro:val("intro"),body:val("body"),image:val("image"),ctaLabel:val("ctaLabel"),ctaUrl:val("ctaUrl"),attachments:attachments.map(a=>({name:a.name,type:a.type,data:a.data}))});
 btn.disabled=false;
 if(d.error){sm.style.color="#b3261e";sm.textContent=d.error;return;}
 sm.style.color="#2d6e2d";sm.textContent="✓ Sent. "+((d.languages&&d.languages>0)?("Auto-translated into "+d.languages+" language(s). "):"")+((d.emailed&&d.emailed>0)?("Emailed "+d.emailed+" portal users. "):"")+(d.emailNote||"It is now in every dealer's Inbox.");
 ["title","image","intro","body","ctaLabel","ctaUrl"].forEach(id=>document.getElementById(id).value="");attachments=[];renderAtts();pv();
 const l=await api("/news/admin/list");renderSent(l.messages||[]);
}
async function del(id){if(!confirm("Delete this communication?"))return;await api("/news/admin/delete",{id});const l=await api("/news/admin/list");renderSent(l.messages||[]);}
</script>
</body></html>
