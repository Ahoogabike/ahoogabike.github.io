<style>
 :root{--bg:#fff;--bg2:#f5f4f1;--ink:#16160f;--dim:#6f6d63;--line:#e6e3da;--gold:#f2b705;--gold-d:#caa006}
 *{box-sizing:border-box}html,body{margin:0;height:100%}
 body{background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,Segoe UI,sans-serif}
 a{color:inherit;text-decoration:none}
 header{display:flex;align-items:center;gap:16px;padding:14px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(255,255,255,.93);backdrop-filter:blur(8px);z-index:20}
 .brand img{height:22px;display:block}
 .back{font-size:13px;color:var(--dim);border:1px solid var(--line);border-radius:18px;padding:6px 12px}
 .back:hover{border-color:var(--gold);color:var(--ink)}
 .htag{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
 .spacer{flex:1}
 .who{display:flex;align-items:center;gap:12px;font-weight:600;font-size:13px;white-space:nowrap}
 select{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:6px 10px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
 .logout{color:var(--dim);font-size:13px;cursor:pointer}.logout:hover{color:var(--ink)}
 .wrap{max-width:1180px;margin:0 auto;padding:24px;display:grid;grid-template-columns:1fr 320px;gap:24px}
 @media(max-width:840px){.wrap{grid-template-columns:1fr}}
 h1{font-size:26px;font-weight:900;letter-spacing:-.02em;margin:0 0 4px}
 .sub{color:var(--dim);font-size:14px;margin:0 0 16px}
 .search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;margin-bottom:18px}
 .search:focus{outline:none;border-color:var(--gold)}
 .bikes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
 .bike{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
 .bimg{aspect-ratio:4/3;background:var(--bg2);display:flex;align-items:center;justify-content:center;overflow:hidden}
 .bimg img{width:100%;height:100%;object-fit:contain}
 .bimg .ph{color:#cfccc2;font-size:11px}
 .binfo{padding:12px 13px;display:flex;flex-direction:column;gap:8px;flex:1}
 .bname{font-weight:700;font-size:13.5px;line-height:1.3}
 .bcode{font-size:11px;color:var(--dim);font-family:'Space Mono',monospace}
 .bprice{font-size:14px;font-weight:800;color:#16160f}
 .ptoggle{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:16px}
 .ptoggle button{border:0;background:#fff;color:var(--dim);font-weight:700;font-size:12.5px;padding:8px 16px;cursor:pointer;font-family:inherit}
 .ptoggle button.on{background:var(--gold);color:#16160f}
 .ptoggle button+button{border-left:1px solid var(--line)}
 .filterbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
 .fseg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
 .fseg button{border:0;background:#fff;color:var(--dim);font-weight:700;font-size:12.5px;padding:7px 13px;cursor:pointer;font-family:inherit}
 .fseg button.on{background:#16160f;color:#fff}
 .fseg button+button{border-left:1px solid var(--line)}
 #cart-tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
 .ctab{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:8px;padding:4px 5px 4px 9px;font-size:12px;cursor:pointer;background:#fff;max-width:100%}
 .ctab.on{border-color:#16160f;background:#fbf7ea}
 .ctab .cn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
 .ctab .cc{background:#f2b705;color:#16160f;border-radius:6px;padding:0 5px;font-weight:700;font-size:10px}
 .ctab .cren,.ctab .cdel{border:0;background:none;cursor:pointer;color:#9a9384;font-size:11px;padding:0 1px;line-height:1}
 .ctab .cren:hover,.ctab .cdel:hover{color:#16160f}
 .cnew{border:1px dashed var(--line);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;background:none;color:#16160f;font-family:inherit;font-weight:700}
 .cu-lab{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#6f6d63;margin:16px 0 8px;font-weight:600}
 .sw-grid{display:flex;flex-wrap:wrap;gap:9px}
 .sw{width:30px;height:30px;border-radius:50%;border:2px solid #e6e3da;cursor:pointer;padding:0}
 .sw.on{border-color:#16160f;box-shadow:0 0 0 2px #fff,0 0 0 4px #f2b705}
 .sw-name{font-size:12.5px;color:#16160f;font-weight:700;margin-top:7px;min-height:16px}
 .cu-pills{display:inline-flex;border:1px solid #e6e3da;border-radius:9px;overflow:hidden}
 .cu-pill{border:0;background:#fff;color:#6f6d63;font-weight:700;font-size:13px;padding:8px 16px;cursor:pointer;font-family:inherit}
 .cu-pill.on{background:#16160f;color:#fff}
 .cu-pill+.cu-pill{border-left:1px solid #e6e3da}
 .stk{font-size:12px;font-weight:700}.stk.in{color:#2d6e2d}.stk.soon{color:#9a6a00}.stk.out{color:#b3261e}
 .badd{margin-top:auto;display:flex;align-items:center;gap:8px}
 .stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
 .stepper button{border:0;background:#fff;width:28px;height:30px;cursor:pointer;font-size:16px;color:var(--ink)}
 .stepper span{width:30px;text-align:center;font-weight:700;font-size:13px}
 .addb{flex:1;border:0;border-radius:8px;background:var(--gold);color:#16160f;font-weight:800;font-size:13px;padding:7px;cursor:pointer;font-family:inherit}
 .addb:hover{background:var(--gold-d)}
 .panel{align-self:start;position:sticky;top:80px;border:1px solid var(--line);border-radius:16px;padding:18px;background:#fff}
 .panel h3{margin:0 0 4px;font-size:16px}.panel .note{color:var(--dim);font-size:12px;margin:0 0 12px;line-height:1.5}
 .cart .row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
 .cart .row b{font-weight:700}.cart .row .q{color:var(--dim)}
 .cart .rm{border:0;background:none;color:var(--dim);cursor:pointer;font-size:15px}
 .empty{color:var(--dim);font-size:13px}
 .submit{margin-top:14px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--gold);color:#16160f;font-weight:800;font-size:14px;cursor:pointer}
 .submit:hover{background:var(--gold-d)}.submit:disabled{opacity:.5;cursor:default}
 #omsg{margin-top:10px;font-size:13px;line-height:1.5;min-height:18px}
 .state{padding:40px 0;color:var(--dim);text-align:center}
 /* login */
 #login{position:fixed;inset:0;z-index:100;background:var(--bg2);display:flex;align-items:center;justify-content:center;padding:18px}
 .lbox{width:min(410px,94vw);background:#fff;border:1px solid var(--line);border-radius:20px;padding:34px;box-shadow:0 20px 60px rgba(20,20,10,.10)}

 input.f{width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid var(--line);border-radius:10px;color:var(--ink);font-size:14px;font-family:inherit}

</style></head>

<script>
/* /store/ key (Nov 2026): once the proxy's STORE_KEY secret is set, every save (and every read of a private key)
   needs the header X-Store-Key. The key is kept only in this browser (localStorage 'ahooga_store_key') and is
   asked once, the first time the server answers 401. Never write the key itself into this file. */
async function storeFetch(url,opts){
  opts=opts||{};
  var getK=function(){var k='';try{k=localStorage.getItem('ahooga_store_key')||'';}catch(e){}return k||storeFetch._k||'';};
  var send=function(k){var h=Object.assign({},opts.headers||{});if(k)h['X-Store-Key']=k;return fetch(url,Object.assign({},opts,{headers:h}));};
  var k=getK(),r=await send(k);
  /* Nov 17 fix: before, the typed key was saved even when the server refused it, so one typo meant the
     prompt came back on every visit. Now a refused saved key is wiped, and a typed key is saved only
     after the server accepts it (2 tries, then give up for this page load). */
  if(r.status===401||r.status===403){
    var n=getK();
    if(n&&n!==k)return send(n);                    // another call already got a working key
    if(storeFetch._asked)return r;
    storeFetch._asked=true;
    if(k){storeFetch._k='';try{localStorage.removeItem('ahooga_store_key');}catch(e){}}
    var msg=k?'The saved Ahooga store key was refused (wrong or changed). Please enter the current key:'
             :'This tool needs the Ahooga store key to load and save shared data (asked once on this computer):';
    for(var t=0;t<2;t++){
      n=String(window.prompt(msg)||'').trim();
      if(!n)break;
      var r2=await send(n);
      if(r2.status!==401&&r2.status!==403){storeFetch._k=n;try{localStorage.setItem('ahooga_store_key',n);}catch(e){}return r2;}
      msg='That key was not accepted. Check it and try again:';
    }
  }
  return r;
}
</script>

function detectColor(n){var l=n.toLowerCase();if(l.includes('yellow')||l.includes('bumblebee'))return'yellow';if(l.includes('black')||l.includes('cosmic'))return'black';if(l.includes('red')||l.includes('ruby'))return'red';return'custom';}
function detectTransmission(n){var l=n.toLowerCase();if(l.includes('alfine')||l.includes('alf'))return'alfine';if(l.includes('derailleur')||l.includes('der'))return'derailleur';if(l.includes('nexus')||l.includes('nex'))return'nexus';return'unknown';}
function detectBikeType(n){var l=n.toLowerCase();if(l.includes('e-max')||l.includes('emax'))return'emax';if(l.includes('a-max')||l.includes('amax'))return'amax';if(l.includes('modular')||l.includes('ahmun'))return'modular';if(l.includes('folding')||l.includes('ahfan')||l.includes('analog'))return'folding';return'other';}
function detectRack(n){var l=n.toLowerCase();return(l.includes('rack')&&!l.includes('no rack'))?'rack':'no rack';}
function stockKey(name){return [detectBikeType(name),detectTransmission(name),detectColor(name),detectRack(name)].join('|');}
var freeIdx={},etaIdx={};
async function loadStockMirror(){
 freeIdx={};etaIdx={};
 // primary: the planner's published production basis (same free-stock + incoming-PO dates)
 try{var r=await storeFetch(CF_WORKER_URL+"/store/production_basis");var pb=await r.json();
  if(pb&&pb.freeStockBySku)freeIdx=pb.freeStockBySku;
  if(pb&&pb.incomingEtaBySku)etaIdx=pb.incomingEtaBySku;}catch(e){}
 // fallback: stock mirror, if the planner hasn't published a basis yet
 if(!Object.keys(freeIdx).length&&!Object.keys(etaIdx).length){
  try{var r2=await storeFetch(CF_WORKER_URL+"/store/shared_stock_mirror");var d=await r2.json();
   (d&&d.stock||[]).forEach(function(s){var key=[s.bikeType,s.transmission,s.color,s.rack].join('|');if(!s.reserved&&!s.inTransit)freeIdx[key]=(freeIdx[key]||0)+1;else if(s.inTransit&&!s.reserved&&s.expectedArrival){if(!etaIdx[key]||s.expectedArrival<etaIdx[key])etaIdx[key]=s.expectedArrival;}});}catch(e){}
 }
}

function syncCart(){

}

function normLang(c){c=String(c||"").slice(0,2).toLowerCase();return I18N[c]?c:"en";}
function t(k,v){var s=(I18N[curLang]&&I18N[curLang][k])||I18N.en[k]||k;if(v)for(var x in v)s=s.replace("{"+x+"}",v[x]);return s;}
function applyI(){
 document.documentElement.lang=curLang;
 document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));
 document.querySelectorAll("[data-iph]").forEach(e=>e.placeholder=t(e.dataset.iph));
 var opts=Object.keys(LANG_NAMES).map(c=>'<option value="'+c+'"'+(c===curLang?' selected':'')+'>'+LANG_NAMES[c]+'</option>').join('');
 var a=document.getElementById("langsel"),b=document.getElementById("loginlang");if(a)a.innerHTML=opts;if(b)b.innerHTML=opts;
 var sb=document.getElementById("submit");if(sb)sb.textContent=t("submit");
 renderCart();
}
function langSet(c){curLang=normLang(c);try{localStorage.setItem("ahg_lang",c);}catch(e){}applyI();render();}
async function rpc(model,method,args,kwargs){
 var r=await fetch(CF_WORKER_URL+"/dealer/rpc",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:token,model:model,method:method,args:args||[],kwargs:kwargs||{}})});
 var d=await r.json(); if(d.error){if(r.status===401){logout();} throw new Error(d.error);} return d.result;
}
async function loadBikes(){
 var st=document.getElementById("state");st.textContent=t("loading");document.getElementById("bikes").innerHTML="";
 try{
  var cats=await rpc("product.category","search_read",[[["complete_name","ilike","MAX"],["complete_name","not ilike","accessor"],["complete_name","not ilike","MOD"]]],{fields:["id","complete_name"]});
  var ids=cats.map(c=>c.id);
  console.log("MAX bike categories used:",cats.map(c=>c.complete_name));
  if(!ids.length){st.textContent=t("none");return;}
  var prods=await rpc("product.product","search_read",[[["sale_ok","=",true],["categ_id","in",ids]]],{fields:["id","display_name","default_code","image_512","product_tmpl_id","list_price"],limit:300});
  bikes=prods.sort((a,b)=>String(a.display_name).localeCompare(b.display_name));
  bikes.forEach(function(b){if(b.list_price!=null)listMap[b.id]=b.list_price;});
  await loadStockMirror();
  st.textContent=bikes.length?"":t("none");render();
  loadPrices(bikes.map(function(b){return b.id;})).then(function(){render();var s=document.getElementById("state");if(s)s.textContent="";var pd=document.getElementById("pricediag");if(pd){pd.textContent=pricesInfo;pd.style.color=(pricesStatus==="ok"&&pricesInfo.indexOf("⚠")<0)?"#2d6e2d":"#9a6a00";}});
 }catch(e){st.textContent="⚠ "+(e&&e.message||e);}
}

 document.getElementById("tab-acc").classList.toggle("on",m==="acc");
 var bf=document.getElementById("bikefilters");if(bf)bf.style.display=(m==="bikes")?"":"none";
 if(m==="acc"&&!accLoaded){accLoaded=true;loadAccessories();}
 render();
}
async function loadAccessories(){
 var st=document.getElementById("state");st.textContent=t("loading");
 try{
  await loadAccOrder();
  var prods=await rpc("product.product","search_read",[[["default_code","in",ACC_CODES]]],{fields:["id","display_name","default_code","image_variant_512","image_512","product_tmpl_id","list_price"]});
  prods.forEach(function(b){if(b.image_variant_512)b.image_512=b.image_variant_512;});
  var ord=(accOrder&&accOrder.length)?accOrder:ACC_CODES;
  prods.sort(function(a,b){var ia=ord.indexOf(a.default_code),ib=ord.indexOf(b.default_code);if(ia<0)ia=999;if(ib<0)ib=999;return ia-ib;});
  accessories=prods;
  accessories.forEach(function(b){if(b.list_price!=null)listMap[b.id]=b.list_price;});

var accCache={},accById={};
async function suggestAccessories(bikeId){
 var b=bikes.find(x=>x.id===bikeId); if(!b||!b.product_tmpl_id)return;
 var tid=Array.isArray(b.product_tmpl_id)?b.product_tmpl_id[0]:b.product_tmpl_id;
 try{
  var accProds=accCache[tid];
  if(!accProds){
   var tm=await rpc('product.template','read',[[tid]],{fields:['accessory_product_ids','optional_product_ids']});
   var accVar=(tm&&tm[0]&&tm[0].accessory_product_ids)||[];  // these are product.product (variant) ids
   var optTpl=(tm&&tm[0]&&tm[0].optional_product_ids)||[];   // these are product.template ids
   accProds=[];
   if(accVar.length){var p1=await rpc('product.product','read',[accVar],{fields:['id','display_name','default_code','image_128','list_price']});accProds=accProds.concat(p1||[]);}
   if(optTpl.length){var p2=await rpc('product.product','search_read',[[['product_tmpl_id','in',optTpl],['sale_ok','=',true]]],{fields:['id','display_name','default_code','image_128','list_price']});accProds=accProds.concat(p2||[]);}
   var seen={};accProds=accProds.filter(function(p){if(seen[p.id])return false;seen[p.id]=1;return true;});
   accProds.forEach(function(p){if(p.list_price!=null)listMap[p.id]=p.list_price;});
   accCache[tid]=accProds;
  }
  if(!accProds.length)return;
  await loadPrices(accProds.map(function(p){return p.id;}));
  openAccModal(accProds);
 }catch(e){/* accessories are optional — fail quietly */}
}

   '<select id="co-addr" style="width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #e6e3da;border-radius:9px;font-family:inherit;font-size:14px;background:#fff"></select>'+
   '<div style="margin:18px 0 0;padding:14px;background:#f5f4f1;border-radius:10px">'+
     '<div style="font-size:13px"><b id="co-l-pay"></b>: <span id="co-payterm"></span></div>'+
     '<label style="display:flex;gap:10px;align-items:flex-start;margin-top:10px;font-size:13px;cursor:pointer"><input type="checkbox" id="co-agree" style="margin-top:3px"><span id="co-agree-l"></span></label>'+
   '</div>'+
   '<div id="co-ship-warn" style="display:none;margin-top:14px;font-size:12.5px;color:#9a6a00;background:#fff7e0;border:1px solid #f3e3a8;border-radius:10px;padding:10px 12px"></div>'+
   '<div id="co-warn" style="margin-top:14px;font-size:12.5px;color:#9a6a00;background:#fff7e0;border:1px solid #f3e3a8;border-radius:10px;padding:10px 12px"></div>'+
   '<div id="co-notice" style="margin-top:8px;font-size:11.5px;color:#9a9384;line-height:1.5"></div>'+
   '<div id="co-msg" style="margin-top:12px;font-size:13px;min-height:18px"></div>'+
   '<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap">'+
     '<button id="co-cancel" style="padding:11px 16px;border:1px solid #e6e3da;background:#fff;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit"></button>'+
     '<button id="co-draft" style="padding:11px 16px;border:1px solid #e6e3da;background:#fff;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit"></button>'+
     '<button id="co-confirm" disabled style="padding:11px 18px;border:0;background:#f2b705;color:#16160f;border-radius:10px;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit;opacity:.5"></button>'+
   '</div></div>';
  document.body.appendChild(ov);
  ov.addEventListener('click',function(e){if(e.target===ov)ov.style.display='none';});
  document.getElementById('co-cancel').onclick=function(){ov.style.display='none';};
  document.getElementById('co-agree').onchange=function(){syncConfirm();};
  document.getElementById('co-addr').onchange=function(){loadShipping();};
  document.getElementById('co-confirm').onclick=function(){doPlaceOrder(true);};
  document.getElementById('co-draft').onclick=function(){doPlaceOrder(false);};
 }
 // labels
 document.getElementById('co-title').textContent=t("checkout_title");
 document.getElementById('co-l-date').textContent=t("delivery_date");
 document.getElementById('co-l-ref').textContent=t("your_ref");
 document.getElementById('co-l-addr').textContent=t("delivery_addr");
 document.getElementById('co-l-pay').textContent=t("pay_terms");
 document.getElementById('co-agree-l').textContent=t("agree");
 document.getElementById('co-warn').textContent=t("firm_warn");
 document.getElementById('co-ship-warn').textContent=t("ship_warn");
 document.getElementById('co-notice').textContent=t("price_notice");
 document.getElementById('co-cancel').textContent=t("cancel");
 document.getElementById('co-draft').textContent=t("save_draft");
 document.getElementById('co-confirm').textContent=t("confirm_btn");
 document.getElementById('co-payterm').textContent=(account&&account.paymentTerm)||"—";
 // addresses
 var sel=document.getElementById('co-addr');sel.innerHTML=((account&&account.addresses)||[]).map(function(a){return '<option value="'+a.id+'">'+esc(a.label)+'</option>';}).join('');
 // lines summary (items only; shipping + total filled by loadShipping)
 var total=0;var rows=items.map(function(i){var pr=priceOf(i.id);var line=(pr!=null)?pr*i.qty:null;if(line!=null)total+=line;return '<div style="display:flex;justify-content:space-between;padding:8px 12px;border-bottom:1px solid #eee">'+'<span>'+esc(i.name)+' <span style="color:#6f6d63">×'+i.qty+'</span></span><span style="font-weight:700">'+(line!=null?fmtEur(line):'')+'</span></div>';}).join("");
 if(total>0)rows+='<div style="display:flex;justify-content:space-between;padding:8px 12px"><span style="color:#6f6d63">'+t("subtotal")+'</span><span style="font-weight:700">'+fmtEur(total)+'</span></div>';
 document.getElementById('co-lines').innerHTML=rows;
 coItems=items;coSubtotal=total;shipCost=null;
 document.getElementById('co-extra').innerHTML='';
 document.getElementById('co-ship-warn').style.display='none';
 var rf=document.getElementById('co-ref');if(rf&&!rf.value&&carts[activeId]&&carts[activeId].name)rf.value=carts[activeId].name;
 document.getElementById('co-msg').textContent="";document.getElementById('co-agree').checked=false;var cb=document.getElementById('co-confirm');cb.disabled=true;cb.style.opacity='.5';
 ov.style.display='flex';
 loadShipping();
}
var coItems=[],coSubtotal=0,shipCost=null;
function syncConfirm(){var cb=document.getElementById('co-confirm'),agree=document.getElementById('co-agree');if(!cb||!agree)return;var ok=agree.checked;cb.disabled=!ok;cb.style.opacity=ok?'1':'.5';}
function loadShipping(){
 var ex=document.getElementById('co-extra');if(ex)ex.innerHTML='<div style="padding:10px 12px;color:#6f6d63">'+t("ship_calc")+'</div>';
 shipCost=null;syncConfirm();
 var addr=(document.getElementById('co-addr')||{}).value||"";
 var lines=coItems.map(function(i){return {id:i.id,qty:i.qty};});
 fetch(CF_WORKER_URL+"/dealer/shipping",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:token,lines:lines,amount:coSubtotal,shippingId:addr})})
  .then(function(r){if(r.status===401){logout();return null;}return r.json();})
  .then(function(d){if(d)renderShip(d);}).catch(function(){renderShip({cost:null});});
}
function renderShip(d){
 var ex=document.getElementById('co-extra');if(!ex)return;
 var warn=document.getElementById('co-ship-warn');var html='';
 if(d&&d.cost!=null){
  shipCost=d.cost;
  var lab=d.free?t("ship_free"):(t("shipping")+(d.carrier?(' — '+esc(d.carrier)):''));
  html+='<div style="display:flex;justify-content:space-between;padding:8px 12px;border-bottom:1px solid #eee"><span>'+lab+'</span><span style="font-weight:700">'+fmtEur(d.cost)+'</span></div>';
  if(coSubtotal>0)html+='<div style="display:flex;justify-content:space-between;padding:10px 12px;font-weight:800"><span>'+t("total")+'</span><span>'+fmtEur(coSubtotal+d.cost)+'</span></div>';
  if(warn)warn.style.display='none';
 } else {
  shipCost=null;
  html+='<div style="display:flex;justify-content:space-between;padding:10px 12px"><span style="color:#9a6a00">'+t("ship_none")+'</span><span></span></div>';
  if(warn)warn.style.display='none';
 }
 ex.innerHTML=html;syncConfirm();
}
function doPlaceOrder(confirm){
 var items=Object.values(cart);if(!items.length)return;
 var msg=document.getElementById('co-msg'),cb=document.getElementById('co-confirm'),db=document.getElementById('co-draft');
 cb.disabled=true;db.disabled=true;cb.textContent=t("confirming");msg.style.color="#6f6d63";msg.textContent="";
 var lines=[];items.forEach(function(i){lines.push({id:i.id,qty:i.qty,desc:i.desc||""});if(i.devText&&DEV_TEXT_CODE)lines.push({code:DEV_TEXT_CODE,qty:i.qty,desc:t("custom_text")+': "'+i.devText+'"'});});
 var payload={token:token,orderId:(carts[activeId]&&carts[activeId].oid)||null,lines:lines,ref:document.getElementById('co-ref').value||"",deliveryDate:document.getElementById('co-date').value||"",shippingId:document.getElementById('co-addr').value||"",confirm:!!confirm};
 fetch(CF_WORKER_URL+"/dealer/order",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)})
 .then(function(r){if(r.status===401){logout();return;}return r.json().then(function(d){
   if(d&&d.ok){
     var label=(confirm&&d.confirmed)?("✓ "+t("confirmed")+" — "+d.name):("✓ "+t("ok",{n:d.name})+" "+t("will"));
     if(confirm&&!d.confirmed&&d.confirmError)label="⚠ "+d.name+" — "+(d.confirmError==='SHIPPING_UNRESOLVED'?t("ship_warn"):d.confirmError);
     if(d.shipping){if(d.shipping.cost!=null)label+=' · '+t("shipping")+': '+fmtEur(d.shipping.cost)+(d.shipping.carrier?(' ('+esc(d.shipping.carrier)+')'):'');else label+=' · '+t("ship_none")+((d.shipping.error||d.shipping.reason)?(' ['+esc(d.shipping.error||d.shipping.reason)+']'):'');}
     msg.style.color="#2d6e2d";msg.innerHTML="<b>"+label+"</b>";
     for(var _k in cart)delete cart[_k];if(carts[activeId]){carts[activeId].oid=null;carts[activeId].oname="";carts[activeId]._sig="";}saveCart();renderCart();
     setTimeout(function(){var ov=document.getElementById('co-ov');if(ov)ov.style.display='none';},2200);
   } else {cb.disabled=false;db.disabled=false;cb.textContent=t("confirm_btn");msg.style.color="#b3261e";msg.textContent=(d&&d.error)||t("failed");}
 });}).catch(function(e){cb.disabled=false;db.disabled=false;cb.textContent=t("confirm_btn");msg.style.color="#b3261e";msg.textContent=String(e&&e.message||e);});
}
function showName(){var el=document.getElementById("who-name");if(el)el.textContent=dealerName;}
function loadSession(){try{var s=JSON.parse(localStorage.getItem("ahg_dealer")||"null");if(s&&s.t&&s.exp>Date.now()){token=s.t;dealerName=s.n||"";if(s.l)curLang=normLang(s.l);return true;}}catch(e){}return false;}
function logout(){try{localStorage.removeItem("ahg_dealer");localStorage.removeItem("ahg_bikecart");}catch(e){}location.reload();}
function showApp(){document.getElementById("login").style.display="none";document.getElementById("app").style.display="block";showName();applyI();loadBikes();}
async function doLogin(){
 var msg=document.getElementById("msg"),go=document.getElementById("go");
 var email=(document.getElementById("email").value||"").trim(),pass=document.getElementById("pass").value||"";
 if(!email||!pass){msg.textContent=t("enter_creds");return;}
 go.disabled=true;go.textContent=t("verifying");msg.style.color="#6f6d63";msg.textContent=t("verifying");
 try{
  var r=await fetch(CF_WORKER_URL+"/dealer/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:email,password:pass})});
  var d=await r.json();
  if(d.token){var m=null;try{m=localStorage.getItem("ahg_lang");}catch(e){}if(!m&&d.lang)curLang=normLang(d.lang);token=d.token;dealerName=d.name||"";
   try{localStorage.setItem("ahg_dealer",JSON.stringify({t:d.token,n:d.name,l:curLang,exp:Date.now()+12*3600*1000}));}catch(e){}showApp();}
  else{msg.style.color="#b3261e";msg.textContent=d.error||t("failed");go.disabled=false;go.textContent=t("login_btn");}
 }catch(e){msg.style.color="#b3261e";msg.textContent=t("failed")+": "+(e&&e.message||e);go.disabled=false;go.textContent=t("login_btn");}
}
(function(){try{var sl=localStorage.getItem("ahg_lang");if(sl)curLang=normLang(sl);}catch(e){}
 document.getElementById("go").onclick=doLogin;document.getElementById("pass").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin();});
 document.querySelectorAll(".fseg button").forEach(function(b){b.onclick=function(){var g=b.dataset.g,v=b.dataset.v;if(g==="type")filterType=v;else filterTrans=v;b.parentNode.querySelectorAll("button").forEach(function(x){x.classList.remove("on");});b.classList.add("on");render();};});
 applyI(); if(loadSession())showApp(); else {document.getElementById("login").style.display="flex";applyI();}
})();
</script></body></html>
