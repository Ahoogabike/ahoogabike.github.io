<!DOCTYPE html>
<html lang="en">
<head>
<script src="ahooga-auth.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ahooga · Shipments Monitor (DSV + DPD)</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap');
:root{--paper:#f6f5f0;--paper-2:#efeee7;--card:#fff;--ink:#1a1a17;--ink-dim:#57534e;--ink-faint:#8a857d;--line:#e3e0d8;--line-soft:#efece5;--blue:#2b7fd6;--green:#2e8c3c;--red:#dc0032;--amber:#c9991f;--dsv:#0033a0;--dpd:#dc0032;--radius:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Archivo',system-ui,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
header{display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:64px;background:rgba(255,255,255,.8);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.logo{font-weight:800;font-size:18px}
.logo .tag{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);border-left:1px solid var(--line);padding-left:12px;margin-left:10px}
.pill{font-family:'Space Mono',monospace;font-size:11px;padding:5px 11px;border-radius:20px;background:var(--paper-2);color:var(--ink-faint);border:1px solid var(--line);margin-left:8px}
.pill.ok{background:rgba(46,140,60,.1);color:var(--green);border-color:rgba(46,140,60,.3)}
.pill.err{background:rgba(220,0,50,.08);color:var(--red);border-color:rgba(220,0,50,.3)}
.wrap{max-width:1400px;margin:0 auto;padding:20px 22px 70px}
.connect{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:18px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint)}
.fld input,.fld select{padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-family:'Space Mono',monospace;font-size:13px;background:#fff;outline:none}
.btn{padding:10px 18px;border:0;border-radius:9px;cursor:pointer;font-family:'Archivo';font-weight:800;font-size:13px;color:#fff;background:var(--blue);white-space:nowrap}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 11px;font-size:12px}
.btn.amber{background:var(--amber)}
.btn:disabled{opacity:.5;cursor:default}
.alert{padding:11px 14px;border-radius:9px;font-size:13px;margin-bottom:14px}
.alert.ok{background:rgba(46,140,60,.1);color:var(--green);border:1px solid rgba(46,140,60,.3)}
.alert.warn{background:rgba(201,153,31,.12);color:#8a6a12;border:1px solid rgba(201,153,31,.35)}
.alert.err{background:rgba(220,0,50,.08);color:var(--red);border:1px solid rgba(220,0,50,.3)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .v{font-size:26px;font-weight:800;line-height:1.1}
.kpi .l{font-size:12px;color:var(--ink-faint);margin-top:3px}
.kpi.alarm .v{color:var(--red)}
.kpi.good .v{color:var(--green)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:12px}
.spacer{flex:1}
.count{font-size:12.5px;color:var(--ink-faint);margin-bottom:8px}
table.tbl{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:12.5px}
table.tbl th{text-align:left;background:#242019;color:#fff;font-size:10px;text-transform:uppercase;letter-spacing:.08em;padding:9px 10px;white-space:nowrap;cursor:pointer;user-select:none}
table.tbl td{padding:9px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top}
tbody tr:hover{background:#faf9f5}
tr.flagged{background:rgba(220,0,50,.05)}
tr.flagged:hover{background:rgba(220,0,50,.09)}
tr.delivered{opacity:.62}
.mono{font-family:'Space Mono',monospace}
.badge{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:20px;white-space:nowrap;display:inline-block}
.b-dsv{background:rgba(0,51,160,.1);color:var(--dsv)}
.b-dpd{background:rgba(220,0,50,.1);color:var(--dpd)}
.b-transit{background:rgba(43,127,214,.12);color:var(--blue)}
.b-delivered{background:rgba(46,140,60,.12);color:var(--green)}
.b-delay{background:rgba(220,0,50,.14);color:var(--red)}
.b-scan{background:rgba(201,153,31,.14);color:#8a6a12}
.days{font-weight:800;font-size:15px}
.days.hot{color:var(--red)}
.days.warm{color:var(--amber)}
a.link{color:var(--blue);text-decoration:none}
a.link:hover{text-decoration:underline}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
.empty{padding:34px;text-align:center;color:var(--ink-faint)}
.muted{color:var(--ink-faint)}
.range{display:flex;align-items:center;gap:8px}
.range input[type=range]{width:130px}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}}
</style>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<header>
  <div class="logo">Shipments <span class="tag">DSV + DPD · in-transit monitor</span> <span class="tag" style="background:#0a7d32;color:#fff;border:0;padding:3px 8px;border-radius:6px">build 2026‑07‑02a</span></div>
  <div><span class="pill" id="odoo-pill">Odoo: not connected</span><span class="pill" id="dsv-pill">DSV: —</span><span class="pill" id="dpd-pill">DPD: —</span></div>
</header>
<div class="wrap">
  <div id="alert"></div>

  <div class="connect">
    <div class="fld"><label>Odoo Email</label><input id="cfg-user" placeholder="yourname@ahooga.bike"/></div>
    <div class="fld"><label>Odoo Password / API key</label><input id="cfg-key" type="password" placeholder="your odoo password"/></div>
    <button class="btn" id="connectBtn" onclick="loadAll()">Connect &amp; load shipments</button>
    <div class="spacer"></div>
    <div class="fld"><label>Shipped within</label>
      <select id="window" onchange="loadAll()">
        <option value="21">last 21 days</option>
        <option value="45" selected>last 45 days</option>
        <option value="90">last 90 days</option>
      </select>
    </div>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="toolbar">
    <div class="range"><label style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint)">Alert after</label>
      <input type="range" id="thr" min="3" max="21" value="7" oninput="$('thrv').textContent=this.value+' days';render()"/>
      <span class="mono" id="thrv">7 days</span></div>
    <select id="fCarrier" onchange="render()"><option value="">All carriers</option><option value="DSV">DSV</option><option value="DPD">DPD</option></select>
    <select id="fView" onchange="render()">
      <option value="active">In transit only</option>
      <option value="delayed">Delayed only</option>
      <option value="all">All (incl. delivered)</option>
    </select>
    <input class="fld" style="padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-family:'Space Mono',monospace;font-size:13px" type="search" id="q" placeholder="search order / customer / tracking…" oninput="render()"/>
    <div class="spacer"></div>
    <button class="btn ghost sm" id="refreshBtn" onclick="refreshTracking()">↻ Refresh tracking</button>
  </div>

  <div class="count" id="count"></div>
  <div id="list"><div class="empty">Enter your Odoo email + password, then “Connect &amp; load shipments”.</div></div>
</div>

<script>
/* Shipments Monitor — combined DSV + DPD in-transit dashboard.
   Odoo via ahooga-odoo-proxy; live tracking via ahooga-dsv-proxy and ahooga-dpd-proxy. */
const CF_WORKER  = 'https://ahooga-odoo-proxy.ahoogahouse-1050-be.workers.dev';
const ODOO_URL   = 'https://ahooga.odoo.com';
const ODOO_DB    = 'logicasoft-aho-18-0-21599177';
const DSV_WORKER = (function(){ try{ return localStorage.getItem('dsv_worker')||'https://ahooga-dsv-proxy.ahoogahouse-1050-be.workers.dev'; }catch(e){ return 'https://ahooga-dsv-proxy.ahoogahouse-1050-be.workers.dev'; } })();
const DPD_WORKER = (function(){ try{ return localStorage.getItem('dpd_worker')||'https://ahooga-dpd-proxy.ahoogahouse-1050-be.workers.dev'; }catch(e){ return 'https://ahooga-dpd-proxy.ahoogahouse-1050-be.workers.dev'; } })();

let odooUid=null, SHIPMENTS=[], _partners={}, _ccache={}, sort={k:'days',dir:-1};

const $=(id)=>document.getElementById(id);
const esc=(s)=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const soOf=(d)=>(Array.isArray(d.sale_id)?d.sale_id[1]:'')||d.origin||'';
function creds(){ return { user:$('cfg-user').value.trim(), key:$('cfg-key').value.trim() }; }
function pill(id,txt,cls){ const p=$(id); p.textContent=txt; p.className='pill'+(cls?(' '+cls):''); }
function alert_(msg,type){ $('alert').innerHTML=`<div class="alert ${type}">${msg}</div>`; if(type==='ok') setTimeout(()=>{$('alert').innerHTML='';},6000); }

/* ── Odoo XML-RPC client (same as ship apps) ── */
function proxyUrl(path){ return `${CF_WORKER}/odoo/${encodeURIComponent(ODOO_URL+path)}`; }
function v(x){
  if(x===null||x===undefined) return '<value><boolean>0</boolean></value>';
  if(typeof x==='boolean') return `<value><boolean>${x?1:0}</boolean></value>`;
  if(typeof x==='number'&&Number.isInteger(x)) return `<value><int>${x}</int></value>`;
  if(typeof x==='number') return `<value><double>${x}</double></value>`;
  if(Array.isArray(x)) return `<value><array><data>${x.map(v).join('')}</data></array></value>`;
  if(typeof x==='object'){ const m=Object.entries(x).map(([k,vv])=>`<member><name>${k}</name>${v(vv)}</member>`).join(''); return `<value><struct>${m}</struct></value>`; }
  return `<value><string>${String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</string></value>`;
}
function parseXml(xml){
  const doc=new DOMParser().parseFromString(xml,'text/xml');
  if(doc.querySelector('fault')) throw new Error('Odoo: '+(doc.querySelector('faultString')?.textContent?.substring(0,200)||'fault'));
  function pv(n){ if(!n)return null; const c=n.firstElementChild; if(!c)return n.textContent;
    switch(c.tagName){
      case'int':case'i4':case'i8':return parseInt(c.textContent);
      case'double':return parseFloat(c.textContent);
      case'boolean':return c.textContent==='1';
      case'string':return c.textContent;
      case'nil':return null;
      case'array':return Array.from(c.querySelector('data')?.children||[]).map(pv);
      case'struct':{const o={};c.querySelectorAll(':scope>member').forEach(m=>{o[m.querySelector('name').textContent]=pv(m.querySelector('value'))});return o;}
      default:return c.textContent;
    } }
  return pv(doc.querySelector('methodResponse>params>param>value'));
}
async function odoo(model,method,args,kwargs={}){
  const {user,key}=creds();
  if(!odooUid){
    const b=`<?xml version="1.0"?><methodCall><methodName>authenticate</methodName><params>${[v(ODOO_DB),v(user),v(key),v({})].map(x=>`<param>${x}</param>`).join('')}</params></methodCall>`;
    const r=await fetch(proxyUrl('/xmlrpc/2/common'),{method:'POST',headers:{'Content-Type':'application/xml'},body:b});
    odooUid=parseXml(await r.text());
    if(!odooUid||typeof odooUid!=='number') throw new Error('Odoo authentication failed — check your email and password/API key.');
  }
  const params=[v(ODOO_DB),v(odooUid),v(key),v(model),v(method),v(args),v(kwargs)];
  const b=`<?xml version="1.0"?><methodCall><methodName>execute_kw</methodName><params>${params.map(x=>`<param>${x}</param>`).join('')}</params></methodCall>`;
  const r=await fetch(proxyUrl('/xmlrpc/2/object'),{method:'POST',headers:{'Content-Type':'application/xml'},body:b});
  return parseXml(await r.text());
}

/* ── carrier worker clients ── */
async function workerPost(base,path,body){
  try{
    const r=await fetch(`${base}${path}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});
    const t=await r.text(); let j; try{ j=JSON.parse(t); }catch(e){ return {ok:false,error:'non-JSON'}; }
    return j;
  }catch(e){ return {ok:false,error:String(e)}; }
}
function carrierOf(ref){ ref=String(ref||''); if(/^4025/.test(ref)||ref.length>=18) return 'DSV'; return 'DPD'; }
function trackUrlOf(carrier,ref){ return carrier==='DSV'
  ? 'https://mydsv.com/new/tracking/track-shipment?query='+encodeURIComponent(ref)
  : 'https://www.dpdgroup.com/be/mydpd/my-parcels/track?parcelNumber='+encodeURIComponent(ref); }

const DELIVERED_RE=/deliver|livr|bezorg|geleverd|zugestellt|afgeleverd|remis/i;
function parseTrack(res){
  const out={ ok:!!(res&&res.ok), status:'', delivered:false, pickup:null, lastDate:null, lastDesc:'', lastLoc:'', trackingUrl:(res&&res.trackingUrl)||'' };
  if(!res||!res.ok) return out;
  let ev=Array.isArray(res.events)?res.events.slice():[];
  ev=ev.filter(e=>e&&(e.date||e.description)).map(e=>({ date:e.date||'', description:e.description||'', location:e.location||'' }));
  ev.sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  if(ev.length){ out.pickup=ev[0].date||null; const last=ev[ev.length-1]; out.lastDate=last.date||null; out.lastDesc=last.description||''; out.lastLoc=last.location||''; }
  out.status=res.status||out.lastDesc||'';
  const hay=(out.status+' '+ev.map(e=>e.description).join(' '));
  out.delivered=DELIVERED_RE.test(hay);
  return out;
}

function daysSince(dstr){ if(!dstr) return null; const t=Date.parse(String(dstr).replace(' ','T')); if(isNaN(t)) return null; return Math.floor((Date.now()-t)/86400000); }
function fmtDate(dstr){ return dstr?String(dstr).replace('T',' ').slice(0,16):'—'; }

/* ── load ── */
async function loadAll(){
  const {user,key}=creds(); if(!user||!key){ alert_('Enter your Odoo email and password.','warn'); return; }
  try{ localStorage.setItem('mxp_cfg',JSON.stringify({user,key})); }catch(e){}
  odooUid=null; pill('odoo-pill','Odoo: connecting…');
  $('connectBtn').disabled=true;
  try{
    const days=parseInt($('window').value)||45;
    const cutoff=new Date(Date.now()-days*86400000).toISOString().slice(0,19).replace('T',' ');
    const domain=[['carrier_tracking_ref','!=',false],['picking_type_code','=','outgoing'],['state','=','done'],['date_done','>=',cutoff]];
    const picks=await odoo('stock.picking','search_read',[domain],{fields:['name','carrier_tracking_ref','date_done','scheduled_date','partner_id','sale_id','origin'],order:'date_done desc',limit:400});
    pill('odoo-pill','Odoo: ✓ '+ (picks||[]).length,'ok');
    // partners
    const pids=[...new Set((picks||[]).map(p=>Array.isArray(p.partner_id)?p.partner_id[0]:null).filter(Boolean))];
    _partners={};
    if(pids.length){
      const recs=await odoo('res.partner','read',[pids,['name','email','lang','country_id']]);
      (recs||[]).forEach(r=>{ _partners[r.id]=r; });
    }
    SHIPMENTS=(picks||[]).map(p=>{
      const ref=String(p.carrier_tracking_ref);
      const carrier=carrierOf(ref);
      const partner=Array.isArray(p.partner_id)?_partners[p.partner_id[0]]:null;
      return { id:p.id, name:p.name, ref, carrier, sale_id:p.sale_id, origin:p.origin,
        customer:Array.isArray(p.partner_id)?p.partner_id[1]:'', partner,
        shipped:p.date_done, track:null, _tracked:false };
    });
    render();
    if(SHIPMENTS.length) refreshTracking();
    // carrier health pills
    fetch(`${DSV_WORKER}/health`).then(r=>r.json()).then(j=>pill('dsv-pill','DSV: '+(j.env||'ready'),'ok')).catch(()=>pill('dsv-pill','DSV: down','err'));
    fetch(`${DPD_WORKER}/health`).then(r=>r.json()).then(j=>pill('dpd-pill','DPD: '+(j.env||'ready'),'ok')).catch(()=>pill('dpd-pill','DPD: down','err'));
  }catch(e){ alert_('Could not load: '+esc(e.message),'err'); pill('odoo-pill','Odoo: error','err'); }
  finally{ $('connectBtn').disabled=false; }
}

/* fetch tracking for all, throttled */
let _refreshing=false;
async function refreshTracking(){
  if(_refreshing||!SHIPMENTS.length) return; _refreshing=true;
  $('refreshBtn').disabled=true; $('refreshBtn').innerHTML='<span class="spin"></span> checking…';
  const queue=SHIPMENTS.slice(); let i=0; const CONC=5;
  async function worker(){
    while(i<queue.length){
      const s=queue[i++];
      const res=s.carrier==='DSV' ? await workerPost(DSV_WORKER,'/track',{bookingId:s.ref}) : await workerPost(DPD_WORKER,'/track',{parcelNumber:s.ref});
      s.track=parseTrack(res); s._tracked=true;
      if(i%4===0) render();
    }
  }
  await Promise.all(Array.from({length:CONC},worker));
  _refreshing=false; $('refreshBtn').disabled=false; $('refreshBtn').textContent='↻ Refresh tracking';
  render();
}

/* derived per shipment */
function metrics(s){
  const t=s.track;
  const pickupDays = t&&t.pickup ? daysSince(t.pickup) : null;
  const shipDays = daysSince(s.shipped);
  const days = pickupDays!=null ? pickupDays : shipDays;         // prefer first carrier scan; fall back to Odoo ship date
  const scanned = !!(t&&t.pickup);
  const delivered = !!(t&&t.delivered);
  return { days, scanned, delivered, status:(t&&t.status)||'', loc:(t&&t.lastLoc)||'', lastDate:(t&&t.lastDate)||'' };
}

function render(){
  const thr=parseInt($('thr').value)||7;
  const fc=$('fCarrier').value, fv=$('fView').value, q=($('q').value||'').toLowerCase().trim();
  let rows=SHIPMENTS.map(s=>({s,m:metrics(s)}));
  // KPIs (over everything loaded)
  const inTransit=rows.filter(r=>!r.m.delivered);
  const delayed=inTransit.filter(r=>r.m.days!=null && r.m.days>=thr);
  const awaiting=inTransit.filter(r=>!r.m.scanned && r.s._tracked);
  const delivered=rows.filter(r=>r.m.delivered);
  $('kpis').innerHTML=[
    ['In transit',inTransit.length,''],
    ['Delayed ≥ '+thr+'d',delayed.length,'alarm'],
    ['Awaiting first scan',awaiting.length,''],
    ['Delivered (in window)',delivered.length,'good'],
  ].map(k=>`<div class="kpi ${k[2]}"><div class="v">${k[1]}</div><div class="l">${k[0]}</div></div>`).join('');

  // filter
  if(fc) rows=rows.filter(r=>r.s.carrier===fc);
  if(fv==='active') rows=rows.filter(r=>!r.m.delivered);
  else if(fv==='delayed') rows=rows.filter(r=>!r.m.delivered && r.m.days!=null && r.m.days>=thr);
  if(q) rows=rows.filter(r=>((r.s.name+' '+r.s.customer+' '+r.s.ref+' '+soOf(r.s)).toLowerCase().includes(q)));
  // sort
  rows.sort((a,b)=>{ let x,y; if(sort.k==='days'){x=a.m.days==null?-1:a.m.days;y=b.m.days==null?-1:b.m.days;}
    else if(sort.k==='carrier'){x=a.s.carrier;y=b.s.carrier;} else if(sort.k==='customer'){x=(a.s.customer||'').toLowerCase();y=(b.s.customer||'').toLowerCase();}
    else {x=a.s.shipped||'';y=b.s.shipped||'';}
    if(x<y)return -1*sort.dir; if(x>y)return 1*sort.dir; return 0; });

  $('count').textContent=`${rows.length} shown · ${SHIPMENTS.length} loaded${_refreshing?' · checking tracking…':''}`;
  if(!rows.length){ $('list').innerHTML='<div class="empty">Nothing to show. Adjust filters or connect.</div>'; return; }

  const head=`<tr>
    <th onclick="setSort('carrier')">Carrier</th><th>Transfer</th><th>Order</th><th onclick="setSort('customer')">Customer</th>
    <th>Tracking</th><th onclick="setSort('shipped')">Shipped</th><th onclick="setSort('days')">Days ▾</th>
    <th>Status</th><th>Last location</th><th></th></tr>`;
  const body=rows.map(({s,m})=>{
    const flagged=!m.delivered && m.days!=null && m.days>=thr;
    const so=soOf(s), soId=Array.isArray(s.sale_id)?s.sale_id[0]:null;
    const soLink=soId?`<a class="link" href="${ODOO_URL}/web#id=${soId}&model=sale.order&view_type=form" target="_blank">${esc(so)}</a>`:esc(so||'—');
    let stBadge; if(m.delivered) stBadge='<span class="badge b-delivered">Delivered</span>';
      else if(!s._tracked) stBadge='<span class="muted">checking…</span>';
      else if(!m.scanned) stBadge='<span class="badge b-scan">Awaiting scan</span>';
      else if(flagged) stBadge='<span class="badge b-delay">Delayed</span>';
      else stBadge='<span class="badge b-transit">In transit</span>';
    const dcls=m.days==null?'':(m.days>=thr?'days hot':(m.days>=thr-2?'days warm':'days'));
    const canEmail=!m.delivered && soId;
    const emailBtn=canEmail?`<button class="btn ${flagged?'amber':'ghost'} sm" onclick="sendDelayEmail(${s.id})" id="em-${s.id}">✉ Email customer</button>`:'';
    return `<tr class="${flagged?'flagged':''}${m.delivered?' delivered':''}">
      <td><span class="badge ${s.carrier==='DSV'?'b-dsv':'b-dpd'}">${s.carrier}</span></td>
      <td class="mono">${esc(s.name)}</td>
      <td>${soLink}</td>
      <td>${esc(s.customer||'—')}</td>
      <td class="mono"><a class="link" href="${trackUrlOf(s.carrier,s.ref)}" target="_blank" title="open carrier tracking">${esc(s.ref)}</a></td>
      <td class="mono">${fmtDate(s.shipped)}</td>
      <td class="${dcls}">${m.days==null?'—':m.days+'d'}</td>
      <td>${stBadge}${m.status?'<div class="muted" style="font-size:11px;margin-top:2px">'+esc(m.status)+'</div>':''}</td>
      <td>${m.loc?esc(m.loc):'<span class="muted">—</span>'}${m.lastDate?'<div class="muted" style="font-size:11px">'+esc(fmtDate(m.lastDate))+'</div>':''}</td>
      <td>${emailBtn}</td>
    </tr>`;
  }).join('');
  $('list').innerHTML=`<table class="tbl"><thead>${head}</thead><tbody>${body}</tbody></table>`;
}
function setSort(k){ if(sort.k===k) sort.dir*=-1; else { sort.k=k; sort.dir=(k==='days'||k==='shipped')?-1:1; } render(); }

/* ── proactive "taking longer" email (same reliable mechanism as dsv-ship) ── */
function delayMsg(lang, ref){
  const r=esc(ref);
  const t={
    en:'Dear Customer,<br><br>We noticed that your Ahooga order <b>'+r+'</b> is taking a little longer than usual to reach you. We are checking its status with our carrier and will come back to you shortly with an update.<br><br>Thank you for your patience.<br><br>Warm regards,<br><b>The Ahooga Team</b>',
    fr:'Cher client, chère cliente,<br><br>Nous avons remarqué que votre commande Ahooga <b>'+r+'</b> met un peu plus de temps que prévu à vous parvenir. Nous vérifions son statut auprès de notre transporteur et revenons vers vous très vite avec une mise à jour.<br><br>Merci pour votre patience.<br><br>Bien à vous,<br><b>Léquipe Ahooga</b>',
    nl:'Beste klant,<br><br>We hebben gemerkt dat uw Ahooga-bestelling <b>'+r+'</b> iets langer onderweg is dan normaal. We controleren de status bij onze vervoerder en komen snel bij u terug met een update.<br><br>Bedankt voor uw geduld.<br><br>Met vriendelijke groet,<br><b>Het Ahooga-team</b>',
    de:'Sehr geehrte Kundin, sehr geehrter Kunde,<br><br>uns ist aufgefallen, dass Ihre Ahooga-Bestellung <b>'+r+'</b> etwas länger als gewöhnlich zu Ihnen unterwegs ist. Wir prüfen den Status bei unserem Versanddienstleister und melden uns in Kürze mit einem Update.<br><br>Vielen Dank für Ihre Geduld.<br><br>Herzliche Grüße,<br><b>Ihr Ahooga-Team</b>'
  };
  return t[lang]||t.en;
}
async function sendCustomerMessage(soId, cBody){
  const msgId=await odoo('sale.order','message_post',[[soId]],{body:cBody,message_type:'comment',subtype_xmlid:'mail.mt_comment',context:{mail_notify_force_send:false}});
  if(!msgId) return;
  try{ await odoo('mail.message','write',[[msgId],{body:cBody}]); }catch(e){}
  try{
    const mails=await odoo('mail.mail','search_read',[[['mail_message_id','=',msgId]]],{fields:['body_html']});
    const ids=[];
    for(const m of (mails||[])){ const fixed=(m.body_html||'').replace(/&lt;/g,'<').replace(/&gt;/g,'>'); try{ await odoo('mail.mail','write',[[m.id],{body_html:fixed}]); ids.push(m.id); }catch(e){} }
    if(ids.length){ try{ await odoo('mail.mail','send',[ids]); }catch(e){} }
  }catch(e){}
}
async function sendDelayEmail(pickId){
  const s=SHIPMENTS.find(x=>x.id===pickId); if(!s) return;
  const soId=Array.isArray(s.sale_id)?s.sale_id[0]:null;
  if(!soId){ alert_('No linked sales order — cannot message the customer.','warn'); return; }
  if(!confirm('Send the "taking longer than expected" message to the customer of '+(soOf(s)||s.name)+'?')) return;
  const btn=$('em-'+pickId); if(btn){ btn.disabled=true; btn.innerHTML='<span class="spin"></span> sending…'; }
  try{
    const lang=((s.partner&&s.partner.lang)||'en').slice(0,2).toLowerCase();
    await sendCustomerMessage(soId, delayMsg(lang, soOf(s)||s.name));
    if(btn){ btn.textContent='✓ sent'; }
    alert_('✓ Customer of '+(soOf(s)||s.name)+' notified.','ok');
  }catch(e){ if(btn){ btn.disabled=false; btn.textContent='✉ Email customer'; } alert_('Could not send: '+esc(e.message),'err'); }
}
