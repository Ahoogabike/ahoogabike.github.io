<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>Ahooga — Internal Tools</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800;900&display=swap');
:root{
  --paper:#f7f4ec;--paper-2:#efe9dc;--card:#ffffff;
  --line:#e4ddcd;--line-soft:#eee8da;
  --ink:#1d1c16;--ink-dim:#6b6557;--ink-faint:#9a9384;
  --gold:#c9991f;--gold-soft:#e7b33a;
  --pink:#ea1d5e;--pink-bright:#ff4d83;
  --yellow:#f2b705;
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{min-height:100%}
body{
  font-family:'Archivo',system-ui,sans-serif;
  background:
    radial-gradient(900px 460px at 88% -8%,rgba(242,183,5,.10),transparent 60%),
    radial-gradient(760px 420px at 4% 4%,rgba(234,29,94,.06),transparent 58%),
    var(--paper);
  background-attachment:fixed;
  color:var(--ink);min-height:100vh;display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
a,button,input{-webkit-tap-highlight-color:rgba(234,29,94,.12)}
.mono{font-family:'Space Mono',monospace}

/* ===== header ===== */
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 40px;height:74px;background:rgba(255,255,255,.78);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:30;
  padding-left:max(40px,env(safe-area-inset-left));
  padding-right:max(40px,env(safe-area-inset-right));
}
.logo{display:flex;align-items:center;gap:16px}
.logo img{height:28px;width:auto;display:block}
.logo .divider{width:1px;height:24px;background:var(--line)}
.logo-sub{color:var(--ink-faint);font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
.header-right{
  font-family:'Space Mono',monospace;color:var(--ink-faint);font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:8px;
}
.header-right .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px rgba(201,153,31,.6)}

/* ===== hero ===== */
.hero{padding:52px 40px 48px;position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.hero-inner{
  max-width:1040px;margin:0 auto;position:relative;z-index:1;
  display:grid;grid-template-columns:1fr 1.05fr;gap:44px;align-items:center;
}
.hero-tag{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(234,29,94,.08);border:1px solid rgba(234,29,94,.28);
  color:var(--pink);font-size:11px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;padding:6px 14px;border-radius:20px;margin-bottom:20px;
}
.hero-tag .pulse{width:7px;height:7px;border-radius:50%;background:var(--pink);
  box-shadow:0 0 0 0 rgba(234,29,94,.5);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(234,29,94,.45)}70%{box-shadow:0 0 0 8px rgba(234,29,94,0)}100%{box-shadow:0 0 0 0 rgba(234,29,94,0)}}
.hero h1{font-size:48px;font-weight:900;line-height:1.0;letter-spacing:-1.8px;margin-bottom:16px}
.hero h1 .accent{
  background:linear-gradient(100deg,var(--pink) 0%,var(--gold) 110%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.hero p{color:var(--ink-dim);font-size:15px;max-width:400px;line-height:1.65}
.hero-figure{position:relative}
.hero-figure img{
  width:100%;display:block;border-radius:var(--radius);
  box-shadow:0 24px 60px rgba(43,33,10,.28),0 2px 0 rgba(255,255,255,.6) inset;
}
.hero-figure::after{
  content:'';position:absolute;inset:0;border-radius:var(--radius);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);pointer-events:none;
}
.hero-figure .cap{
  position:absolute;left:14px;bottom:14px;
  background:rgba(20,18,12,.62);backdrop-filter:blur(6px);
  color:#fff;font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.08em;
  padding:6px 11px;border-radius:20px;border:1px solid rgba(255,255,255,.18);
}
.hero-figure .cap b{color:var(--gold-soft)}

/* ===== connect ===== */
.connect-section{background:var(--paper-2);border-bottom:1px solid var(--line);padding:22px 40px}
.connect-inner{max-width:1040px;margin:0 auto;display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.connect-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.16em;color:var(--ink-faint);margin-bottom:7px}
.connect-field{display:flex;flex-direction:column;flex:1;min-width:190px}
.connect-field input{
  padding:10px 14px;border:1px solid var(--line);border-radius:9px;
  font-size:13px;font-family:'Space Mono',monospace;background:#fff;color:var(--ink);outline:none;transition:.15s;
}
.connect-field input::placeholder{color:var(--ink-faint)}
.connect-field input:focus{border-color:var(--pink);box-shadow:0 0 0 2px rgba(234,29,94,.14)}
.connect-btn{
  padding:11px 22px;border:0;border-radius:9px;cursor:pointer;white-space:nowrap;
  font-size:13px;font-family:'Archivo';font-weight:800;letter-spacing:.02em;color:#fff;
  background:linear-gradient(100deg,var(--pink) 0%,var(--gold) 135%);
  transition:.18s;box-shadow:0 4px 16px rgba(234,29,94,.22);
}
.connect-btn:hover{filter:brightness(1.05);transform:translateY(-1px);box-shadow:0 6px 20px rgba(234,29,94,.3)}
.connect-status{font-size:12px;font-family:'Space Mono',monospace;padding:8px 13px;border-radius:8px;display:none;width:100%}
.connect-status.ok{display:block;background:rgba(46,140,60,.1);color:#2e7d32;border:1px solid rgba(46,140,60,.3)}
.connect-status.err{display:block;background:rgba(234,29,94,.08);color:#c01650;border:1px solid rgba(234,29,94,.32)}

/* ===== apps ===== */
.apps-section{flex:1;padding:40px 40px 52px}
.apps-inner{max-width:1040px;margin:0 auto}
.section-label{
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.2em;
  color:var(--ink-faint);margin-bottom:20px;display:flex;align-items:center;gap:12px;
}
.section-label::after{content:'';flex:1;height:1px;background:var(--line)}
.sub-label{
  font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.16em;
  color:var(--ink-faint);opacity:.85;margin:24px 0 12px;display:flex;align-items:center;gap:10px;
}
.sub-label::before{content:'';width:14px;height:2px;border-radius:1px;background:currentColor;opacity:.5}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{
  --accent:var(--gold);
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;
  text-decoration:none;color:var(--ink);transition:.22s;
  display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden;
  box-shadow:0 1px 2px rgba(43,33,10,.04);
}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent)}
.card::after{
  content:'';position:absolute;top:-60px;right:-60px;width:140px;height:140px;border-radius:50%;
  background:radial-gradient(circle,var(--accent),transparent 68%);opacity:.07;transition:.22s;
}
.card:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--accent) 55%,var(--line));
  box-shadow:0 16px 38px rgba(43,33,10,.14)}
.card:hover::after{opacity:.16}
.card-header{display:flex;align-items:flex-start;justify-content:space-between;position:relative;z-index:1}
.card-num{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.1em}
.card-icon-wrap{
  width:52px;height:52px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  background:color-mix(in srgb,var(--accent) 12%,#fff);
  border:1px solid color-mix(in srgb,var(--accent) 28%,transparent);
}
.card-title{font-size:16px;font-weight:800;letter-spacing:-.3px;line-height:1.2;margin-bottom:6px;position:relative;z-index:1}
.card-desc{font-size:12.5px;color:var(--ink-dim);line-height:1.6;position:relative;z-index:1}
.card-arrow{position:absolute;bottom:20px;right:20px;opacity:0;transition:.22s;color:var(--accent);font-size:18px;font-weight:700;z-index:1}
.card:hover .card-arrow{opacity:1;transform:translateX(4px)}
.card.featured{background:linear-gradient(155deg,rgba(234,29,94,.07),#fff 62%);border-color:rgba(234,29,94,.3)}

/* ===== footer ===== */
footer{
  border-top:1px solid var(--line);background:var(--paper-2);
  color:var(--ink-faint);padding:20px 40px;display:flex;align-items:center;justify-content:space-between;
  font-size:11px;font-family:'Space Mono',monospace;letter-spacing:.08em;
  padding-bottom:max(20px,env(safe-area-inset-bottom));
}
.footer-logo{color:var(--ink-dim);font-weight:700;letter-spacing:.2em;text-transform:uppercase}
.footer-logo b{color:var(--pink)}

@media(max-width:860px){
  .hero-inner{grid-template-columns:1fr;gap:28px}
  .hero-figure{order:-1}
  .hero h1{font-size:38px}
}
@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}}
@media(max-width:980px){.cc-grid{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.cc-grid{grid-template-columns:1fr}}
@media(max-width:520px){
  .grid{grid-template-columns:1fr}
  header,.hero,.apps-section,.connect-section,.cc-band,footer{
    padding-left:max(20px,env(safe-area-inset-left));
    padding-right:max(20px,env(safe-area-inset-right));
  }
  .hero{padding-top:34px;padding-bottom:34px}.hero h1{font-size:32px}
  /* 16px inputs stop iOS Safari from zooming the page on focus */
  .connect-field input{font-size:16px}
  .connect-btn{width:100%;padding-top:14px;padding-bottom:14px}
  .header-right{font-size:10px}
  .hero p{font-size:15px}
  .cc-title{font-size:27px}
}

/* ===== custom colour workflow band ===== */
.cc-band{
  position:relative;overflow:hidden;padding:46px 40px 52px;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  background:
    radial-gradient(680px 380px at 6% -12%,rgba(255,77,131,.60),transparent 60%),
    radial-gradient(640px 380px at 52% 124%,rgba(47,111,94,.55),transparent 62%),
    radial-gradient(720px 440px at 100% -6%,rgba(242,183,5,.65),transparent 58%),
    linear-gradient(118deg,#c0451f 0%,#ea1d5e 30%,#b07d2b 58%,#2f6f5e 100%);
}
.cc-band::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(0,0,0,.07))}
.cc-inner{max-width:1040px;margin:0 auto;position:relative;z-index:1}
.cc-eyebrow{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.20);
  border:1px solid rgba(255,255,255,.5);color:#fff;font-size:11px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;padding:6px 14px;border-radius:20px;margin-bottom:14px;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.cc-eyebrow .pulse{width:7px;height:7px;border-radius:50%;background:#fff;
  box-shadow:0 0 0 0 rgba(255,255,255,.6);animation:pulse 2s infinite}
.cc-title{font-size:34px;font-weight:900;letter-spacing:-1px;color:#fff;line-height:1.04;
  text-shadow:0 2px 20px rgba(80,20,10,.28)}
.cc-sub{color:rgba(255,255,255,.94);font-size:14px;max-width:560px;line-height:1.6;margin:9px 0 24px;
  text-shadow:0 1px 8px rgba(80,20,10,.2)}
.cc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.cc-card{position:relative;overflow:hidden;text-decoration:none;color:var(--ink);
  background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.6);border-radius:var(--radius);padding:22px;
  display:flex;flex-direction:column;gap:13px;box-shadow:0 14px 40px rgba(60,18,10,.28);transition:.22s}
.cc-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--accent)}
.cc-card::after{content:'';position:absolute;top:-50px;right:-50px;width:130px;height:130px;border-radius:50%;
  background:radial-gradient(circle,var(--accent),transparent 68%);opacity:.10;transition:.22s}
.cc-card:hover{transform:translateY(-4px);box-shadow:0 24px 56px rgba(60,18,10,.36)}
.cc-card:hover::after{opacity:.2}
.cc-card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;z-index:1}
.cc-step{font-family:'Space Mono',monospace;font-size:10.5px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--accent)}
.cc-name{font-size:19px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.cc-ico{flex:none;width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--accent) 14%,#fff);border:1px solid color-mix(in srgb,var(--accent) 32%,transparent)}
.cc-desc{font-size:13px;color:var(--ink-dim);line-height:1.55;position:relative;z-index:1}
.cc-arrow{margin-top:auto;color:var(--accent);font-weight:800;font-size:20px;position:relative;z-index:1}

/* ===== left nav rail + app window (redesign) ===== */
:root{ --nav-w:64px; --nav-w-open:288px; }
body{ padding-left:var(--nav-w); transition:padding-left .25s ease; }

.nav-hot{position:fixed;top:0;left:0;bottom:0;width:18px;z-index:55}

.sidenav{
  position:fixed;top:0;left:0;bottom:0;width:var(--nav-w);z-index:90;
  background:linear-gradient(177deg,#1d1c16 0%,#26241b 100%);
  border-right:1px solid rgba(255,255,255,.08);
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:2px 0 18px rgba(20,16,6,.10);
  transition:width .26s cubic-bezier(.4,0,.2,1),box-shadow .26s;
}
.sidenav:hover,body.nav-pinned .sidenav{width:var(--nav-w-open);box-shadow:8px 0 40px rgba(20,16,6,.30)}

.nav-top{display:flex;align-items:center;gap:12px;height:74px;padding:0 16px;flex-shrink:0;
  border-bottom:1px solid rgba(255,255,255,.07)}
.nav-burger{width:32px;height:32px;flex:none;border:0;background:transparent;cursor:pointer;
  display:flex;flex-direction:column;justify-content:center;gap:5px;padding:6px}
.nav-burger span{display:block;height:2px;border-radius:2px;background:var(--gold-soft);transition:.25s}
.nav-brand{font-family:'Archivo';font-weight:900;letter-spacing:.12em;font-size:13px;color:#fff;
  white-space:nowrap;opacity:0;transition:opacity .2s}
.nav-brand b{color:var(--pink-bright)}
.sidenav:hover .nav-brand,body.nav-pinned .nav-brand{opacity:1;transition-delay:.06s}

.nav-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 0 18px;
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
.nav-scroll::-webkit-scrollbar{width:6px}
.nav-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:6px}

.nav-section{display:block}
.nav-sec-btn{
  width:100%;border:0;background:transparent;cursor:pointer;color:#e9e4d6;
  display:flex;align-items:center;gap:14px;padding:11px 16px;text-align:left;
  font-family:'Archivo';font-weight:700;font-size:13.5px;letter-spacing:-.01em;
  position:relative;transition:background .15s}
.nav-sec-btn:hover{background:rgba(255,255,255,.05)}
.nav-ico{width:32px;height:32px;flex:none;border-radius:9px;display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--sc) 26%,#23211a);border:1px solid color-mix(in srgb,var(--sc) 45%,transparent)}
.nav-ico svg{width:18px;height:18px;stroke:var(--sc)}
.nav-sec-label{flex:1;white-space:nowrap;opacity:0;transition:opacity .2s}
.nav-chev{width:14px;height:14px;flex:none;opacity:0;transition:opacity .2s,transform .25s;color:var(--ink-faint)}
.sidenav:hover .nav-sec-label,body.nav-pinned .nav-sec-label,
.sidenav:hover .nav-chev,body.nav-pinned .nav-chev{opacity:1}
.nav-section.open .nav-chev{transform:rotate(90deg);color:var(--gold-soft)}
.nav-section.open>.nav-sec-btn{background:rgba(255,255,255,.06)}

.nav-apps{max-height:0;overflow:hidden;transition:max-height .28s ease;background:rgba(0,0,0,.18)}
.nav-section.open .nav-apps{max-height:900px}
.nav-sub{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-faint);opacity:.7;padding:11px 16px 3px 30px;white-space:nowrap}
.nav-section.open .nav-sub{border-top:1px solid rgba(255,255,255,.06)}
.nav-apps>.nav-sub:first-child{border-top:0}
.nav-app{
  display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;cursor:pointer;
  color:#cfc9ba;font-family:'Archivo';font-weight:600;font-size:12.5px;text-align:left;
  padding:9px 16px 9px 30px;white-space:nowrap;transition:background .14s,color .14s}
.nav-app:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-app .dot{width:7px;height:7px;flex:none;border-radius:50%;background:var(--ac);box-shadow:0 0 7px var(--ac)}
.nav-app.active{background:rgba(234,29,94,.16);color:#fff}
.nav-app .ext{margin-left:auto;font-size:11px;color:var(--ink-faint)}

/* app window */
.app-panel{
  position:fixed;top:0;right:0;bottom:0;left:var(--nav-w);z-index:80;
  background:var(--paper);display:flex;flex-direction:column;
  transform:translateX(14px) scale(.985);transform-origin:left center;
  opacity:0;visibility:hidden;pointer-events:none;
  transition:transform .3s cubic-bezier(.4,0,.2,1),opacity .26s,visibility .3s;
  box-shadow:-12px 0 50px rgba(20,16,6,.18)}
.app-panel.open{transform:none;opacity:1;visibility:visible;pointer-events:auto}
.app-bar{display:flex;align-items:center;gap:14px;height:56px;flex:none;padding:0 18px;
  background:rgba(255,255,255,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line)}
.app-bar .ap-dot{width:9px;height:9px;border-radius:50%;background:var(--ap,var(--gold));box-shadow:0 0 8px var(--ap,var(--gold))}
.app-bar .ap-title{font-family:'Archivo';font-weight:800;font-size:15px;letter-spacing:-.2px;color:var(--ink)}
.app-bar .ap-spacer{flex:1}
.ap-btn{border:1px solid var(--line);background:#fff;cursor:pointer;border-radius:9px;
  font-family:'Archivo';font-weight:700;font-size:12.5px;color:var(--ink-dim);
  padding:8px 13px;display:flex;align-items:center;gap:7px;transition:.16s;text-decoration:none}
.ap-btn:hover{border-color:var(--pink);color:var(--pink)}
.ap-close{width:38px;height:38px;justify-content:center;padding:0;font-size:18px;font-weight:700}
.app-frame-wrap{flex:1;position:relative;background:var(--paper-2)}
.app-frame-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.app-loader{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;color:var(--ink-faint);font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.08em}
.app-loader .spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);
  border-top-color:var(--pink);animation:apspin .8s linear infinite}
@keyframes apspin{to{transform:rotate(360deg)}}

@media(max-width:520px){
  :root{--nav-w:0px;--nav-w-open:84vw}
  body{padding-left:0}
  .nav-burger-fab{display:flex}
  .app-panel{left:0}
}
.nav-burger-fab{display:none;position:fixed;top:14px;left:14px;z-index:95;
  width:42px;height:42px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.92);
  cursor:pointer;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  box-shadow:0 4px 16px rgba(20,16,6,.14)}
.nav-burger-fab span{display:block;width:18px;height:2px;border-radius:2px;background:var(--ink)}


/* ===== ahooga.bike brand re-theme ===== */
:root{
  --paper:#ffffff;--paper-2:#f3f1ed;--card:#ffffff;
  --line:#e6e3dd;--line-soft:#efedea;
  --ink:#111317;--ink-dim:#585c63;--ink-faint:#9aa0a6;
  --gold:#c9991f;--gold-soft:#e7b33a;
  /* primary accent repurposed to the Ahooga royal blue */
  --pink:#14259b;--pink-bright:#1f37c4;
  --blue:#14259b;--blue-bright:#1f37c4;
}
/* fonts → website-style grotesque */
body,.connect-btn,.nav-brand,.nav-sec-btn,.nav-app,.ap-title,.ap-btn,
.hero h1,.cc-title,.card-title,.cc-name{font-family:'Inter',system-ui,-apple-system,sans-serif}
.mono,.header-right,.hero-figure .cap,.connect-field input,.connect-status,
.card-num,footer,.cc-step,.app-loader{font-family:'Inter',system-ui,sans-serif}
.hero h1{letter-spacing:-2px}

/* clean white page */
body{background:var(--paper)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(20,37,155,.45)}70%{box-shadow:0 0 0 8px rgba(20,37,155,0)}100%{box-shadow:0 0 0 0 rgba(20,37,155,0)}}

/* hero accent + tag → royal blue */
.hero h1 .accent{background:none;-webkit-text-fill-color:var(--blue);color:var(--blue)}
.header-right .dot{background:var(--blue);box-shadow:0 0 8px rgba(20,37,155,.6)}

/* connect → solid blue CTA */
.connect-btn{background:var(--blue);box-shadow:0 4px 16px rgba(20,37,155,.22)}
.connect-btn:hover{box-shadow:0 6px 20px rgba(20,37,155,.32)}
.connect-field input:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(20,37,155,.16)}
.connect-status.ok{background:rgba(20,37,155,.07);color:var(--blue);border-color:rgba(20,37,155,.28)}

.card.featured{background:linear-gradient(155deg,rgba(20,37,155,.06),#fff 62%);border-color:rgba(20,37,155,.3)}

/* ---- nav rail → clean white, like the site header ---- */
.sidenav{background:#fff;border-right:1px solid var(--line);box-shadow:none}
.sidenav:hover,body.nav-pinned .sidenav{box-shadow:8px 0 40px rgba(17,19,23,.12)}
.nav-top{border-bottom:1px solid var(--line)}
.nav-burger span{background:var(--blue)}
.nav-brand{color:var(--ink);letter-spacing:.16em}
.nav-brand b{color:var(--blue)}
.nav-sec-btn{color:var(--ink)}
.nav-sec-btn:hover{background:var(--paper-2)}
.nav-ico{background:color-mix(in srgb,var(--sc) 12%,#fff);border-color:color-mix(in srgb,var(--sc) 30%,transparent)}
.nav-chev{color:var(--ink-faint)}
.nav-section.open .nav-chev{color:var(--blue)}
.nav-section.open>.nav-sec-btn{background:var(--paper-2)}
.nav-apps{background:#faf9f7}
.nav-app{color:#4a4d53}
.nav-app:hover{background:var(--paper-2);color:var(--ink)}
.nav-app.active{background:var(--blue);color:#fff}
.nav-scroll::-webkit-scrollbar-thumb{background:rgba(17,19,23,.14)}

/* app window chrome */
.app-bar{background:rgba(255,255,255,.94)}
.app-loader .spin{border-top-color:var(--blue)}
.nav-burger-fab span{background:var(--ink)}


/* ===== mobile: custom-colour workflow as a compact 2-up grid ===== */
@media(max-width:560px){
  .cc-grid{grid-template-columns:1fr 1fr;gap:10px}
  .cc-card{padding:14px;gap:9px;border-radius:13px}
  .cc-card-head{gap:6px}
  .cc-ico{width:34px;height:34px;border-radius:10px}
  .cc-ico svg{width:18px;height:18px}
  .cc-step{font-size:9px;letter-spacing:.05em}
  .cc-name{font-size:14px;line-height:1.12}
  .cc-desc{font-size:11px;line-height:1.45;
    display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  .cc-arrow{font-size:16px;margin-top:4px}
  .cc-title{font-size:24px}
  .cc-sub{font-size:13px;margin-bottom:18px}
}
@media(max-width:380px){
  .cc-card{padding:12px}
  .cc-desc{-webkit-line-clamp:3}
}


/* ===================== v2 homepage layout ===================== */
.t-top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.t-bar{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:16px;height:66px;padding:0 24px}
.t-bar .logo img{height:24px}
.t-search{flex:1;max-width:460px;margin-left:auto;position:relative}
.t-search input{width:100%;height:40px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 40px 0 38px;font:500 14px 'Archivo',sans-serif;color:var(--ink);outline:none}
.t-search input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,153,31,.18)}
.t-search svg{position:absolute;left:12px;top:11px;width:18px;height:18px;stroke:var(--ink-faint)}
.t-search kbd{position:absolute;right:10px;top:10px;font:700 11px 'Space Mono',monospace;color:var(--ink-faint);border:1px solid var(--line);border-radius:6px;padding:1px 6px;background:var(--paper)}
.t-user{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-dim);white-space:nowrap}
.t-user .d{width:8px;height:8px;border-radius:50%;background:#2f9e5b;box-shadow:0 0 6px rgba(47,158,91,.6)}
.t-user button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;font:700 12px 'Archivo',sans-serif;color:var(--ink-dim);cursor:pointer}
.t-user button:hover{border-color:var(--gold);color:var(--ink)}
.t-chips{max-width:1180px;margin:0 auto;display:flex;gap:6px;padding:0 24px 10px;overflow-x:auto;scrollbar-width:none}
.t-chips::-webkit-scrollbar{display:none}
.t-chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font:700 12px 'Archivo',sans-serif;color:var(--ink-dim);cursor:pointer;display:flex;align-items:center;gap:6px}
.t-chip i{width:7px;height:7px;border-radius:50%;background:var(--sc)}
.t-chip:hover{border-color:var(--sc);color:var(--ink)}
html.mxp-authed .connect-section{display:none}
html.mxp-authed.t-relogin .connect-section{display:block}
html:not(.mxp-authed) .t-user,html:not(.mxp-authed) .t-search,html:not(.mxp-authed) .t-chips{display:none}
.apps-section{padding:22px 24px 60px}
.apps-inner{max-width:1180px;margin:0 auto}
.t-hello{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:4px 0 18px;flex-wrap:wrap}
.t-hello h1{font:900 26px/1.15 'Archivo',sans-serif;letter-spacing:-.02em}
.t-hello p{color:var(--ink-dim);font-size:13.5px}
.t-sec{margin:0 0 26px;scroll-margin-top:130px}
.t-sh{display:flex;align-items:center;gap:9px;margin:0 0 10px}
.t-sh i{width:9px;height:9px;border-radius:3px;background:var(--sc)}
.t-sh h2{font:800 13px 'Archivo',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.t-sh span{font:700 11px 'Space Mono',monospace;color:var(--ink-faint)}
.t-sh small{font-size:12px;color:var(--ink-dim);margin-left:4px}
.t-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(262px,1fr));gap:10px}
.t-app{position:relative;display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 34px 12px 12px;text-decoration:none;color:var(--ink);min-height:74px;transition:border-color .15s,box-shadow .15s,transform .15s}
.t-app:hover{border-color:var(--ac);box-shadow:0 6px 18px -10px var(--ac);transform:translateY(-1px)}
.t-app:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.t-ico{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--ac) 12%,#fff);position:relative}
.t-ico svg{width:21px;height:21px}
.t-step{position:absolute;top:-6px;left:-6px;width:18px;height:18px;border-radius:50%;background:var(--ac);color:#fff;font:800 10.5px/18px 'Archivo',sans-serif;text-align:center;border:2px solid #fff}
.t-tx{min-width:0}
.t-tt{font:800 14px/1.25 'Archivo',sans-serif;letter-spacing:-.005em}
.t-dd{font-size:12.5px;line-height:1.35;color:var(--ink-dim);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.t-star{position:absolute;top:8px;right:8px;width:24px;height:24px;border:0;background:none;cursor:pointer;color:var(--ink-faint);opacity:0;transition:opacity .15s;font-size:15px;line-height:24px;padding:0}
.t-app:hover .t-star,.t-star.on,.t-star:focus-visible{opacity:1}
.t-star.on{color:var(--gold)}
.t-empty{padding:30px;text-align:center;color:var(--ink-dim);border:1px dashed var(--line);border-radius:14px;display:none}
.t-hide{display:none!important}
mark{background:rgba(242,183,5,.35);color:inherit;border-radius:3px;padding:0 1px}
@media (max-width:760px){
  .t-bar{height:auto;flex-wrap:wrap;padding:10px 16px;gap:10px}
  .t-search{order:3;flex-basis:100%;max-width:none;margin:0}
  .t-search kbd{display:none}
  .t-user .who{display:none}
  .t-user{margin-left:auto}
  .t-chips{padding:0 16px 10px}
  .apps-section{padding:16px 16px 50px}
  .t-grid,.t-fav .t-grid{grid-template-columns:1fr}
  .t-star{opacity:1}
  .t-hello h1{font-size:21px}
}

x1=\"5\" y1=\"14\" x2=\"9\" y2=\"14\" stroke=\"#c9991f\" stroke-width=\"1.5\" stroke-linecap=\"round\"/> <line x1=\"19\" y1=\"14\" x2=\"23\" y2=\"14\" stroke=\"#c9991f\" stroke-width=\"1.5\" stroke-linecap=\"round\"/> </svg>", "s": "service", "step": 0}, {"h": "knowledge-library.html", "t": "Knowledge Library", "d": "How-to procedures for every team, searchable", "c": "#a85fd0", "svg": "<svg viewBox=\"0 0 28 28\" fill=\"none\"> <rect x=\"5\" y=\"3\" width=\"18\" height=\"22\" rx=\"2\" fill=\"none\" stroke=\"#a85fd0\" stroke-width=\"1.5\"/> <path d=\"M9 8h10M9 12h10M9 16h6\" stroke=\"#a85fd0\" stroke-width=\"1.5\" stroke-linecap=\"round\"/> <circle cx=\"20\" cy=\"20\" r=\"5\" fill=\"#a85fd0\"/> <path d=\"M20 17.5v5M17.5 20h5\" stroke=\"#fff\" stroke-width=\"1.5\" stroke-linecap=\"round\"/> </svg>", "s": "service", "step": 0}, {"h": "training-admin.html", "t": "Training Admin — Course Builder", "d": "Dealer courses, quizzes, rewards and redemptions", "c": "#1a7f37", "svg": "<svg viewBox=\"0 0 28 28\" fill=\"none\"> <path d=\"M14 5l10 4-10 4-10-4 10-4z\" fill=\"none\" stroke=\"#1a7f37\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/> <path d=\"M7 11v5c0 1.7 3.1 3 7 3s7-1.3 7-3v-5\" fill=\"none\" stroke=\"#1a7f37\" stroke-width=\"1.5\" stroke-linecap=\"round\"/> <line x1=\"24\" y1=\"9\" x2=\"24\" y2=\"15\" stroke=\"#1a7f37\" stroke-width=\"1.5\" stroke-linecap=\"round\"/> </svg>", "s": "dealer", "step": 0}, {"h": "ahooga-news-admin.html", "t": "Send a Communication", "d": "Broadcast a message to all dealers, auto-translated", "c": "#caa006", "svg": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#caa006\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"> <path d=\"M3 11l18-7-4 16-5-5-4 4-1-5z\"/><path d=\"M12 14l5-5\"/> </svg>", "s": "dealer", "step": 0}, {"h": "ahooga-support-admin.html", "t": "Support Inbox", "d": "Live chat inbox with dealers", "c": "#2b7fd6", "svg": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#2b7fd6\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"> <path d=\"M21 11.5a8 8 0 0 1-11.6 7.1L4 20l1.4-4.3A8 8 0 1 1 21 11.5z\"/><path d=\"M8.5 11h7M8.5 14h4.5\"/> </svg>", "s": "dealer", "step": 0}, {"h": "ahooga-play-admin.html", "t": "Play Admin", "d": "Approve dealer challenges and fulfil rewards", "c": "#6b46c1", "svg": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#6b46c1\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"> <rect x=\"2.5\" y=\"7.5\" width=\"19\" height=\"9\" rx=\"4.5\"/><path d=\"M7 11v3M5.5 12.5h3\"/><circle cx=\"16\" cy=\"11.3\" r=\"1\"/><circle cx=\"18\" cy=\"13.6\" r=\"1\"/> </svg>", "s": "dealer", "step": 0}, {"h": "ahooga-faq-admin.html", "t": "FAQ Admin", "d": "The knowledge base behind the dealer FAQ assistant", "c": "#a85fd0", "svg": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#a85fd0\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"> <circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M9.3 9.4a2.7 2.7 0 1 1 3.5 2.9c-.5.2-.8.6-.8 1.2M12 16.5h.01\"/> </svg>", "s": "dealer", "step": 0}, {"h": "ahooga-testrides-admin.html", "t": "Test Rides Analytics", "d": "Test rides and conversion per dealer, week by week — anonymous", "c": "#16a34a", "svg": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#16a34a\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 3v18h18\"/><path d=\"M7 15l4-4 3 3 5-6\"/></svg>", "s": "dealer", "step": 0}, {"h": "ahooga-veloconnect-admin.html", "t": "Veloconnect Logins", "d": "Veloconnect logins for German dealers’ shop systems", "c": "#0e7490", "svg": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#0e7490\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 7V3M15 7V3\"/><rect x=\"6\" y=\"7\" rx=\"2\"/><path d=\"M12 13v3a3 3 0 0 1-3 3H7\"/></svg>", "s": "dealer", "step": 0}]};
  const SEC={};DATA.sections.forEach(s=>SEC[s.k]=s);
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const FAV_KEY='ahIT_favs', DEF_FAV=['MAX_planner.html','sales-dashboard.html','sav-app.html','ahooga_max_repair.html','shopify-convert.html','po-tracker.html'];
  let favs; try{favs=JSON.parse(localStorage.getItem(FAV_KEY)||'null');}catch(e){favs=null;}
  if(!Array.isArray(favs))favs=DEF_FAV.slice();
  const saveFavs=()=>{try{localStorage.setItem(FAV_KEY,JSON.stringify(favs));}catch(e){}};
  const byH={};DATA.apps.forEach(a=>byH[a.h]=a);

  function tile(a,q){
    const hi=s=>{s=esc(s);if(!q)return s;return s.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>');};
    return '<a class="t-app" href="'+esc(a.h)+'" data-h="'+esc(a.h)+'" style="--ac:'+a.c+'">'+
      '<span class="t-ico">'+a.svg+(a.step?'<span class="t-step">'+a.step+'</span>':'')+'</span>'+
      '<span class="t-tx"><span class="t-tt">'+hi(a.t)+'</span><span class="t-dd">'+hi(a.d)+'</span></span>'+
      '<button class="t-star'+(favs.includes(a.h)?' on':'')+'" type="button" data-fav="'+esc(a.h)+'" aria-label="'+(favs.includes(a.h)?'Remove from':'Add to')+' favourites" title="'+(favs.includes(a.h)?'Remove from':'Add to')+' favourites">'+(favs.includes(a.h)?'★':'☆')+'</button></a>';
  }
  function render(){
    const q=(document.getElementById('tq').value||'').trim();
    const ql=q.toLowerCase();
    const match=a=>!ql||(a.t+' '+a.d+' '+SEC[a.s].n).toLowerCase().includes(ql);
    let h='',n=0;
    if(!ql){
      const fa=favs.map(x=>byH[x]).filter(Boolean);
      h+='<section class="t-sec t-fav" id="sec-fav" style="--sc:#c9991f"><div class="t-sh"><i></i><h2>Favourites</h2><small>'+(fa.length?'click ☆ on any tool to add or remove':'click ☆ on any tool to pin it here')+'</small></div>'+
         (fa.length?'<div class="t-grid">'+fa.map(a=>tile(a,'')).join('')+'</div>':'')+'</section>';
    }
    DATA.sections.forEach(s=>{
      const list=DATA.apps.filter(a=>a.s===s.k&&match(a));
      if(!list.length)return; n+=list.length;
      h+='<section class="t-sec" id="sec-'+s.k+'" style="--sc:'+s.c+'"><div class="t-sh"><i></i><h2>'+esc(s.n)+'</h2><span>'+list.length+'</span>'+(s.k==='colour'?'<small>in process order</small>':'')+'</div><div class="t-grid">'+list.map(a=>tile(a,q)).join('')+'</div></section>';
    });
    document.getElementById('tList').innerHTML=h;
    document.getElementById('tEmpty').style.display=n?'none':'block';
    document.getElementById('tEmptyQ').textContent=q;
    document.getElementById('tCount').textContent=ql?(n+' of '+DATA.apps.length+' tools'):(DATA.apps.length+' tools in '+DATA.sections.length+' areas');
  }
  // chips
  document.getElementById('tChips').innerHTML=DATA.sections.map(s=>'<button class="t-chip" type="button" data-go="'+s.k+'" style="--sc:'+s.c+'"><i></i>'+esc(s.n)+'</button>').join('');
  document.getElementById('tChips').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(!b)return;
    const q=document.getElementById('tq');if(q.value){q.value='';render();}
    const el=document.getElementById('sec-'+b.dataset.go);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});});
  // clicks: star / open in panel (cmd/ctrl-click = new tab)
  document.getElementById('tList').addEventListener('click',e=>{
    const st=e.target.closest('[data-fav]');
    if(st){e.preventDefault();e.stopPropagation();const h=st.dataset.fav;
      favs=favs.includes(h)?favs.filter(x=>x!==h):favs.concat([h]);saveFavs();render();return;}
    const a=e.target.closest('.t-app');if(!a)return;
    if(e.metaKey||e.ctrlKey||e.shiftKey||e.button===1)return;
    e.preventDefault();const app=byH[a.dataset.h];window.openApp(app.h,app.t,app.c);
  });
  const qi=document.getElementById('tq');
  qi.addEventListener('input',render);
  qi.addEventListener('keydown',e=>{
    if(e.key==='Enter'){const f=document.querySelector('#tList .t-app');if(f){const app=byH[f.dataset.h];window.openApp(app.h,app.t,app.c);}}
    if(e.key==='Escape'){qi.value='';render();qi.blur();}
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='/'&&document.activeElement!==qi&&!/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||'')&&!document.getElementById('appPanel').classList.contains('open')){e.preventDefault();qi.focus();}
  });
  // who is logged in
  function who(){try{const c=JSON.parse(localStorage.getItem('mxp_cfg')||'null');const u=c&&c.user||'';
    document.getElementById('tWho').textContent=u?u:'';
    const nm=u?u.split('@')[0].split(/[._-]/)[0]:'';document.getElementById('tHello').textContent=nm?('Hi '+nm.charAt(0).toUpperCase()+nm.slice(1)+' — what are you working on?'):'Internal tools';}catch(e){}}
  who();setInterval(who,3000);
  document.getElementById('tRelogin').addEventListener('click',()=>{document.documentElement.classList.toggle('t-relogin');
    if(document.documentElement.classList.contains('t-relogin'))document.getElementById('hp-user').focus();});
  render();

  // ---- side menu (same sections) ----
  const scroll=document.getElementById('navScroll'),body=document.body,sidenav=document.getElementById('sidenav');
  DATA.sections.forEach(sec=>{
    const wrap=document.createElement('div');wrap.className='nav-section';
    const btn=document.createElement('button');btn.className='nav-sec-btn';btn.style.setProperty('--sc',sec.c);
    btn.innerHTML='<span class="nav-ico"><svg viewBox="0 0 24 24" fill="'+sec.c+'"><rect x="7" y="7" width="10" height="10" rx="3"/></svg></span><span class="nav-sec-label">'+esc(sec.n)+
      '</span><svg class="nav-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
    const apps=document.createElement('div');apps.className='nav-apps';
    DATA.apps.filter(a=>a.s===sec.k).forEach(a=>{
      const ab=document.createElement('button');ab.className='nav-app';ab.style.setProperty('--ac',a.c);ab.dataset.href=a.h;
      ab.innerHTML='<span class="dot"></span>'+esc(a.t);ab.addEventListener('click',()=>window.openApp(a.h,a.t,a.c));apps.appendChild(ab);
    });
    btn.addEventListener('click',()=>{const open=wrap.classList.contains('open');
      document.querySelectorAll('.nav-section.open').forEach(s=>{if(s!==wrap)s.classList.remove('open')});wrap.classList.toggle('open',!open);});
    wrap.appendChild(btn);wrap.appendChild(apps);scroll.appendChild(wrap);
  });
  sidenav.addEventListener('mouseleave',()=>{if(!body.classList.contains('nav-pinned'))document.querySelectorAll('.nav-section.open').forEach(s=>s.classList.remove('open'));});
  const pin=()=>body.classList.toggle('nav-pinned');
  document.getElementById('navBurger').addEventListener('click',pin);
  document.getElementById('navFab').addEventListener('click',pin);

  // ---- app window (unchanged behaviour) ----
  const panel=document.getElementById('appPanel'),frame=document.getElementById('apFrame'),
        loader=document.getElementById('apLoader'),title=document.getElementById('apTitle'),
        dot=document.getElementById('apDot'),openLink=document.getElementById('apOpen');
  function markActive(h){document.querySelectorAll('.nav-app').forEach(b=>b.classList.toggle('active',b.dataset.href===h));}
  window.openApp=function(href,t,color){
    title.textContent=t;openLink.href=href;
    dot.style.background=color||'#c9991f';dot.style.boxShadow='0 0 8px '+(color||'#c9991f');
    panel.style.setProperty('--ap',color||'#c9991f');
    loader.style.display='flex';frame.src=href;
    panel.classList.add('open');markActive(href);
    if(window.innerWidth<=520)body.classList.remove('nav-pinned');
  };
  frame.addEventListener('load',()=>{if(frame.src&&frame.src!=='about:blank')loader.style.display='none';});
  function closeApp(){panel.classList.remove('open');markActive(null);
    setTimeout(()=>{if(!panel.classList.contains('open'))frame.src='about:blank';},320);}
  window.closeApp=closeApp;
  document.getElementById('apClose').addEventListener('click',closeApp);
  document.getElementById('apHome').addEventListener('click',closeApp);
  const nb=document.querySelector('.nav-brand');if(nb){nb.style.cursor='pointer';nb.title='Back to homepage';nb.addEventListener('click',closeApp);}
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&panel.classList.contains('open'))closeApp();});
  // after a successful login, close the re-login form
  const _save=window.saveCredentials;
  window.saveCredentials=async function(){await _save();if(document.getElementById('hp-status').classList.contains('ok')){document.documentElement.classList.remove('t-relogin');who();}};
  window.addEventListener('storage',who);
})();
</script>
